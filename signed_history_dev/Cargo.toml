[package]
autotests = false
name = "signed_history_dev"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "DEV CI proofs for Phase 1 signed history against the grant-gating reference_relay."

[lints]
workspace = true

[[bin]]
bench = false
test = false
name = "signed_history_dev"
path = "src/main.rs"

[dependencies]
app_identity_crypto = { workspace = true }
base64 = { workspace = true }
clap = { version = "4.4", features = ["derive", "env"] }
mutation_log = { path = "../mutation_log" }
relay_protocol = { path = "../relay_protocol" }
rand = "0.8"
signed_history_client = { path = "../signed_history_client" }
signed_history_materialize = { path = "../signed_history_materialize" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "charset", "http2", "json"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "time"] }
