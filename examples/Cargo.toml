[package]
name = "verify_contract_compat"
version = "0.1.0"
edition = "2021"

[workspace]

[[bin]]
name = "verify_contract_compat"
path = "verify_contract_compat.rs"

[dependencies]
lastdb_node = { path = "../lastdb_node" }
fold_db = { path = "../fold_db/crates/core" }
app_identity_crypto = { path = "../app_identity_crypto" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["blocking"] }
