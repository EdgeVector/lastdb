[workspace]
resolver = "2"
members = [
    # fold_db internal crates
    "fold_db/crates/core",
    # Pure LastDB models split out of core: data plus pure functions, no
    # clock, I/O, random ids or ambient state (scripts/ci/model-purity-lint.sh).
    "fold_db/crates/model",
    "fold_db/crates/observability",

    # schema_service crates
    "schema_service/crates/schema_types",
    "schema_service/crates/core",
    "schema_service/crates/server_lambda",

    # shared Ed25519 + JCS + signed-envelope helpers (app_identity Lane A)
    "app_identity_crypto",

    # Canonical native cloud backup wire contract; no runtime activation.
    "cloud_backup_protocol",
    # Pure unified mutation log (one log per database). No I/O.
    "mutation_log",
    # In-memory MutationLog adapter. Off unless the caller enables it.
    "mutation_log_mem",
    # Shared-sync step over that port. Off unless the caller enables it.
    "mutation_log_sync",
    # Read-only per-database cutover evidence. No I/O and no signed-only activation.
    "database_cutover",

    # minimal headless LastDB daemon (`lastdbd`) — core DB + app-identity +
    # cloud sync over the owner Unix socket (no ingestion, no discovery, no
    # UI). The Homebrew `edgevector/lastdb/lastdb` formula ships this binary.
    # (The fold_db_node desktop node + Tauri app + file_to_markdown were
    # deleted in the Mini-only cutover, 2026-07-12 — restore point: branch
    # archive/desktop-dmg-pre-removal.)
    "lastdb_node",

    # Storage-v2 crates vendored from LastDB Nano so fold's forge checkout can
    # compile the feature-gated Mini facade without requiring sibling repos.
    "vendor/laststore",

]

# Default scope for bare `cargo build` / `cargo check` (no -p / --workspace):
# the default product crates.
default-members = [
    "fold_db/crates/core",
    "fold_db/crates/model",
    "fold_db/crates/observability",
    "schema_service/crates/schema_types",
    "schema_service/crates/core",
    "schema_service/crates/server_lambda",
    "app_identity_crypto",
    "lastdb_node",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

# Lint floor for the whole workspace. Any new code that holds a sync
# lock across an `.await` must either be refactored to drop the guard
# first OR carry an explicit `#[allow(clippy::await_holding_lock,
# reason = "...")]` with a real justification. Stops the regression
# pattern where someone silently adds another `#[allow]` and the count
# creeps back up.
#
# `too_many_arguments` is denied on the same theory: when a function
# grows past clippy's default threshold, the choice should be conscious
# — either bundle the args into a struct or carry
# `#[allow(..., reason = "...")]` naming the contract (actix handler
# shape, trait impl, FFI ABI, etc.).
#
# `unused_async` is denied so an `async fn` that never `.await`s either
# drops the keyword (and its `.await` call sites) OR carries an explicit
# `#[allow(clippy::unused_async, reason = "...")]` naming why the
# signature is contract-locked (actix/lambda handler shape, framework-
# agnostic handler layer, extractor dispatch contract, etc.).
#
# `needless_pass_by_value` is denied so a function that takes an owned
# argument but only borrows it must either switch to `&T` / `&mut T` OR
# carry `#[allow(clippy::needless_pass_by_value, reason = "...")]`
# naming the callback / trait / framework contract that pins the
# signature (map_err callback, SentryLayer event_mapper, match-arm
# error→response conversion, etc.).
#
# `redundant_closure_for_method_calls` is denied so a closure that only
# forwards its argument to a method (`|x| x.foo()`) must either be
# rewritten as a method reference (`Type::foo`) OR carry
# `#[allow(clippy::redundant_closure_for_method_calls, reason = "...")]`
# naming the macro / generic / multi-type contract that pins the
# closure form (e.g. `for_each_variant!` expanding the same body across
# multiple distinct types).
#
# `manual_let_else` is denied so a `let x = match expr { Ok(v) => v,
# Err(_) => return ... }` pattern must either be rewritten as
# `let Ok(v) = expr else { return ... };` OR carry
# `#[allow(clippy::manual_let_else, reason = "...")]` naming the reason
# the rewrite doesn't apply (e.g. genuinely multi-statement error arm,
# transformation in the success arm).
#
# `use_self` is denied so that inside an `impl Foo` block, references to
# `Foo` (in return types, associated function paths, struct literals,
# enum variant constructors) are written as `Self` instead. Keeps
# renames cheap and reads consistent. Override per-line with
# `#[allow(clippy::use_self, reason = "...")]` when the explicit type
# name genuinely disambiguates (generic-bound ambiguity, derive-macro
# expansion, etc.).
#
# `if_not_else` is denied so that `if !cond { A } else { B }` blocks are
# rewritten as `if cond { B } else { A }` — the affirmative reading puts
# the natural happy path first. Override per-line with
# `#[allow(clippy::if_not_else, reason = "...")]` when the negative
# reading is genuinely the natural form (e.g. happy-path branch is much
# larger than the else branch, so flipping would push the dominant work
# into the else block).
#
# `redundant_else` is denied so that `if cond { ...; return X; } else { Y }`
# blocks are flattened to `if cond { ...; return X; } Y` — the `else` is
# noise when the `if` body diverges (return/break/continue/panic), and
# the dedent lets the happy path read top-to-bottom. Override per-line
# with `#[allow(clippy::redundant_else, reason = "...")]` when the
# `else` visually pairs with the guard for readers.
#
# `map_unwrap_or` is denied so that `.map(f).unwrap_or(d)` /
# `.map(f).unwrap_or_else(g)` collapse to `.map_or(d, f)` /
# `.map_or_else(g, f)` — the single-shot form avoids the intermediate
# `Option<U>` and reads more directly. (Boolean predicate cases often
# rewrite to `.is_some_and(f)` / `.is_ok_and(f)` instead, which clippy
# suggests automatically.) Override per-line with
# `#[allow(clippy::map_unwrap_or, reason = "...")]` when the two-stage
# form is genuinely clearer (multi-line closure, non-trivial default).
#
# `needless_for_each` is denied so that `iter.for_each(|x| { ... })` is
# rewritten as `for x in iter { ... }` — the for-loop form supports
# early returns and `?`, and matches the dominant control-flow shape in
# the rest of the codebase. The `.for_each` form is preferred only
# inside `rayon` parallel pipelines, which clippy already excludes.
# Override per-line with
# `#[allow(clippy::needless_for_each, reason = "...")]` when the chain
# genuinely reads worse broken (e.g. macro-generated code).
#
# `default_trait_access` is denied so that `Default::default()` calls
# are written as `<Type>::default()` — naming the concrete type at the
# call site means a reader doesn't have to chase the inferred type
# through a surrounding annotation, struct field declaration, or
# function signature to know what's being constructed. Override
# per-line with `#[allow(clippy::default_trait_access, reason = "...")]`
# only when the type is genuinely opaque (e.g. behind a fully generic
# bound `T: Default`).
#
# `implicit_clone` is denied so that `.to_owned()` / `.to_string()` /
# `.to_path_buf()` calls on a type that *already* owns its data
# (`String`, `PathBuf`, etc.) are rewritten as `.clone()` — the latter
# surfaces the duplication at the call site and makes performance
# review easier. The conversion-style methods read like type coercions
# and hide the allocation. Override per-line with
# `#[allow(clippy::implicit_clone, reason = "...")]` when the
# conversion crosses a borrow boundary that `.clone()` doesn't express.
#
# `cloned_instead_of_copied` is denied so that `.cloned()` on an
# iterator of `Copy` items is written as `.copied()` — `.copied()`
# tells the reader the element is a plain `Copy` value, not a
# heap-allocating clone, which keeps `.cloned()` semantically meaningful
# (it now always signals a real clone). Override per-line with
# `#[allow(clippy::cloned_instead_of_copied, reason = "...")]` only when
# the element type is `Copy` solely through a generic bound that a
# reader can't see at the call site.
#
# `single_match_else` is denied so that `match x { P(v) => a, _ => b }`
# shapes — one bound-pattern arm plus a non-trivial wildcard arm — are
# rewritten as `if let P(v) = x { a } else { b }`. The if-let form puts
# the happy path first and reads top-to-bottom; the `match` form is
# noise when only one arm actually binds. Override per-line with
# `#[allow(clippy::single_match_else, reason = "...")]` when the match
# form is genuinely clearer (e.g. multi-pattern arm with guards that
# don't translate, or matching a value that's about to be matched again
# downstream).
#
# `inefficient_to_string` is denied so that `.to_string()` on a
# double-reference (`&&str`, `&&T`, `&&&T`, …) is written against a
# single deref instead. Calling `.to_string()` through the extra
# reference layer dispatches via the blanket `ToString` impl on `&T`,
# which routes through the slow `Display` formatting machinery; a single
# `&str`/`&T` hits the specialized fast path. Override per-line with
# `#[allow(clippy::inefficient_to_string, reason = "...")]` only when the
# extra reference is load-bearing (e.g. it falls out of a generic bound
# the call site can't flatten).
#
# `uninlined_format_args` is denied so that `format!("{}", x)` /
# `println!("{}", x)` — a positional argument that is a bare variable —
# is rewritten as `format!("{x}")` with the binding captured directly
# in the braces. The inline form keeps each value next to the
# placeholder it fills, so a reader never has to count positions to
# match a `{}` to its argument; it's the modern idiom since
# captured-identifier interpolation stabilized. Only bare-identifier
# args inline — field/method/index expressions, width/precision args,
# and anything else stay positional and are left untouched. Override
# per-line with `#[allow(clippy::uninlined_format_args, reason = "...")]`
# when the positional form is genuinely clearer.
#
# `unnested_or_patterns` is denied so that sibling or-patterns sharing an
# enclosing constructor — `Some(0) | Some(1)`, `Ok(A) | Ok(B)` — are
# nested into a single alternation: `Some(0 | 1)`, `Ok(A | B)`. The
# nested form names the shared structure once and scopes the `|` to the
# part that actually varies, so a reader doesn't diff two near-identical
# patterns to spot the difference. Override per-line with
# `#[allow(clippy::unnested_or_patterns, reason = "...")]` when the flat
# form genuinely reads clearer (e.g. the alternatives are semantically
# distinct cases that happen to share a constructor).
#
# `needless_lifetimes` is denied so that explicit lifetime parameters the
# compiler can already infer through elision — `fn f<'a>(x: &'a str) ->
# &'a str`, `impl<'a> Trait for T<'a> { fn g(&'a self) ... }` where the
# annotation adds nothing — are dropped to the elided form (`fn f(x:
# &str) -> &str`). The annotations are pure noise when elision produces
# the identical signature, and removing them keeps the lifetimes that
# *are* load-bearing visible instead of lost in boilerplate. Override
# per-line with `#[allow(clippy::needless_lifetimes, reason = "...")]`
# when the explicit lifetime is genuinely required (e.g. it documents a
# relationship elision can't express, or the elided form fails to
# compile).
[workspace.lints.clippy]
await_holding_lock = "deny"
too_many_arguments = "deny"
unused_async = "deny"
needless_pass_by_value = "deny"
redundant_closure_for_method_calls = "deny"
manual_let_else = "deny"
use_self = "deny"
semicolon_if_nothing_returned = "deny"
if_not_else = "deny"
redundant_else = "deny"
map_unwrap_or = "deny"
needless_for_each = "deny"
default_trait_access = "deny"
implicit_clone = "deny"
cloned_instead_of_copied = "deny"
single_match_else = "deny"
inefficient_to_string = "deny"
uninlined_format_args = "deny"
explicit_iter_loop = "deny"
unnested_or_patterns = "deny"
match_same_arms = "deny"
unnecessary_lazy_evaluations = "deny"
manual_string_new = "deny"
explicit_into_iter_loop = "deny"
filter_map_next = "deny"
unnecessary_to_owned = "deny"
map_clone = "deny"
redundant_pattern_matching = "deny"
needless_return = "deny"
manual_map = "deny"
redundant_field_names = "deny"
needless_lifetimes = "deny"
# Flags `let x = <expr>;` immediately followed by `x` as the tail
# expression — return `<expr>` directly instead. Clippy already spares
# cases where the binding extends a borrow's lifetime or a type
# annotation is load-bearing. For a genuinely-justified site, opt out
# per-line: #[allow(clippy::let_and_return, reason = "...")].
let_and_return = "deny"
# manual_ok_or: flags Option->Result reimplementations like
# `opt.map_or(Err(e), Ok)` or an equivalent match/if-let; rewrite as
# `.ok_or(e)` / `.ok_or_else(|| e)`. For a genuinely clearer site, escape
# per-line with `#[allow(clippy::manual_ok_or, reason = "...")]`.
manual_ok_or = "deny"
# useless_conversion: flags conversions of a value into its own type —
# `.into()`, `.try_into()`, `T::from(x)`, or `.into_iter()` on something
# already that type — which are no-ops; drop the redundant conversion. For
# a genuinely-justified site (e.g. a conversion kept to pin a type
# inference path), escape per-line with
# `#[allow(clippy::useless_conversion, reason = "...")]`.
useless_conversion = "deny"
# manual_filter_map: flags a `.filter(...).map(...)` (or
# `.find(...).map(...)`) chain that can collapse into a single
# `.filter_map(...)` (or `.find_map(...)`). The fused form computes the
# mapped value once instead of testing then re-deriving it. For a
# genuinely clearer site, escape per-line with
# `#[allow(clippy::manual_filter_map, reason = "...")]`.
manual_filter_map = "deny"
# match_like_matches_macro: flags a `match` (or `if let ... else`)
# expression whose only purpose is to produce a boolean — every arm
# returns `true` or `false`. Rewrite with the `matches!` macro
# (`matches!(x, Pat)`), which names the test once and reads as a
# predicate rather than a control-flow split. For a genuinely-justified
# site, escape per-line with
# `#[allow(clippy::match_like_matches_macro, reason = "...")]`.
match_like_matches_macro = "deny"
# manual_unwrap_or: flags a `match` / `if let` that reimplements
# `Option::unwrap_or` or `Result::unwrap_or` — e.g.
# `match opt { Some(x) => x, None => default }`. Rewrite as
# `.unwrap_or(default)` (or `.unwrap_or_else(|| ...)` when the default
# has side effects or is expensive — eager vs lazy matters). For a
# genuinely-justified site, escape per-line with
# `#[allow(clippy::manual_unwrap_or, reason = "...")]`.
manual_unwrap_or = "deny"
# needless_collect: flags a `.collect()` into a temporary that is then
# immediately consumed/iterated — e.g.
# `let v: Vec<_> = it.collect(); v.iter()...`,
# `.collect::<Vec<_>>().len()`, `.collect::<Vec<_>>().is_empty()`. The
# intermediate allocation can be skipped by consuming the iterator
# directly (`.count()`, `.any()`, `.next()`, direct iteration). For a
# genuinely-justified site (e.g. the collect drains a borrow before a
# later mutable use, or the Vec is reused), escape per-line with
# `#[allow(clippy::needless_collect, reason = "...")]`.
needless_collect = "deny"
# redundant_clone: flags a `.clone()` whose result is dropped without
# further use — typically the last use of an owned value before it goes
# out of scope, or a `.clone()` immediately consumed by a function that
# only needs a borrow (e.g. `serde_json::json!(x.clone())` — the macro
# already borrows internally). Drop the `.clone()` and let the value
# move (or pass by reference). For a genuinely-justified site (e.g. the
# borrow checker insists despite appearances), escape per-line with
# `#[allow(clippy::redundant_clone, reason = "...")]`.
redundant_clone = "deny"

[workspace.dependencies]
# Internal crates — path deps. The dual-fold_db trap dies here:
# cargo unifies path deps by definition, so there is only one fold_db.
fold_db = { path = "fold_db/crates/core" }
lastdb_model = { path = "fold_db/crates/model" }
observability = { path = "fold_db/crates/observability", default-features = false }
schema_types = { path = "schema_service/crates/schema_types" }
schema_service_core = { path = "schema_service/crates/core" }
app_identity_crypto = { path = "app_identity_crypto" }
laststore = { path = "vendor/laststore" }

tracing = "0.1"
http = "1"
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
semver = "1"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "signal"] }
tempfile = "3.8"
tracing-subscriber = "0.3"

# Promoted from member crates (2026-05-21 audit) — these were each
# duplicated across 3+ workspace members with identical versions before
# being lifted here. Per-member feature sets stay on the member entries
# (`features = [...]`); bare versions here mean "use whatever features
# each consumer asks for, unified by cargo at build time".
#
# Deliberately NOT promoted in this pass:
#   - reqwest, chrono: feature/default-features sets diverge per member;
#     workspace-level unification would change the effective feature set.
#
# Later additions:
base64 = "0.22"
# Still "1" on purpose: opentelemetry 0.27 pins thiserror 1, so bumping this
# key to 2 converges nothing (both majors stay in the graph) and only risks the
# derive surface. Converging thiserror needs the opentelemetry 0.27 -> 0.28+
# bump first.
thiserror = "1"
async-trait = "0.1"
sha2 = "0.10"
uuid = "1.0"
sentry = { version = "0.47", default-features = false }
rand = "0.8"
once_cell = "1"
hmac = "0.12"
futures = "0.3"
# Defense-in-depth: scrub key material from freed memory on drop. `derive`
# gives `#[derive(Zeroize, ZeroizeOnDrop)]`. Already in Cargo.lock (transitive
# via ed25519-dalek); promoted to a direct workspace dep for crypto crates.
zeroize = { version = "1.8", features = ["derive"] }

[profile.dev-release]
inherits = "release"
opt-level = 3
lto = "off"
codegen-units = 16
debug = false
panic = "abort"
