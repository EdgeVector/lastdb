[package]
name = "relay_transfer"
version = "0.1.0"
edition.workspace = true
publish = false
autotests = false
description = "Presigned blob uploads to the object store: the one uploader of the node and the relay e2e proof."

[dependencies]
futures = { workspace = true }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "charset", "http2", "stream"] }
tokio = { workspace = true, features = ["time", "rt"] }

[lints]
workspace = true

[lib]
test = false
doctest = false
bench = false
