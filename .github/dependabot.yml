version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      cargo:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /lastdb_app_sdk
    schedule:
      interval: weekly
      day: monday
    groups:
      npm:
        patterns:
          - "*"
