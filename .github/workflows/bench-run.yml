name: LastDB benchmark measurement

on:
  workflow_call:
    inputs:
      baseline:
        type: string
        required: true
      candidate:
        type: string
        required: true
      driver:
        type: string
        required: true
      profile:
        type: string
        default: standard
      investigation:
        type: boolean
        default: false
      resource_only:
        type: boolean
        default: false
      disk_excess:
        type: boolean
        default: false
      legacy_cache_upgrade:
        type: boolean
        default: false
      ttl_active:
        type: boolean
        default: false
      baseline_workers:
        type: string
        default: "0"
      candidate_workers:
        type: string
        default: "0"

permissions:
  contents: read
  actions: read

jobs:
  measure:
    name: Reads, durable writes, and concurrency (advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      CARGO_BUILD_JOBS: "4"
      CARGO_TERM_COLOR: always
      BENCH_PROFILE: ${{ inputs.profile }}
      BENCH_INVESTIGATION: ${{ inputs.investigation }}
      BENCH_BASELINE_WORKERS: ${{ inputs.baseline_workers }}
      BENCH_CANDIDATE_WORKERS: ${{ inputs.candidate_workers }}
    steps:
      - name: Prepare external result directory
        run: |
          result_dir="$RUNNER_TEMP/lastdb-benchmarks-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$result_dir"
          echo "BENCH_OUTPUT=$result_dir" >> "$GITHUB_ENV"
          echo "BENCH_BINARY_ROOT=$RUNNER_TEMP/benchmark-programs" >> "$GITHUB_ENV"

      - name: Checkout benchmark driver from the workflow revision
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.driver }}
          path: driver
          persist-credentials: false

      - name: Check benchmark script syntax
        run: python3 -m py_compile driver/scripts/benchmarks/*.py

      - name: Checkout exact candidate product source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.candidate }}
          path: candidate
          persist-credentials: false

      - name: Checkout exact baseline product source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.baseline }}
          path: baseline
          persist-credentials: false

      - name: Check space for two fresh builds and the selected corpus
        id: disk-build
        run: python3 driver/scripts/benchmarks/disk.py --profile "$BENCH_PROFILE" --phase build

      - name: Reclaim disk space only when the build budget needs it
        if: steps.disk-build.outputs.cleanup-required == 'true'
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Require the build and corpus disk budget
        run: python3 driver/scripts/benchmarks/disk.py --profile "$BENCH_PROFILE" --phase build --require

      - name: Select one Rust toolchain for both builds
        working-directory: candidate
        run: |
          set -euo pipefail
          rustup show active-toolchain
          toolchain="$(rustup show active-toolchain | cut -d ' ' -f 1)"
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"

      - name: Identify compatible native toolchain and exact build recipe
        id: build-context
        run: python3 driver/scripts/benchmarks/build.py context --output "$BENCH_OUTPUT/build-context.json"

      - name: Cache dependency downloads only
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
          key: benchmark-downloads-${{ runner.os }}-${{ hashFiles('candidate/Cargo.lock', 'baseline/Cargo.lock') }}
          restore-keys: benchmark-downloads-${{ runner.os }}-

      # Build the candidate first. Main publishes it before any baseline work;
      # PR candidate compilation overlaps that trusted cache producer.
      - name: Build the exact candidate from fresh source
        env:
          CANDIDATE_SHA: ${{ inputs.candidate }}
        run: |
          set -euo pipefail
          rustc --version --verbose > "$BENCH_OUTPUT/toolchain.txt"
          python3 driver/scripts/benchmarks/build.py build \
            --source candidate --revision "$CANDIDATE_SHA" --label candidate \
            --context "$BENCH_OUTPUT/build-context.json" \
            --cache "$BENCH_BINARY_ROOT" --output "$BENCH_OUTPUT"

      # Only trusted main pushes publish programs that other PRs can reuse.
      # Cache availability never substitutes for measurements or verified uploads.
      - name: Save the accepted candidate for future baselines
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/benchmark-programs/${{ inputs.candidate }}
          key: lastdb-benchmark-program-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.build-context.outputs.fingerprint }}-${{ inputs.candidate }}

      - name: Restore the exact baseline program
        id: baseline-build
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/benchmark-programs/${{ inputs.baseline }}
          key: lastdb-benchmark-program-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.build-context.outputs.fingerprint }}-${{ inputs.baseline }}

      - name: Await an active trusted main cache producer
        id: baseline-ready
        if: steps.baseline-build.outputs.cache-hit != 'true' && !(github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_SHA: ${{ inputs.baseline }}
          BASELINE_KEY: lastdb-benchmark-program-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.build-context.outputs.fingerprint }}-${{ inputs.baseline }}
        run: python3 driver/scripts/benchmarks/cache.py --revision "$BASELINE_SHA" --key "$BASELINE_KEY"

      - name: Restore the baseline after the main cache upload
        id: baseline-retry
        if: steps.baseline-ready.outputs.ready == 'true'
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/benchmark-programs/${{ inputs.baseline }}
          key: lastdb-benchmark-program-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.build-context.outputs.fingerprint }}-${{ inputs.baseline }}

      - name: Prepare the verified baseline
        env:
          BASELINE_SHA: ${{ inputs.baseline }}
          BASELINE_CACHE_HIT: ${{ steps.baseline-build.outputs.cache-hit == 'true' || steps.baseline-retry.outputs.cache-hit == 'true' }}
        run: |
          set -euo pipefail
          args=()
          if [ "$BASELINE_CACHE_HIT" = true ]; then args+=(--reuse); fi
          python3 driver/scripts/benchmarks/build.py build "${args[@]}" \
            --source baseline --revision "$BASELINE_SHA" --label baseline \
            --context "$BENCH_OUTPUT/build-context.json" \
            --cache "$BENCH_BINARY_ROOT" --output "$BENCH_OUTPUT"

      - name: Save the exact baseline program on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.baseline-build.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/benchmark-programs/${{ inputs.baseline }}
          key: lastdb-benchmark-program-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.build-context.outputs.fingerprint }}-${{ inputs.baseline }}

      - name: Check corpus space after both programs are ready
        id: disk-measure
        run: python3 driver/scripts/benchmarks/disk.py --profile "$BENCH_PROFILE" --phase measure

      - name: Reclaim disk space only when the corpus budget needs it
        if: steps.disk-measure.outputs.cleanup-required == 'true'
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Require corpus space before measurements
        run: python3 driver/scripts/benchmarks/disk.py --profile "$BENCH_PROFILE" --phase measure --require

      - name: Attribute v2 disk excess in separate generated homes
        if: inputs.disk_excess
        env:
          CANDIDATE_SHA: ${{ inputs.candidate }}
          BASELINE_SHA: ${{ inputs.baseline }}
          DRIVER_SHA: ${{ inputs.driver }}
        run: |
          timeout --signal=TERM --kill-after=120s 40m \
            python3 driver/scripts/benchmarks/disk_excess.py \
              --baseline "$BENCH_BINARY_ROOT/$BASELINE_SHA/lastdbd" \
              --candidate "$BENCH_BINARY_ROOT/$CANDIDATE_SHA/lastdbd" \
              --baseline-revision "$BASELINE_SHA" \
              --candidate-revision "$CANDIDATE_SHA" \
              --driver-revision "$DRIVER_SHA" --output "$BENCH_OUTPUT/disk-excess"

      - name: Measure alternating baseline and candidate pairs
        if: ${{ !inputs.resource_only }}
        id: measurement
        env:
          CANDIDATE_SHA: ${{ inputs.candidate }}
          BASELINE_SHA: ${{ inputs.baseline }}
          DRIVER_SHA: ${{ inputs.driver }}
        run: |
          args=()
          if [ "$BENCH_INVESTIGATION" = true ]; then args+=(--pairs 4); fi
          timeout --signal=TERM --kill-after=120s 65m \
            python3 driver/scripts/benchmarks/run.py \
              --baseline "$BENCH_BINARY_ROOT/$BASELINE_SHA/lastdbd" \
              --candidate "$BENCH_BINARY_ROOT/$CANDIDATE_SHA/lastdbd" \
              --baseline-revision "$BASELINE_SHA" \
              --candidate-revision "$CANDIDATE_SHA" \
              --baseline-workers "$BENCH_BASELINE_WORKERS" \
              --candidate-workers "$BENCH_CANDIDATE_WORKERS" \
              --driver-revision "$DRIVER_SHA" \
              --profile "$BENCH_PROFILE" --output "$BENCH_OUTPUT" "${args[@]}"

      - name: Repeat speed measurements only when an advisory limit is crossed
        if: ${{ !inputs.resource_only }}
        id: speed-confirmation
        run: |
          timeout --signal=TERM --kill-after=120s 65m \
            python3 driver/scripts/benchmarks/confirm.py --kind speed --output "$BENCH_OUTPUT"

      - name: Measure an actual upgrade with old retry records
        if: inputs.legacy_cache_upgrade && !inputs.resource_only
        id: legacy-upgrade
        env:
          CANDIDATE_SHA: ${{ inputs.candidate }}
          BASELINE_SHA: ${{ inputs.baseline }}
          DRIVER_SHA: ${{ inputs.driver }}
        run: |
          timeout --signal=TERM --kill-after=120s 40m \
            python3 driver/scripts/benchmarks/run.py \
              --baseline "$BENCH_BINARY_ROOT/$BASELINE_SHA/lastdbd" \
              --candidate "$BENCH_BINARY_ROOT/$CANDIDATE_SHA/lastdbd" \
              --baseline-revision "$BASELINE_SHA" \
              --candidate-revision "$CANDIDATE_SHA" \
              --driver-revision "$DRIVER_SHA" \
              --profile standard --pairs 1 --seed-with-baseline --minimum-retired 10000 \
              --output "$BENCH_OUTPUT/legacy-cache-upgrade"

      - name: Repeat the upgrade comparison only when an advisory limit is crossed
        if: inputs.legacy_cache_upgrade && !inputs.resource_only
        id: legacy-confirmation
        run: |
          timeout --signal=TERM --kill-after=120s 40m \
            python3 driver/scripts/benchmarks/confirm.py --kind speed --output "$BENCH_OUTPUT/legacy-cache-upgrade"

      - name: Measure disk and memory growth in fresh generated homes
        id: growth
        env:
          CANDIDATE_SHA: ${{ inputs.candidate }}
          BASELINE_SHA: ${{ inputs.baseline }}
          DRIVER_SHA: ${{ inputs.driver }}
        run: |
          timeout --signal=TERM --kill-after=120s 40m \
            python3 driver/scripts/benchmarks/run.py \
              --baseline "$BENCH_BINARY_ROOT/$BASELINE_SHA/lastdbd" \
              --candidate "$BENCH_BINARY_ROOT/$CANDIDATE_SHA/lastdbd" \
              --baseline-revision "$BASELINE_SHA" \
              --candidate-revision "$CANDIDATE_SHA" \
              --baseline-workers "$BENCH_BASELINE_WORKERS" \
              --candidate-workers "$BENCH_CANDIDATE_WORKERS" \
              --driver-revision "$DRIVER_SHA" \
              --profile "$BENCH_PROFILE" --growth-only --output "$BENCH_OUTPUT/resource-growth"

      - name: Repeat resource measurements only when an advisory limit is crossed
        id: growth-confirmation
        run: |
          timeout --signal=TERM --kill-after=120s 40m \
            python3 driver/scripts/benchmarks/confirm.py --kind growth --output "$BENCH_OUTPUT/resource-growth"

      - name: Measure v2 disk size against logical atom bytes
        id: disk-budget
        env:
          CANDIDATE_SHA: ${{ inputs.candidate }}
          BASELINE_SHA: ${{ inputs.baseline }}
          DRIVER_SHA: ${{ inputs.driver }}
        run: |
          timeout --signal=TERM --kill-after=120s 40m \
            python3 driver/scripts/benchmarks/run.py \
              --baseline "$BENCH_BINARY_ROOT/$BASELINE_SHA/lastdbd" \
              --candidate "$BENCH_BINARY_ROOT/$CANDIDATE_SHA/lastdbd" \
              --baseline-revision "$BASELINE_SHA" \
              --candidate-revision "$CANDIDATE_SHA" \
              --baseline-workers "$BENCH_BASELINE_WORKERS" \
              --candidate-workers "$BENCH_CANDIDATE_WORKERS" \
              --driver-revision "$DRIVER_SHA" \
              --profile "$BENCH_PROFILE" --disk-budget-only --output "$BENCH_OUTPUT/disk-budget"

      - name: Repeat v2 disk size only when a size limit is crossed
        id: disk-budget-confirmation
        run: |
          timeout --signal=TERM --kill-after=120s 40m \
            python3 driver/scripts/benchmarks/confirm.py --kind disk --output "$BENCH_OUTPUT/disk-budget"

      - name: Measure default-off Search and a full queue without a consumer
        run: |
          timeout --signal=TERM --kill-after=120s 30m python3 driver/scripts/benchmarks/search_queue.py \
            --candidate "$BENCH_BINARY_ROOT/${{ inputs.candidate }}/lastdbd" \
            --candidate-revision "${{ inputs.candidate }}" --driver-revision "${{ inputs.driver }}" \
            --profile "$BENCH_PROFILE" --output "$BENCH_OUTPUT/search-queue"

      - name: Capture native phases in separate generated homes
        if: inputs.investigation
        env:
          CANDIDATE_SHA: ${{ inputs.candidate }}
          BASELINE_SHA: ${{ inputs.baseline }}
          DRIVER_SHA: ${{ inputs.driver }}
        run: |
          timeout --signal=TERM --kill-after=120s 20m \
            python3 driver/scripts/benchmarks/run.py \
              --baseline "$BENCH_BINARY_ROOT/$BASELINE_SHA/lastdbd" \
              --candidate "$BENCH_BINARY_ROOT/$CANDIDATE_SHA/lastdbd" \
              --baseline-revision "$BASELINE_SHA" \
              --candidate-revision "$CANDIDATE_SHA" \
              --baseline-workers "$BENCH_BASELINE_WORKERS" \
              --candidate-workers "$BENCH_CANDIDATE_WORKERS" \
              --driver-revision "$DRIVER_SHA" \
              --profile standard --pairs 1 --native-timing --output "$BENCH_OUTPUT/native-diagnostics"

      - name: Measure writes with active TTL and full compaction
        if: inputs.ttl_active && !inputs.resource_only
        env:
          CANDIDATE_SHA: ${{ inputs.candidate }}
          BASELINE_SHA: ${{ inputs.baseline }}
          DRIVER_SHA: ${{ inputs.driver }}
        run: |
          timeout --signal=TERM --kill-after=120s 90m \
            python3 driver/scripts/benchmarks/ttl_latency.py \
              --baseline "$BENCH_BINARY_ROOT/$BASELINE_SHA/lastdbd" \
              --candidate "$BENCH_BINARY_ROOT/$CANDIDATE_SHA/lastdbd" \
              --baseline-revision "$BASELINE_SHA" \
              --candidate-revision "$CANDIDATE_SHA" \
              --driver-revision "$DRIVER_SHA" --output "$BENCH_OUTPUT/ttl-active"

      - name: Record remaining runner space
        if: always()
        run: python3 driver/scripts/benchmarks/disk.py --profile "$BENCH_PROFILE" --phase finish

      - name: Publish benchmark summary
        if: ${{ always() && !inputs.resource_only }}
        env:
          MEASUREMENT_OUTCOME: ${{ steps.measurement.outcome }}
          CONFIRMATION_OUTCOME: ${{ steps.speed-confirmation.outcome }}
        run: |
          python3 driver/scripts/benchmarks/report.py --output "$BENCH_OUTPUT" \
            --job-status "$MEASUREMENT_OUTCOME" --confirmation-status "$CONFIRMATION_OUTCOME"

      - name: Publish the old retry-record upgrade measurement
        if: always() && inputs.legacy_cache_upgrade && !inputs.resource_only
        env:
          UPGRADE_OUTCOME: ${{ steps.legacy-upgrade.outcome }}
          CONFIRMATION_OUTCOME: ${{ steps.legacy-confirmation.outcome }}
        run: |
          python3 driver/scripts/benchmarks/report.py \
            --output "$BENCH_OUTPUT/legacy-cache-upgrade" --job-status "$UPGRADE_OUTCOME" \
            --confirmation-status "$CONFIRMATION_OUTCOME"

      - name: Publish separate native diagnostic summary
        if: always() && inputs.investigation
        run: python3 driver/scripts/benchmarks/native_report.py --output "$BENCH_OUTPUT/native-diagnostics"

      - name: Publish advisory disk and memory growth summary
        if: always()
        env:
          GROWTH_OUTCOME: ${{ steps.growth.outcome }}
          CONFIRMATION_OUTCOME: ${{ steps.growth-confirmation.outcome }}
        run: |
          python3 driver/scripts/benchmarks/growth_report.py \
            --output "$BENCH_OUTPUT/resource-growth" --job-status "$GROWTH_OUTCOME" \
            --confirmation-status "$CONFIRMATION_OUTCOME"

      - name: Publish the advisory v2 disk size budget
        if: always()
        env:
          GROWTH_OUTCOME: ${{ steps.disk-budget.outcome }}
          CONFIRMATION_OUTCOME: ${{ steps.disk-budget-confirmation.outcome }}
        run: |
          python3 driver/scripts/benchmarks/disk_budget_report.py \
            --output "$BENCH_OUTPUT/disk-budget" --job-status "$GROWTH_OUTCOME" \
            --confirmation-status "$CONFIRMATION_OUTCOME"

      - name: Upload measurements and build receipts
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lastdb-benchmarks-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.BENCH_OUTPUT }}/
          retention-days: 14
          if-no-files-found: error

      - name: Verify upload and record its download receipt
        if: ${{ always() && steps.upload.outcome == 'success' }}
        id: receipt
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ARTIFACT_SHA256: ${{ steps.upload.outputs.artifact-digest }}
          CANDIDATE_SHA: ${{ inputs.candidate }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > "$RUNNER_TEMP/benchmark-artifact-metadata.json"
          python3 driver/scripts/benchmarks/artifact.py \
            --metadata "$RUNNER_TEMP/benchmark-artifact-metadata.json" \
            --output "$RUNNER_TEMP/benchmark-download-receipt"

      - name: Retain the compact download receipt
        if: ${{ always() && steps.receipt.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: lastdb-benchmark-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/benchmark-download-receipt/artifact.json
          retention-days: 14
          if-no-files-found: error
