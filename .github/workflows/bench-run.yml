name: LastDB benchmark measurement

on:
  workflow_call:
    inputs:
      baseline:
        type: string
        required: true
      candidate:
        type: string
        required: true
      driver:
        type: string
        required: true
      profile:
        type: string
        default: standard
      investigation:
        type: boolean
        default: false
      writer16:
        type: boolean
        default: false
      resource_only:
        type: boolean
        default: false
      baseline_workers:
        type: string
        default: "0"
      candidate_workers:
        type: string
        default: "0"

permissions:
  contents: read
  actions: read

jobs:
  build:
    uses: ./.github/workflows/bench-build.yml
    with:
      baseline: ${{ inputs.baseline }}
      candidate: ${{ inputs.candidate }}
      driver: ${{ inputs.driver }}
      profile: ${{ inputs.profile }}

  measure:
    name: ${{ matrix.lane }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.lane == 'speed' && 350 || (matrix.lane == 'growth' || matrix.lane == 'capture') && 130 || 90 }}
    strategy:
      # A speed failure must not cancel the independent disk/delete cap.
      fail-fast: false
      matrix:
        lane: >-
          ${{ fromJSON(format('["disk", "growth"{0}{1}]',
              !inputs.resource_only && ', "speed", "capture"' || '',
              !inputs.resource_only && inputs.writer16 && ', "writers"' || '')) }}
    env:
      BENCH_PROFILE: ${{ inputs.profile }}
      BENCH_INVESTIGATION: ${{ inputs.investigation }}
      BENCH_BASELINE_WORKERS: ${{ inputs.baseline_workers }}
      BENCH_CANDIDATE_WORKERS: ${{ inputs.candidate_workers }}
      SPEED_TIMEOUT: ${{ inputs.profile == 'nightly' && '90m' || '65m' }}
    steps:
      - name: Prepare external result directory
        run: |
          result_dir="$RUNNER_TEMP/lastdb-benchmarks-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$result_dir"
          echo "BENCH_OUTPUT=$result_dir" >> "$GITHUB_ENV"
          echo "BENCH_BINARY_ROOT=$RUNNER_TEMP/benchmark-programs" >> "$GITHUB_ENV"

      - name: Checkout benchmark driver from the workflow revision
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.driver }}
          path: driver
          persist-credentials: false

      - name: Download programs from this run's successful build job
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: ${{ runner.temp }}/benchmark-build
          merge-multiple: true

      - name: Verify and unpack the shared programs before measurements
        env:
          BASELINE_SHA: ${{ inputs.baseline }}
          CANDIDATE_SHA: ${{ inputs.candidate }}
          BUILD_CONTEXT: ${{ needs.build.outputs.context }}
          BUNDLE_SHA256: ${{ needs.build.outputs.bundle_sha256 }}
        run: |
          python3 driver/scripts/benchmarks/build.py unpack \
            --root "$BENCH_BINARY_ROOT" --archive "$RUNNER_TEMP/benchmark-build/programs.tar.gz"

      - name: Check corpus space after both programs are ready
        id: disk-measure
        run: python3 driver/scripts/benchmarks/plan.py disk --profile "$BENCH_PROFILE" --phase measure

      - name: Reclaim disk space only when the corpus budget needs it
        if: steps.disk-measure.outputs.cleanup-required == 'true'
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Require corpus space before measurements
        run: python3 driver/scripts/benchmarks/plan.py disk --profile "$BENCH_PROFILE" --phase measure --require

      - name: Cache the relay build
        if: matrix.lane == 'capture'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: driver -> ${{ runner.temp }}/relay-target
          key: capture-relay

      - name: Build the reference relay from the driver source
        if: matrix.lane == 'capture'
        working-directory: driver
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/relay-target
        run: cargo build --locked --release -p reference_relay --bin reference_relay

      - name: Measure what capturing a write costs the caller
        if: matrix.lane == 'capture'
        env:
          CANDIDATE_SHA: ${{ inputs.candidate }}
          BASELINE_SHA: ${{ inputs.baseline }}
        run: |
          work="$RUNNER_TEMP/capture-work"
          timeout --signal=TERM --kill-after=120s 90m \
            python3 driver/scripts/operations/capture_cost.py \
              --relay-bin "$RUNNER_TEMP/relay-target/release/reference_relay" \
              --baseline-daemon "$BENCH_BINARY_ROOT/$BASELINE_SHA/lastdbd" \
              --baseline-cli "$BENCH_BINARY_ROOT/$BASELINE_SHA/lastdb" \
              --baseline-revision "$BASELINE_SHA" \
              --candidate-daemon "$BENCH_BINARY_ROOT/$CANDIDATE_SHA/lastdbd" \
              --candidate-cli "$BENCH_BINARY_ROOT/$CANDIDATE_SHA/lastdb" \
              --candidate-revision "$CANDIDATE_SHA" \
              --output "$work"
          mkdir -p "$BENCH_OUTPUT/capture"
          cp "$work/capture-cost.json" "$BENCH_OUTPUT/capture/"

      - name: Compare 16 durable writers on six fresh generated homes
        if: matrix.lane == 'writers'
        env:
          CANDIDATE_SHA: ${{ inputs.candidate }}
          BASELINE_SHA: ${{ inputs.baseline }}
          DRIVER_SHA: ${{ inputs.driver }}
        run: |
          timeout --signal=TERM --kill-after=120s 60m \
            python3 driver/scripts/benchmarks/write_gate.py \
              --baseline "$BENCH_BINARY_ROOT/$BASELINE_SHA/lastdbd" \
              --candidate "$BENCH_BINARY_ROOT/$CANDIDATE_SHA/lastdbd" \
              --baseline-revision "$BASELINE_SHA" --candidate-revision "$CANDIDATE_SHA" \
              --driver-revision "$DRIVER_SHA" --output "$BENCH_OUTPUT/writers"

      - name: Publish the paired writer comparison
        if: always() && matrix.lane == 'writers'
        run: python3 driver/scripts/benchmarks/write_gate.py report --output "$BENCH_OUTPUT/writers"

      - name: Measure alternating baseline and candidate pairs
        if: matrix.lane == 'speed'
        id: measurement
        env:
          CANDIDATE_SHA: ${{ inputs.candidate }}
          BASELINE_SHA: ${{ inputs.baseline }}
          DRIVER_SHA: ${{ inputs.driver }}
        run: |
          args=()
          if [ "$BENCH_INVESTIGATION" = true ]; then args+=(--pairs 4); fi
          timeout --signal=TERM --kill-after=120s "$SPEED_TIMEOUT" \
            python3 driver/scripts/benchmarks/run.py \
              --baseline "$BENCH_BINARY_ROOT/$BASELINE_SHA/lastdbd" \
              --candidate "$BENCH_BINARY_ROOT/$CANDIDATE_SHA/lastdbd" \
              --baseline-revision "$BASELINE_SHA" \
              --candidate-revision "$CANDIDATE_SHA" \
              --baseline-workers "$BENCH_BASELINE_WORKERS" \
              --candidate-workers "$BENCH_CANDIDATE_WORKERS" \
              --driver-revision "$DRIVER_SHA" \
              --profile "$BENCH_PROFILE" --output "$BENCH_OUTPUT" "${args[@]}"

      - name: Repeat speed measurements only when an advisory limit is crossed
        if: matrix.lane == 'speed'
        id: speed-confirmation
        run: |
          timeout --signal=TERM --kill-after=120s "$SPEED_TIMEOUT" \
            python3 driver/scripts/benchmarks/run.py --confirm speed --output "$BENCH_OUTPUT"

      - name: Measure disk and memory growth in fresh generated homes
        if: matrix.lane == 'growth'
        id: growth
        env:
          CANDIDATE_SHA: ${{ inputs.candidate }}
          BASELINE_SHA: ${{ inputs.baseline }}
          DRIVER_SHA: ${{ inputs.driver }}
        run: |
          timeout --signal=TERM --kill-after=120s 40m \
            python3 driver/scripts/benchmarks/run.py \
              --baseline "$BENCH_BINARY_ROOT/$BASELINE_SHA/lastdbd" \
              --candidate "$BENCH_BINARY_ROOT/$CANDIDATE_SHA/lastdbd" \
              --baseline-revision "$BASELINE_SHA" \
              --candidate-revision "$CANDIDATE_SHA" \
              --baseline-workers "$BENCH_BASELINE_WORKERS" \
              --candidate-workers "$BENCH_CANDIDATE_WORKERS" \
              --driver-revision "$DRIVER_SHA" \
              --profile "$BENCH_PROFILE" --growth-only --output "$BENCH_OUTPUT/resource-growth"

      - name: Repeat resource measurements only when an advisory limit is crossed
        if: matrix.lane == 'growth'
        id: growth-confirmation
        run: |
          timeout --signal=TERM --kill-after=120s 40m \
            python3 driver/scripts/benchmarks/run.py --confirm growth --output "$BENCH_OUTPUT/resource-growth"

      - name: Measure v2 disk size against record bytes
        if: matrix.lane == 'disk'
        id: disk-budget
        env:
          CANDIDATE_SHA: ${{ inputs.candidate }}
          BASELINE_SHA: ${{ inputs.baseline }}
          DRIVER_SHA: ${{ inputs.driver }}
        run: |
          timeout --signal=TERM --kill-after=120s 40m \
            python3 driver/scripts/benchmarks/run.py \
              --baseline "$BENCH_BINARY_ROOT/$BASELINE_SHA/lastdbd" \
              --candidate "$BENCH_BINARY_ROOT/$CANDIDATE_SHA/lastdbd" \
              --baseline-revision "$BASELINE_SHA" \
              --candidate-revision "$CANDIDATE_SHA" \
              --baseline-workers "$BENCH_BASELINE_WORKERS" \
              --candidate-workers "$BENCH_CANDIDATE_WORKERS" \
              --driver-revision "$DRIVER_SHA" \
              --profile "$BENCH_PROFILE" --disk-budget-only --output "$BENCH_OUTPUT/disk-budget"

      - name: Capture native phases in separate generated homes
        if: matrix.lane == 'speed' && inputs.investigation
        env:
          CANDIDATE_SHA: ${{ inputs.candidate }}
          BASELINE_SHA: ${{ inputs.baseline }}
          DRIVER_SHA: ${{ inputs.driver }}
        run: |
          timeout --signal=TERM --kill-after=120s 20m \
            python3 driver/scripts/benchmarks/run.py \
              --baseline "$BENCH_BINARY_ROOT/$BASELINE_SHA/lastdbd" \
              --candidate "$BENCH_BINARY_ROOT/$CANDIDATE_SHA/lastdbd" \
              --baseline-revision "$BASELINE_SHA" \
              --candidate-revision "$CANDIDATE_SHA" \
              --baseline-workers "$BENCH_BASELINE_WORKERS" \
              --candidate-workers "$BENCH_CANDIDATE_WORKERS" \
              --driver-revision "$DRIVER_SHA" \
              --profile standard --pairs 1 --native-timing --output "$BENCH_OUTPUT/native-diagnostics"

      - name: Record remaining runner space
        if: always()
        run: python3 driver/scripts/benchmarks/plan.py disk --profile "$BENCH_PROFILE" --phase finish

      - name: Require the absolute response-time limits and publish the benchmark summary
        if: always() && matrix.lane == 'speed'
        env:
          MEASUREMENT_OUTCOME: ${{ steps.measurement.outcome }}
          CONFIRMATION_OUTCOME: ${{ steps.speed-confirmation.outcome }}
        run: |
          python3 driver/scripts/benchmarks/report.py --output "$BENCH_OUTPUT" \
            --job-status "$MEASUREMENT_OUTCOME" --confirmation-status "$CONFIRMATION_OUTCOME"

      - name: Publish separate native diagnostic summary
        if: always() && matrix.lane == 'speed' && inputs.investigation
        run: python3 driver/scripts/benchmarks/report.py --mode native --output "$BENCH_OUTPUT/native-diagnostics"

      - name: Publish advisory disk and memory growth summary
        if: always() && matrix.lane == 'growth'
        env:
          GROWTH_OUTCOME: ${{ steps.growth.outcome }}
          CONFIRMATION_OUTCOME: ${{ steps.growth-confirmation.outcome }}
        run: |
          python3 driver/scripts/benchmarks/growth_report.py \
            --output "$BENCH_OUTPUT/resource-growth" --job-status "$GROWTH_OUTCOME" \
            --confirmation-status "$CONFIRMATION_OUTCOME"

      - name: Require the single-pass v2 disk size limit and publish the summary
        if: always() && matrix.lane == 'disk'
        env:
          GROWTH_OUTCOME: ${{ steps.disk-budget.outcome }}
        run: |
          python3 driver/scripts/benchmarks/growth_report.py --mode disk-budget \
            --output "$BENCH_OUTPUT/disk-budget" --job-status "$GROWTH_OUTCOME"

      - name: Upload measurements and build receipts
        id: upload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lastdb-benchmarks-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.BENCH_OUTPUT }}/
          retention-days: 14
          if-no-files-found: error

      - name: Verify upload and record its download receipt
        if: ${{ always() && steps.upload.outcome == 'success' }}
        id: receipt
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ARTIFACT_SHA256: ${{ steps.upload.outputs.artifact-digest }}
          CANDIDATE_SHA: ${{ inputs.candidate }}
        run: |
          set -euo pipefail
          python3 driver/scripts/benchmarks/artifact.py \
            --output "$RUNNER_TEMP/benchmark-download-receipt"

      - name: Retain the compact download receipt
        if: ${{ always() && steps.receipt.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: lastdb-benchmark-receipt-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/benchmark-download-receipt/artifact.json
          retention-days: 14
          if-no-files-found: error

  capture-macos:
    # The same captured-write measurement on a Mac, where an acknowledgement waits for an ordered
    # write (F_BARRIERFSYNC). Advisory: it does not decide benchmark-complete.
    name: capture (macOS, advisory)
    if: ${{ !inputs.resource_only }}
    runs-on: macos-15
    continue-on-error: true
    timeout-minutes: 180
    steps:
      - name: Prepare external result directory
        run: |
          echo "CAPTURE_OUTPUT=$RUNNER_TEMP/capture-macos-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          echo "CAPTURE_PROGRAMS=$RUNNER_TEMP/capture-programs" >> "$GITHUB_ENV"

      - name: Checkout benchmark driver from the workflow revision
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.driver }}
          path: driver
          persist-credentials: false

      - name: Checkout candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate }}
          path: candidate
          persist-credentials: false

      - name: Checkout baseline
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.baseline }}
          path: baseline
          persist-credentials: false

      - name: Cache the Mac builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            candidate -> ${{ runner.temp }}/capture-target-candidate
            baseline -> ${{ runner.temp }}/capture-target-baseline
            driver -> ${{ runner.temp }}/capture-target-relay
          key: capture-macos

      - name: Build both programs and the reference relay
        env:
          CANDIDATE_SHA: ${{ inputs.candidate }}
          BASELINE_SHA: ${{ inputs.baseline }}
        run: |
          set -euo pipefail
          for pair in "candidate:$CANDIDATE_SHA" "baseline:$BASELINE_SHA"; do
            label="${pair%%:*}"; sha="${pair#*:}"
            (cd "$label" && CARGO_TARGET_DIR="$RUNNER_TEMP/capture-target-$label" \
              FOLDDB_BUILD_VERSION_OVERRIDE="bench-$sha" \
              cargo build --locked --profile dev-release -p lastdb_node --bin lastdbd --bin lastdb)
            mkdir -p "$CAPTURE_PROGRAMS/$label"
            cp "$RUNNER_TEMP/capture-target-$label/dev-release/lastdbd" \
               "$RUNNER_TEMP/capture-target-$label/dev-release/lastdb" "$CAPTURE_PROGRAMS/$label/"
            "$CAPTURE_PROGRAMS/$label/lastdbd" --version | grep -F "bench-$sha"
          done
          (cd driver && CARGO_TARGET_DIR="$RUNNER_TEMP/capture-target-relay" \
            cargo build --locked --release -p reference_relay --bin reference_relay)

      - name: Measure what capturing a write costs the caller
        env:
          CANDIDATE_SHA: ${{ inputs.candidate }}
          BASELINE_SHA: ${{ inputs.baseline }}
        run: |
          work="$RUNNER_TEMP/capture-work"
          python3 driver/scripts/operations/capture_cost.py \
            --relay-bin "$RUNNER_TEMP/capture-target-relay/release/reference_relay" \
            --baseline-daemon "$CAPTURE_PROGRAMS/baseline/lastdbd" \
            --baseline-cli "$CAPTURE_PROGRAMS/baseline/lastdb" \
            --baseline-revision "$BASELINE_SHA" \
            --candidate-daemon "$CAPTURE_PROGRAMS/candidate/lastdbd" \
            --candidate-cli "$CAPTURE_PROGRAMS/candidate/lastdb" \
            --candidate-revision "$CANDIDATE_SHA" \
            --output "$work"
          mkdir -p "$CAPTURE_OUTPUT"
          cp "$work/capture-cost.json" "$CAPTURE_OUTPUT/"

      - name: Upload the measurement
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lastdb-capture-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CAPTURE_OUTPUT }}/
          retention-days: 14
          if-no-files-found: warn
