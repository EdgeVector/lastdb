name: Mini upgrade artifact

on:
  workflow_dispatch:
    inputs:
      source_oid:
        description: 'Full accepted main commit to build; empty selects the workflow commit'
        required: false
        type: string
  pull_request:
    paths:
      - '.github/workflows/mini-upgrade-artifact.yml'

permissions:
  contents: read

concurrency:
  group: mini-upgrade-artifact-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Matched macOS release pair
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '3'
      RUSTC_WRAPPER: ''
    steps:
      # A workflow PR proves its build against the accepted base, not proposed code.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || inputs.source_oid || github.sha }}
          fetch-depth: 0
      - name: Require an accepted main source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source_oid=$(git rev-parse HEAD)
          git fetch origin main
          git merge-base --is-ancestor "$source_oid" origin/main
          test -z "$(git status --porcelain)"
          echo "oid=$source_oid" >> "$GITHUB_OUTPUT"
      - name: Install Rust toolchain
        run: |
          test "$(uname -m)" = arm64
          # rustup show auto-installs today and warns that this will stop.
          rustup toolchain install
          rustup show active-toolchain
          rustup target add aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: mini-upgrade-aarch64-apple-darwin
      - name: Link the Homebrew openssl@3 that the installed Macs have
        shell: bash
        run: |
          set -euo pipefail
          # openssl-sys links the runner's default Homebrew OpenSSL. The
          # runner image moved to openssl@4, and a pair linked to it does not
          # start on a Mac that has only openssl@3.
          brew list --versions openssl@3 >/dev/null || HOMEBREW_NO_AUTO_UPDATE=1 brew install openssl@3
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - name: Build the matched release pair
        run: >-
          cargo build --locked --release --target aarch64-apple-darwin
          -p lastdb_node --bin lastdb --bin lastdbd
      - name: Remove release symbols and verify executable signatures
        run: |
          for binary in lastdb lastdbd; do
            path="target/aarch64-apple-darwin/release/$binary"
            strip "$path"
            codesign --force --sign - "$path"
            codesign --verify --strict "$path"
            if otool -L "$path" | grep -E 'lib(ssl|crypto)\.' | grep -v '/opt/homebrew/opt/openssl@3/lib/'; then
              echo "$path links an OpenSSL other than openssl@3" >&2
              exit 1
            fi
          done
      - name: Package the pair and source receipt
        env:
          SOURCE_OID: ${{ steps.source.outputs.oid }}
        run: |
          bash scripts/release/package-lastdb-bundle.sh \
            --target aarch64-apple-darwin \
            --bin-dir target/aarch64-apple-darwin/release \
            --out-dir upgrade-artifact \
            --git-oid "$SOURCE_OID"
      - uses: actions/upload-artifact@v7
        with:
          name: lastdb-mini-${{ steps.source.outputs.oid }}-aarch64-apple-darwin
          path: upgrade-artifact/*
          if-no-files-found: error
          retention-days: 14
