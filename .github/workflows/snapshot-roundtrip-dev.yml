name: Snapshot round trip

# Owner signed-database snapshot backup and restore on DEV, with generated
# records only. A pull request checks this recipe's syntax and receives no
# cloud credentials. The gate itself runs only for a push to main, the daily
# schedule, or a manual dispatch of main. Each proof attempt uses its own
# DEV account. The release check also requires account retirement.
#
# exemem-infra deploy.yml can start a build of this commit with no inputs:
#   gh workflow run snapshot-roundtrip-dev.yml --repo EdgeVector/lastdb --ref main
# The same gate with the latest published nightly client:
#   gh workflow run snapshot-roundtrip-dev.yml --repo EdgeVector/lastdb --ref main -f client=nightly
# Native cutoff recovery from the exact accepted client:
#   gh workflow run snapshot-roundtrip-dev.yml --repo EdgeVector/lastdb --ref main -f mode=native-cutoff
# Resume cleanup for one completed attempt without building or uploading:
#   gh workflow run snapshot-roundtrip-dev.yml --repo EdgeVector/lastdb --ref main -f mode=resume-cleanup -f original_run_id=RUN -f original_run_attempt=ATTEMPT
# Re-run failed jobs can reuse a successful import and retire its exact account.
# A fresh proof requires all prior accounts from the same run to be retired.
#
# After checking out lastdb, that client and this round trip are:
#   python3 scripts/release/published_client.py --out-dir DIR
#   python3 scripts/cloud_backup/snapshot_gate.py run --bin-dir BIN --version VERSION

on:
  push:
    branches: [main]
  schedule:
    - cron: '41 11 * * *'
  workflow_dispatch:
    inputs:
      client:
        description: "Build this commit, or download the latest published nightly client"
        type: choice
        default: build
        options:
          - build
          - nightly
      mode:
        description: "Round trip, native cutoff recovery, or cleanup of an earlier run"
        type: choice
        default: round-trip
        options:
          - round-trip
          - native-cutoff
          - resume-cleanup
      original_run_id:
        description: "Original GitHub Actions run ID for resume-cleanup"
        type: string
        required: false
      original_run_attempt:
        description: "Original GitHub Actions attempt number for resume-cleanup"
        type: string
        required: false
  pull_request:
    paths:
      - '.github/workflows/snapshot-roundtrip-dev.yml'
      - '.github/workflows/cloud-backup-build.yml'
      - 'scripts/harness.py'
      - 'scripts/cloud_backup/**'
      - 'scripts/release/published_client.py'
      - 'scripts/release/nightly_package.py'
      - 'lastdb_node/**'
      - 'fold_db/**'
      - 'vendor/laststore/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'

permissions:
  contents: read

jobs:
  recipe-syntax:
    name: Snapshot gate recipe syntax
    concurrency:
      group: snapshot-roundtrip-syntax-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Require accepted main for a manual cloud operation
        if: github.event_name == 'workflow_dispatch'
        env:
          SELECTED_REF: ${{ github.ref }}
          SNAPSHOT_MODE: ${{ github.event.inputs.mode }}
          CLIENT: ${{ github.event.inputs.client || 'build' }}
          ORIGINAL_RUN_ID: ${{ github.event.inputs.original_run_id }}
          ORIGINAL_RUN_ATTEMPT: ${{ github.event.inputs.original_run_attempt }}
        run: |
          test "$SELECTED_REF" = refs/heads/main
          if [ "$SNAPSHOT_MODE" = native-cutoff ]; then
            test "$CLIENT" = build
          fi
          if [ "$SNAPSHOT_MODE" = resume-cleanup ]; then
            [[ "$ORIGINAL_RUN_ID" =~ ^[1-9][0-9]{0,18}$ ]]
            [[ "$ORIGINAL_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,4}$ ]]
          else
            test -z "$ORIGINAL_RUN_ID"
            test -z "$ORIGINAL_RUN_ATTEMPT"
          fi
      - name: Check the operational recipe syntax
        run: |
          python3 -m py_compile scripts/harness.py scripts/cloud_backup/*.py
          python3 -m py_compile scripts/release/published_client.py

  build-client:
    name: Build
    needs: recipe-syntax
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.event.inputs.mode != 'resume-cleanup'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/cloud-backup-build.yml
    with:
      client: ${{ github.event.inputs.client || 'build' }}

  snapshot-operation:
    name: ${{ github.event.inputs.mode == 'native-cutoff' && 'snapshot-native-cutoff-operation-dev' || github.event.inputs.client == 'nightly' && 'snapshot-import-published-nightly' || 'snapshot-import-dev' }}
    needs: [recipe-syntax, build-client]
    if: github.repository == 'EdgeVector/lastdb' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.event.inputs.mode != 'resume-cleanup'
    concurrency:
      group: snapshot-attempt-${{ github.run_id }}-${{ github.run_attempt }}
      queue: max
    environment: cloud-backup-dev
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    outputs:
      attempt: ${{ steps.origin.outputs.attempt }}
    steps:
      - id: origin
        name: Record the operation attempt
        run: printf 'attempt=%s\n' "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install the signed recipe dependency
        run: python3 -m pip install --quiet cryptography==41.0.7
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build-client.outputs.artifact }}
          path: ${{ runner.temp }}/cloud-backup-client
      - name: Unpack the exact client
        run: |
          set -euo pipefail
          client_bin_dir="$RUNNER_TEMP/cloud-backup-bin"
          mkdir -m 700 "$client_bin_dir"
          tar -xzf "$RUNNER_TEMP/cloud-backup-client/lastdb-x86_64-unknown-linux-gnu.tar.gz" \
            -C "$client_bin_dir" lastdb lastdbd
          printf 'CLIENT_BIN_DIR=%s\n' "$client_bin_dir" >> "$GITHUB_ENV"
      - name: Seed, snapshot, and restore the gate database
        id: snapshot-roundtrip
        if: github.event.inputs.mode != 'native-cutoff'
        env:
          CLIENT_VERSION: ${{ needs.build-client.outputs.version }}
        run: |
          python3 scripts/cloud_backup/snapshot_gate.py run \
            --bin-dir "$CLIENT_BIN_DIR" --version "$CLIENT_VERSION"
      - name: Recover a lagging device across the native snapshot cutoff
        id: native-cutoff
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'native-cutoff'
        env:
          CLIENT_VERSION: ${{ needs.build-client.outputs.version }}
        run: |
          python3 scripts/cloud_backup/snapshot_gate.py native-cutoff \
            --bin-dir "$CLIENT_BIN_DIR" --version "$CLIENT_VERSION"

  snapshot-retirement:
    name: Retire the DEV snapshot account
    needs: snapshot-operation
    if: always() && needs.snapshot-operation.result != 'skipped' && github.repository == 'EdgeVector/lastdb' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.event.inputs.mode != 'resume-cleanup'
    concurrency:
      group: snapshot-attempt-${{ github.run_id }}-${{ needs.snapshot-operation.outputs.attempt || github.run_attempt }}
      queue: max
    environment: cloud-backup-dev
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
      id-token: write
    outputs:
      attempt: ${{ steps.receipt.outputs.attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Retire provider bytes, metadata, and the exact account
        id: receipt
        env:
          SNAPSHOT_GITHUB_TOKEN: ${{ github.token }}
          SNAPSHOT_PROOF_ATTEMPT: ${{ needs.snapshot-operation.outputs.attempt }}
          REQUIRE_RELEASED_SNAPSHOT_BYTES: ${{ needs.snapshot-operation.result == 'success' }}
        run: python3 scripts/cloud_backup/snapshot_gate.py retire

  snapshot-roundtrip-dev:
    # Releases continue to require this exact check name on the frozen source.
    # Other selections cannot publish a newer skipped check under that name.
    name: ${{ (github.event_name == 'pull_request' || github.event.inputs.mode == 'resume-cleanup') && 'snapshot-roundtrip-not-requested' || github.event.inputs.mode == 'native-cutoff' && 'snapshot-native-cutoff-dev' || github.event.inputs.client == 'nightly' && 'snapshot-roundtrip-published-nightly' || 'snapshot-roundtrip-dev' }}
    needs: [snapshot-operation, snapshot-retirement]
    if: always() && github.repository == 'EdgeVector/lastdb' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.event.inputs.mode != 'resume-cleanup'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Require a successful import and retirement from the same original attempt
        env:
          PROOF: ${{ needs.snapshot-operation.result }}
          RETIREMENT: ${{ needs.snapshot-retirement.result }}
          PROOF_ATTEMPT: ${{ needs.snapshot-operation.outputs.attempt }}
          RETIREMENT_ATTEMPT: ${{ needs.snapshot-retirement.outputs.attempt }}
        run: |
          set -euo pipefail
          printf 'Snapshot operation: %s\nAccount retirement: %s\n' "$PROOF" "$RETIREMENT"
          test "$PROOF" = success
          test "$RETIREMENT" = success
          if [[ ! "$PROOF_ATTEMPT" =~ ^[1-9][0-9]{0,4}$ || "$PROOF_ATTEMPT" != "$RETIREMENT_ATTEMPT" ]]; then
            echo 'The product and retirement results must come from the same original attempt.' >&2
            exit 1
          fi
          printf 'Verified original snapshot attempt %s\n' "$PROOF_ATTEMPT"

  snapshot-resume-origin:
    name: Verify the earlier snapshot attempt
    needs: recipe-syntax
    if: github.repository == 'EdgeVector/lastdb' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'resume-cleanup'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      actions: read
      contents: read
    outputs:
      legacy: ${{ steps.origin.outputs.legacy }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: origin
        name: Verify exact provenance and select its cleanup queue
        env:
          SNAPSHOT_GITHUB_TOKEN: ${{ github.token }}
          ORIGINAL_RUN_ID: ${{ github.event.inputs.original_run_id }}
          ORIGINAL_RUN_ATTEMPT: ${{ github.event.inputs.original_run_attempt }}
        run: |
          python3 scripts/cloud_backup/snapshot_gate.py resolve-resume \
            "$ORIGINAL_RUN_ID" "$ORIGINAL_RUN_ATTEMPT"

  snapshot-resume-cleanup-dev:
    name: Resume an earlier snapshot cleanup in DEV
    needs: snapshot-resume-origin
    if: needs.snapshot-resume-origin.outputs.legacy == 'true' || needs.snapshot-resume-origin.outputs.legacy == 'false'
    concurrency:
      # Historical attempts still share one account, including in-flight jobs
      # from before the cutover. New accounts only serialize an exact attempt.
      group: ${{ needs.snapshot-resume-origin.outputs.legacy == 'true' && 'snapshot-roundtrip-dev' || format('snapshot-attempt-{0}-{1}', github.event.inputs.original_run_id, github.event.inputs.original_run_attempt) }}
      queue: max
    environment: cloud-backup-dev
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify the original attempt and resume disposable account cleanup
        if: needs.snapshot-resume-origin.outputs.legacy == 'false'
        env:
          SNAPSHOT_GITHUB_TOKEN: ${{ github.token }}
          ORIGINAL_RUN_ID: ${{ github.event.inputs.original_run_id }}
          ORIGINAL_RUN_ATTEMPT: ${{ github.event.inputs.original_run_attempt }}
        run: |
          python3 scripts/cloud_backup/snapshot_gate.py resume-cleanup \
            "$ORIGINAL_RUN_ID" "$ORIGINAL_RUN_ATTEMPT"
      - name: Install the historical signed cleanup dependency
        if: needs.snapshot-resume-origin.outputs.legacy == 'true'
        run: python3 -m pip install --quiet cryptography==41.0.7
      - name: Assume the DEV mutation-log cleanup role for a historical attempt
        if: needs.snapshot-resume-origin.outputs.legacy == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.LASTDB_MUTATION_LOG_DEV_ROLE_ARN }}
          aws-region: us-west-2
          role-session-name: snapshot-resume-${{ github.run_id }}
      - name: Resume the historical fixed-owner signed cleanup
        if: needs.snapshot-resume-origin.outputs.legacy == 'true'
        env:
          SNAPSHOT_GITHUB_TOKEN: ${{ github.token }}
          ORIGINAL_RUN_ID: ${{ github.event.inputs.original_run_id }}
          ORIGINAL_RUN_ATTEMPT: ${{ github.event.inputs.original_run_attempt }}
          LASTDB_CLOUD_DEV_API_KEY: ${{ secrets.LASTDB_CLOUD_SNAPSHOT_DEV_API_KEY }}
          LASTDB_CLOUD_DEV_RECOVERY_PHRASE: ${{ secrets.LASTDB_CLOUD_SNAPSHOT_DEV_RECOVERY_PHRASE }}
          LASTDB_CLOUD_DEV_BASELINE: ${{ secrets.LASTDB_CLOUD_SNAPSHOT_DEV_BASELINE }}
        run: |
          python3 scripts/cloud_backup/snapshot_gate.py resume-legacy-cleanup \
            "$ORIGINAL_RUN_ID" "$ORIGINAL_RUN_ATTEMPT"
