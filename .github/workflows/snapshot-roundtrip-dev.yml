name: Snapshot round trip

# Owner signed-database snapshot backup and restore on DEV, with generated
# records only. A pull request checks this recipe's syntax and receives no
# cloud credentials. The gate itself runs only for a push to main, the daily
# schedule, or a manual dispatch of main. Both modes and provider cleanup
# use the same dedicated DEV snapshot account.
#
# exemem-infra deploy.yml can start a build of this commit with no inputs:
#   gh workflow run snapshot-roundtrip-dev.yml --repo EdgeVector/lastdb --ref main
# The same gate with the latest published nightly client:
#   gh workflow run snapshot-roundtrip-dev.yml --repo EdgeVector/lastdb --ref main -f client=nightly
# Native cutoff recovery from the exact accepted client:
#   gh workflow run snapshot-roundtrip-dev.yml --repo EdgeVector/lastdb --ref main -f mode=native-cutoff
# Require automatic log removal on the deployed DEV service:
#   gh workflow run snapshot-roundtrip-dev.yml --repo EdgeVector/lastdb --ref main -f mode=native-cutoff -f require_automatic=true
# Resume cleanup for one completed attempt without building or uploading:
#   gh workflow run snapshot-roundtrip-dev.yml --repo EdgeVector/lastdb --ref main -f mode=resume-cleanup -f original_run_id=RUN -f original_run_attempt=ATTEMPT
#
# After checking out lastdb, that client and this round trip are:
#   python3 scripts/release/published_client.py --out-dir DIR
#   python3 scripts/cloud_backup/snapshot_gate.py run --bin-dir BIN --version VERSION

on:
  push:
    branches: [main]
  schedule:
    - cron: '41 11 * * *'
  workflow_dispatch:
    inputs:
      client:
        description: "Build this commit, or download the latest published nightly client"
        type: choice
        default: build
        options:
          - build
          - nightly
      mode:
        description: "Round trip, native cutoff recovery, or cleanup of an earlier run"
        type: choice
        default: round-trip
        options:
          - round-trip
          - native-cutoff
          - resume-cleanup
      require_automatic:
        description: "Require automatic log removal in native cutoff mode"
        type: boolean
        default: false
      original_run_id:
        description: "Original GitHub Actions run ID for resume-cleanup"
        type: string
        required: false
      original_run_attempt:
        description: "Original GitHub Actions attempt number for resume-cleanup"
        type: string
        required: false
  pull_request:
    paths:
      - '.github/workflows/snapshot-roundtrip-dev.yml'
      - '.github/workflows/cloud-backup-build.yml'
      - 'scripts/cloud_backup/**'
      - 'scripts/release/published_client.py'
      - 'scripts/release/nightly_package.py'
      - 'lastdb_node/**'
      - 'fold_db/**'
      - 'vendor/laststore/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'

permissions:
  contents: read

jobs:
  recipe-syntax:
    name: Snapshot gate recipe syntax
    concurrency:
      group: snapshot-roundtrip-syntax-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Require accepted main for a manual cloud operation
        if: github.event_name == 'workflow_dispatch'
        env:
          SELECTED_REF: ${{ github.ref }}
          SNAPSHOT_MODE: ${{ github.event.inputs.mode }}
          CLIENT: ${{ github.event.inputs.client || 'build' }}
          REQUIRE_AUTOMATIC: ${{ github.event.inputs.require_automatic }}
          ORIGINAL_RUN_ID: ${{ github.event.inputs.original_run_id }}
          ORIGINAL_RUN_ATTEMPT: ${{ github.event.inputs.original_run_attempt }}
        run: |
          test "$SELECTED_REF" = refs/heads/main
          if [ "$SNAPSHOT_MODE" = native-cutoff ]; then
            test "$CLIENT" = build
          fi
          if [ "$REQUIRE_AUTOMATIC" = true ]; then
            test "$SNAPSHOT_MODE" = native-cutoff
          fi
          if [ "$SNAPSHOT_MODE" = resume-cleanup ]; then
            test -n "$ORIGINAL_RUN_ID"
            test -n "$ORIGINAL_RUN_ATTEMPT"
          else
            test -z "$ORIGINAL_RUN_ID"
            test -z "$ORIGINAL_RUN_ATTEMPT"
          fi
      - name: Check the operational recipe syntax
        run: |
          python3 -m py_compile scripts/cloud_backup/*.py
          python3 -m py_compile scripts/release/published_client.py

  build-client:
    name: Build
    needs: recipe-syntax
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.event.inputs.mode != 'resume-cleanup'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/cloud-backup-build.yml
    with:
      client: ${{ github.event.inputs.client || 'build' }}

  snapshot-roundtrip-dev:
    # Release gates accept the newest snapshot-roundtrip-dev check on a source
    # commit. Nightly, native cutoff and cleanup-only use other check names.
    # github.event.inputs is empty on push and schedule.
    name: ${{ github.event.inputs.mode == 'resume-cleanup' && 'snapshot-roundtrip-not-requested' || github.event.inputs.mode == 'native-cutoff' && 'snapshot-native-cutoff-dev' || github.event.inputs.client == 'nightly' && 'snapshot-roundtrip-published-nightly' || 'snapshot-roundtrip-dev' }}
    needs: [recipe-syntax, build-client]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.event.inputs.mode != 'resume-cleanup'
    # Builds can overlap. Hold one slot from protected proof through retirement.
    concurrency:
      group: snapshot-roundtrip-dev
      queue: max
    environment: cloud-backup-dev
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install the signed recipe dependency
        run: python3 -m pip install --quiet cryptography==41.0.7
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build-client.outputs.artifact }}
          path: ${{ runner.temp }}/cloud-backup-client
      - name: Unpack the exact client
        run: |
          set -euo pipefail
          client_bin_dir="$RUNNER_TEMP/cloud-backup-bin"
          mkdir -m 700 "$client_bin_dir"
          tar -xzf "$RUNNER_TEMP/cloud-backup-client/lastdb-x86_64-unknown-linux-gnu.tar.gz" \
            -C "$client_bin_dir" lastdb lastdbd
          printf 'CLIENT_BIN_DIR=%s\n' "$client_bin_dir" >> "$GITHUB_ENV"
      - name: Seed, snapshot, and restore the gate database
        id: snapshot-roundtrip
        if: github.event.inputs.mode != 'native-cutoff'
        env:
          CLIENT_VERSION: ${{ needs.build-client.outputs.version }}
          LASTDB_CLOUD_DEV_API_KEY: ${{ secrets.LASTDB_CLOUD_SNAPSHOT_DEV_API_KEY }}
          LASTDB_CLOUD_DEV_RECOVERY_PHRASE: ${{ secrets.LASTDB_CLOUD_SNAPSHOT_DEV_RECOVERY_PHRASE }}
          LASTDB_CLOUD_DEV_BASELINE: ${{ secrets.LASTDB_CLOUD_SNAPSHOT_DEV_BASELINE }}
        run: |
          python3 scripts/cloud_backup/snapshot_gate.py run \
            --bin-dir "$CLIENT_BIN_DIR" --version "$CLIENT_VERSION"
      - name: Assume the DEV mutation-log cleanup role
        if: always()
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.LASTDB_MUTATION_LOG_DEV_ROLE_ARN }}
          aws-region: us-west-2
          role-session-name: snapshot-gate-${{ github.run_id }}
      - name: Recover a lagging device across the native snapshot cutoff
        id: native-cutoff
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'native-cutoff'
        env:
          CLIENT_VERSION: ${{ needs.build-client.outputs.version }}
          LASTDB_CLOUD_DEV_API_KEY: ${{ secrets.LASTDB_CLOUD_SNAPSHOT_DEV_API_KEY }}
          LASTDB_CLOUD_DEV_RECOVERY_PHRASE: ${{ secrets.LASTDB_CLOUD_SNAPSHOT_DEV_RECOVERY_PHRASE }}
          LASTDB_CLOUD_DEV_BASELINE: ${{ secrets.LASTDB_CLOUD_SNAPSHOT_DEV_BASELINE }}
          REQUIRE_AUTOMATIC: ${{ github.event.inputs.require_automatic }}
        run: |
          args=()
          if [ "$REQUIRE_AUTOMATIC" = true ]; then
            args+=(--require-automatic)
          fi
          python3 scripts/cloud_backup/snapshot_gate.py native-cutoff \
            --bin-dir "$CLIENT_BIN_DIR" --version "$CLIENT_VERSION" "${args[@]}"
      - name: Retire run-owned provider objects and quota before deleting metadata
        if: always()
        env:
          SNAPSHOT_MODE: ${{ github.event.inputs.mode }}
          REQUIRE_RELEASED_SNAPSHOT_BYTES: ${{ steps.snapshot-roundtrip.outcome == 'success' || steps.native-cutoff.outcome == 'success' }}
          LASTDB_CLOUD_DEV_API_KEY: ${{ secrets.LASTDB_CLOUD_SNAPSHOT_DEV_API_KEY }}
          LASTDB_CLOUD_DEV_RECOVERY_PHRASE: ${{ secrets.LASTDB_CLOUD_SNAPSHOT_DEV_RECOVERY_PHRASE }}
          LASTDB_CLOUD_DEV_BASELINE: ${{ secrets.LASTDB_CLOUD_SNAPSHOT_DEV_BASELINE }}
        run: |
          if [ "$SNAPSHOT_MODE" = native-cutoff ]; then
            python3 scripts/cloud_backup/snapshot_gate.py cleanup-native-cutoff
          else
            python3 scripts/cloud_backup/snapshot_gate.py cleanup
          fi

  snapshot-resume-cleanup-dev:
    name: Resume an earlier snapshot cleanup in DEV
    needs: recipe-syntax
    if: github.repository == 'EdgeVector/lastdb' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'resume-cleanup'
    concurrency:
      group: snapshot-roundtrip-dev
      queue: max
    environment: cloud-backup-dev
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install the signed recipe dependency
        run: python3 -m pip install --quiet cryptography==41.0.7
      - name: Assume the DEV mutation-log cleanup role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.LASTDB_MUTATION_LOG_DEV_ROLE_ARN }}
          aws-region: us-west-2
          role-session-name: snapshot-resume-${{ github.run_id }}
      - name: Verify the original attempt and resume only its signed cleanup
        env:
          SNAPSHOT_GITHUB_TOKEN: ${{ github.token }}
          ORIGINAL_RUN_ID: ${{ github.event.inputs.original_run_id }}
          ORIGINAL_RUN_ATTEMPT: ${{ github.event.inputs.original_run_attempt }}
          LASTDB_CLOUD_DEV_API_KEY: ${{ secrets.LASTDB_CLOUD_SNAPSHOT_DEV_API_KEY }}
          LASTDB_CLOUD_DEV_RECOVERY_PHRASE: ${{ secrets.LASTDB_CLOUD_SNAPSHOT_DEV_RECOVERY_PHRASE }}
          LASTDB_CLOUD_DEV_BASELINE: ${{ secrets.LASTDB_CLOUD_SNAPSHOT_DEV_BASELINE }}
        run: |
          python3 scripts/cloud_backup/snapshot_gate.py resume-cleanup \
            "$ORIGINAL_RUN_ID" "$ORIGINAL_RUN_ATTEMPT"
