name: Snapshot round trip

# Owner signed-database snapshot backup and restore on DEV, with generated
# records only. A pull request checks this recipe's syntax and receives no
# cloud credentials. The gate itself runs only for a push to main, the daily
# schedule, or a manual dispatch of main.
#
# exemem-infra deploy.yml can start it with no inputs:
#   gh workflow run snapshot-roundtrip-dev.yml --repo EdgeVector/lastdb --ref main

on:
  push:
    branches: [main]
  schedule:
    - cron: '41 11 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/snapshot-roundtrip-dev.yml'
      - '.github/workflows/cloud-backup-build.yml'
      - 'scripts/cloud_backup/**'
      - 'scripts/release/nightly_package.py'
      - 'lastdb_node/**'
      - 'fold_db/**'
      - 'vendor/laststore/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'

permissions:
  contents: read

concurrency:
  group: snapshot-roundtrip-${{ github.event.pull_request.number || 'dev' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  recipe-syntax:
    name: Snapshot gate recipe syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Require accepted main for a manual cloud operation
        if: github.event_name == 'workflow_dispatch'
        env:
          SELECTED_REF: ${{ github.ref }}
        run: test "$SELECTED_REF" = refs/heads/main
      - name: Check the operational recipe syntax
        run: python3 -m py_compile scripts/cloud_backup/*.py

  build-client:
    name: Build
    needs: recipe-syntax
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/cloud-backup-build.yml

  snapshot-roundtrip-dev:
    name: snapshot-roundtrip-dev
    needs: [recipe-syntax, build-client]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: cloud-backup-dev
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build-client.outputs.artifact }}
          path: ${{ runner.temp }}/cloud-backup-client
      - name: Unpack the exact client
        run: |
          set -euo pipefail
          client_bin_dir="$RUNNER_TEMP/cloud-backup-bin"
          mkdir -m 700 "$client_bin_dir"
          tar -xzf "$RUNNER_TEMP/cloud-backup-client/lastdb-x86_64-unknown-linux-gnu.tar.gz" \
            -C "$client_bin_dir" lastdb lastdbd
          printf 'CLIENT_BIN_DIR=%s\n' "$client_bin_dir" >> "$GITHUB_ENV"
      - name: Seed, snapshot, and restore the gate database
        env:
          CLIENT_VERSION: ${{ needs.build-client.outputs.version }}
          LASTDB_CLOUD_DEV_API_KEY: ${{ secrets.LASTDB_CLOUD_DEV_API_KEY }}
          LASTDB_CLOUD_DEV_RECOVERY_PHRASE: ${{ secrets.LASTDB_CLOUD_DEV_RECOVERY_PHRASE }}
        run: |
          python3 scripts/cloud_backup/snapshot_gate.py run \
            --bin-dir "$CLIENT_BIN_DIR" --version "$CLIENT_VERSION"
      - name: Assume the DEV mutation-log cleanup role
        if: always()
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.LASTDB_MUTATION_LOG_DEV_ROLE_ARN }}
          aws-region: us-west-2
          role-session-name: snapshot-gate-${{ github.run_id }}
      - name: Delete the signed log and snapshot inventory
        if: always()
        run: python3 scripts/cloud_backup/snapshot_gate.py cleanup
