name: PR 282 matched write latency

# Temporary operational evidence for this PR; no merge gate or shared policy change.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr282-latency-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  matched-writes:
    if: github.event.pull_request.number == 282
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: "4"
      CARGO_TERM_COLOR: always
      METADATA_BEFORE_SHA: 39060743d5527cd5f7bf3b25d18f91c06f64b919
    steps:
      - name: Checkout proposed source and capture driver
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - name: Checkout main baseline
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
          persist-credentials: false
      - name: Select one toolchain
        working-directory: candidate
        run: |
          set -euo pipefail
          rustup show active-toolchain
          toolchain="$(rustup show active-toolchain | cut -d ' ' -f 1)"
          {
            echo "RUSTUP_TOOLCHAIN=$toolchain"
            echo "EVIDENCE_ROOT=$RUNNER_TEMP/pr282-results"
            echo "BINARY_ROOT=$RUNNER_TEMP/matched-binaries"
          } >> "$GITHUB_ENV"
      - name: Checkout the same PR source before the metadata writer change
        uses: actions/checkout@v5
        with:
          ref: ${{ env.METADATA_BEFORE_SHA }}
          path: metadata-before
          persist-credentials: false
      - name: Build exact source revisions
        id: build
        env:
          BEFORE_SHA: ${{ github.event.pull_request.base.sha }}
          AFTER_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_ROOT"
          rustc --version --verbose > "$EVIDENCE_ROOT/toolchain.txt"
          for version in baseline candidate metadata-before; do
            case "$version" in
              baseline) revision="$BEFORE_SHA" ;;
              candidate) revision="$AFTER_SHA" ;;
              metadata-before) revision="$METADATA_BEFORE_SHA" ;;
            esac
            (
              cd "$version"
              # Cargo fingerprints each source; registry dependencies share a build.
              export CARGO_TARGET_DIR="$RUNNER_TEMP/matched-target"
              export FOLDDB_BUILD_VERSION_OVERRIDE="matched-$revision"
              cargo build --locked --profile dev-release -p lastdb_node --bin lastdbd
              mkdir -p "$BINARY_ROOT/$version"
              cp "$CARGO_TARGET_DIR/dev-release/lastdbd" "$BINARY_ROOT/$version/lastdbd"
              actual="$("$BINARY_ROOT/$version/lastdbd" --version)"
              [[ "$actual" == *"matched-$revision"* ]]
            ) 2>&1 | tee "$EVIDENCE_ROOT/build-$version.log"
          done
      - name: Compare identical eight-record requests
        env:
          BEFORE_SHA: ${{ github.event.pull_request.base.sha }}
          AFTER_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 candidate/docs/proofs/matched-write-concurrency-20261023/run_pairs.py \
            --before-binary "$BINARY_ROOT/baseline/lastdbd" \
            --after-binary "$BINARY_ROOT/candidate/lastdbd" \
            --before-revision "$BEFORE_SHA" --after-revision "$AFTER_SHA" \
            --pairs 3 --count 1000 --output "$EVIDENCE_ROOT/matched"
      - name: Capture numeric write phases separately
        if: always() && steps.build.outcome == 'success'
        env:
          BEFORE_SHA: ${{ github.event.pull_request.base.sha }}
          AFTER_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 candidate/docs/proofs/matched-write-concurrency-20261023/run_pairs.py \
            --before-binary "$BINARY_ROOT/baseline/lastdbd" \
            --after-binary "$BINARY_ROOT/candidate/lastdbd" \
            --before-revision "$BEFORE_SHA" --after-revision "$AFTER_SHA" \
            --pairs 1 --count 256 --profile --output "$EVIDENCE_ROOT/phases"
      - name: Require automatic, tier, and full compaction progress during writes
        if: always() && steps.build.outcome == 'success'
        env:
          AFTER_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          rc=0
          for mode in automatic tier full; do
            scratch="$(mktemp -d "$RUNNER_TEMP/c.XXXXXX")"
            python3 candidate/docs/proofs/eager-durable-queue-20261023/run.py \
              --binary "$BINARY_ROOT/candidate/lastdbd" \
              --source-revision "$AFTER_SHA" --scratch "$scratch" \
              --output-root "$EVIDENCE_ROOT/compaction-$mode" --mode "$mode" || rc=1
          done
          exit "$rc"
      - name: Isolate the metadata writer change with numeric phases
        if: always() && steps.build.outcome == 'success'
        env:
          AFTER_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 candidate/docs/proofs/matched-write-concurrency-20261023/run_pairs.py \
            --before-binary "$BINARY_ROOT/metadata-before/lastdbd" \
            --after-binary "$BINARY_ROOT/candidate/lastdbd" \
            --before-revision "$METADATA_BEFORE_SHA" --after-revision "$AFTER_SHA" \
            --pairs 1 --count 1000 --profile --output "$EVIDENCE_ROOT/metadata-only"
      - name: Record measured results in the CI summary
        if: always() && steps.build.outcome == 'success'
        run: |
          {
            echo 'Eight records per request; latency covers the whole request.'
            echo ''
            echo '| Capture | Source and clients | Runs | Mean ms | P99 ms |'
            echo '| --- | --- | --- | --- | --- |'
            for capture in matched metadata-only; do
              path="$EVIDENCE_ROOT/$capture/comparison.json"
              if [ -f "$path" ]; then
                jq -r --arg capture "$capture" '.groups | to_entries[] |
                  "| \($capture) | \(.key) | \(.value.runs) | \(.value.median_run_average_ms) | \(.value.median_run_p99_ms) |"' "$path"
              fi
            done
            echo ''
            echo '| Compaction | Active publications | Active explicit completions | Bytes removed during writes | Mean ms | P99 ms |'
            echo '| --- | --- | --- | --- | --- | --- |'
            for mode in automatic tier full; do
              path="$EVIDENCE_ROOT/compaction-$mode/$mode/compaction-progress.json"
              if [ -f "$path" ]; then
                jq -r '"| \(.mode) | \(.maintenance_runs_observed_during_writes) | \(.explicit_completed_during_writes) | \(.explicit_bytes_removed_during_writes) | \(.latency.average_ms) | \(.latency.p99_ms) |"' "$path"
              fi
            done
            echo ''
            echo 'Missing captures remain incomplete. Latency slowdowns are advisory; correctness and active compaction checks must pass.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain all samples and build receipts
        id: artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr282-matched-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ env.EVIDENCE_ROOT }}/
          retention-days: 14
          if-no-files-found: error
      - name: Verify the uploaded artifact and record its receipt
        if: always() && steps.artifact.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/artifacts/$ARTIFACT_ID" \
            --jq '{id,expired,size_in_bytes,digest,expires_at,archive_download_url}' \
            > "$RUNNER_TEMP/matched-artifact-receipt.json"
          jq -e --arg digest "sha256:$ARTIFACT_DIGEST" \
            '.expired == false and .size_in_bytes > 0 and .digest == $digest' \
            "$RUNNER_TEMP/matched-artifact-receipt.json"
          {
            echo "Artifact: $ARTIFACT_URL"
            echo "SHA-256: $ARTIFACT_DIGEST"
            echo "Source: $SOURCE_REVISION; retention: 14 days"
          } >> "$GITHUB_STEP_SUMMARY"
