name: CI required

# Required merge gate on GitHub Actions (decision-2026-09-29-fold-venue-back-to-github).
# GitHub owns the required gate. The retired Forgejo workflows are absent from
# this tree.
# mutation_log clippy checks --lib only.
# The gate keeps fmt, clippy, lints, the
# lastdb_app_sdk typecheck, a tracked-text secret scan, the cargo-deny
# supply-chain check, the cargo-machete unused dependency check, builds, the
# record home product proof, the cloud_backup_protocol check against the
# exemem-infra main fold pin, the installed-app proof for a socket surface or
# interface version change, and the People DEV sharing proof (dispatch
# EdgeVector/people `dev-sharing.yml` for this LastDB SHA). No coverage check
# is required.
# The single required check is the `ci-required` job at the bottom.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      lastdb_source_sha:
        description: "Optional 40-hex LastDB SHA for People DEV sharing (default: the event SHA)"
        type: string
        required: false

concurrency:
  group: ci-required-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_BUILD_JOBS: "4"
  CARGO_TERM_COLOR: always

jobs:
  build_test:
    name: fmt + source lints
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Rust
        run: |
          rustup toolchain install --profile minimal --component rustfmt
          rustup show active-toolchain
      - name: Python script syntax
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/python-script-pycache
        run: >-
          python3 -m py_compile
          scripts/lints/*.py
          scripts/lints/protocol_pin/*.py
          scripts/harness.py
          scripts/operations/*.py
          scripts/benchmarks/*.py
          scripts/release/*.py
          scripts/ci/*.py
      - name: No build-artifact blobs in tree
        uses: EdgeVector/.github/no-build-artifacts@f250aa7f93f92e9d6876fbedbb097a7c5e145f95
        with:
          tree: HEAD
      - name: Source lints (egress, redaction, byte slice, spawn, URLs, edition, statics, model purity)
        run: python3 scripts/lints/source_lints.py
      - name: API surface vs API_VERSION
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          args=(--check)
          if [ -n "${BASE_SHA:-}" ] && ! [[ "$BASE_SHA" =~ ^0+$ ]] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            args+=(--base "$BASE_SHA")
          fi
          python3 scripts/lints/api_surface.py "${args[@]}"
      - name: App API SDK types
        run: python3 scripts/lints/app_api_types.py --check
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: Record counter writer-boundary lint
        run: python3 scripts/lints/lint-store-writers.py
      - name: App concept boundary (People presets stay in People)
        run: python3 scripts/lints/lint-concept-boundary.py
      - name: Module layer check
        uses: EdgeVector/.github/layer-check@f250aa7f93f92e9d6876fbedbb097a7c5e145f95
        with:
          crates: fold_db/crates/model fold_db/crates/core lastdb_node
      - name: Heavy clippy workspace-coverage lint
        run: ruby scripts/lints/lint-heavy-clippy-workspace-coverage.rb

  lastdb_app_sdk_check:
    name: lastdb_app_sdk typecheck + lint + build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Check Node/npm toolchain
        run: |
          node --version
          npm --version
      - name: npm ci
        working-directory: lastdb_app_sdk
        run: npm ci
      - name: npm run typecheck
        working-directory: lastdb_app_sdk
        run: npm run typecheck
      - name: npm run lint
        working-directory: lastdb_app_sdk
        run: npm run lint
      - name: npm run build
        working-directory: lastdb_app_sdk
        run: npm run build

  full_workspace_check:
    name: full workspace cargo clippy (heavy)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install --profile minimal --component clippy,rustfmt
          rustup show active-toolchain
      - name: Cache cargo and target (full_workspace_check)
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: heavy
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo clippy --workspace --lib --bins
        run: |
          ulimit -n 8192 || true
          cargo clippy --workspace --lib --bins --locked \
            -- -D warnings
      - name: cargo clippy (domain & schema libs)
        run: >-
          cargo clippy --locked -p schema_service_core -p mutation_log --lib
          -- -D warnings -D clippy::disallowed_methods -D clippy::disallowed_types

  diff_file_size:
    name: Changed-file size lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Enforce source diff size and allow policy
        uses: EdgeVector/.github/source-diff-policy@f250aa7f93f92e9d6876fbedbb097a7c5e145f95
        with:
          base: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
          head: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          extensions: .rs,.py,.ts

  secret_scan:
    name: secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Scan tracked text files for secrets
        uses: EdgeVector/.github/secret-scan@f250aa7f93f92e9d6876fbedbb097a7c5e145f95

  # Both tools read Cargo.lock, the manifests, and the RustSec advisory DB.
  # Neither compiles. A newly published advisory fails this job on every PR
  # until a compatible `cargo update -p` fixes it or deny.toml ignores it
  # with a reason. The versions are pinned to the ones that triaged main.
  supply_chain:
    name: supply chain (cargo-deny + cargo-machete)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install --profile minimal
          rustup show active-toolchain
      - name: Install cargo-deny and cargo-machete
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.19.7,cargo-machete@0.9.2
      - name: cargo deny (advisories, bans, licenses, sources)
        run: cargo deny --locked --workspace check
      - name: cargo machete (unused dependencies)
        run: cargo-machete --skip-target-dir

  record_home:
    name: Record home product proof
    permissions:
      contents: read
    uses: ./.github/workflows/record-home.yml

  # A PR that changes the socket surface file or an interface version starts
  # stable-release.yml, whose app-compatibility job runs the apps from every
  # supported signed list against the PR build. This job waits for that exact
  # result on the PR head. Every other PR and event passes at once.
  installed_app_gate:
    name: installed apps vs socket surface
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Wait for the installed-app proof when the surface changed
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci/installed_app_gate.py --base "$BASE_SHA" --head "$HEAD_SHA"

  # Compares cloud_backup_protocol with the fold gitlink on exemem-infra main.
  # No cloud credentials. The default token is tried first. GH_PAT is the
  # fallback when that token cannot see the repository. A missing pin fails closed.
  protocol_pin:
    name: cloud protocol vs deployed storage
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Install tree-sitter
        run: python3 -m pip install --quiet tree-sitter==0.23.2 tree-sitter-rust==0.23.2
      - name: Deployed storage must accept this protocol
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python3 scripts/lints/lint-cloud-protocol-pin.py

  # The relay contract is the relay_protocol crate. The committed OpenAPI file must be
  # the one the crate generates, and it may only add under /relay/v1/ (pinned oasdiff).
  relay_contract:
    name: relay contract (generated, additions only)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OASDIFF_VERSION: 1.35.0
      OASDIFF_SHA256: a8023002fcb2eaa7f5758148a9303cb63d33b939886df312268bc0fc7b939140
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Rust
        run: |
          rustup toolchain install --profile minimal
          rustup show active-toolchain
      - name: Cache cargo and target (relay_contract)
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: relay-contract
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Generate the contract from the crate
        run: |
          cargo run --locked --quiet -p relay_protocol --features schema \
            --bin relay-protocol-openapi >"$RUNNER_TEMP/relay-protocol.openapi.json"
      - name: Keep the generated contract
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: relay-protocol-openapi-${{ github.run_id }}
          path: ${{ runner.temp }}/relay-protocol.openapi.json
          retention-days: 14
      - name: The committed contract is the generated one
        run: |
          if ! diff -u docs/designs/relay-protocol.openapi.json "$RUNNER_TEMP/relay-protocol.openapi.json"; then
            echo "::error::docs/designs/relay-protocol.openapi.json is not what relay_protocol generates. Run: cargo run -p relay_protocol --features schema --bin relay-protocol-openapi > docs/designs/relay-protocol.openapi.json (or take the artifact of this run)."
            exit 1
          fi
      - name: Install oasdiff (pinned, checksum checked)
        run: |
          set -euo pipefail
          archive="oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/$archive"
          echo "$OASDIFF_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/oasdiff"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/oasdiff" oasdiff
      - name: Only additions under /relay/v1/
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          BREAK_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'relay-contract-break-approved') }}
        run: |
          approved=()
          if [ "$BREAK_APPROVED" = "true" ]; then approved=(--break-approved); fi
          python3 scripts/ci/relay_contract_breaking.py --base "$BASE_SHA" \
            --head-file "$RUNNER_TEMP/relay-protocol.openapi.json" \
            --oasdiff "$RUNNER_TEMP/oasdiff/oasdiff" "${approved[@]}"

  # Starts EdgeVector/people DEV sharing on people main against this LastDB
  # SHA (PR head, push SHA, or workflow_dispatch input). People keeps the
  # recipes and the DEV publisher secrets; this job only dispatches and waits.
  # GH_PAT must be able to workflow_dispatch people `dev-sharing.yml`.
  people_dev_sharing:
    name: People DEV sharing proof
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Dispatch People DEV sharing and wait
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          LASTDB_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.lastdb_source_sha || github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/ci/people_dev_sharing_gate.py --sha "$LASTDB_SHA"

  ci-required:
    name: ci-required
    needs:
      - build_test
      - lastdb_app_sdk_check
      - full_workspace_check
      - diff_file_size
      - secret_scan
      - supply_chain
      - record_home
      - protocol_pin
      - relay_contract
      - installed_app_gate
      - people_dev_sharing
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: All required jobs must succeed
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          echo "Required job results: $RESULTS"
          # Every non-test required job must succeed.
          # A skip is a failure.
          if [ "$RESULTS" != "success,success,success,success,success,success,success,success,success,success,success" ]; then
            echo "A required job did not succeed"
            exit 1
          fi
          echo "All required jobs passed."
