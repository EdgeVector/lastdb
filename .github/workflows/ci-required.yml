name: CI required

# Required merge gate on GitHub Actions (decision-2026-09-29-fold-venue-back-to-github).
# GitHub owns the required gate. The retired Forgejo workflows are absent from
# this tree. Tests stay retired. The gate keeps fmt, clippy, lints, the
# lastdb_app_sdk typecheck, the schema service start check, a tracked-text
# secret scan, builds, and the atom history product proof.
# No coverage check is required.
# The single required check is the `ci-required` job at the bottom.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-required-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_BUILD_JOBS: "4"
  CARGO_TERM_COLOR: always

jobs:
  build_test:
    name: fmt + clippy (lastdb_node Mini lane)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install ripgrep
        run: sudo apt-get install -y --no-install-recommends ripgrep
      - name: Install Rust
        run: |
          rustup toolchain install --profile minimal --component clippy,rustfmt
          rustup show active-toolchain
      - name: Cache cargo and target (build_test)
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: fmt-clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Select required Rust clippy scope
        id: required-clippy-plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_SHA:-}" ] || [ -z "${HEAD_SHA:-}" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            ruby scripts/ci/required-clippy-plan.rb --github-output "$GITHUB_OUTPUT"
            exit 0
          fi
          merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || true)"
          if [ -z "$merge_base" ]; then
            ruby scripts/ci/required-clippy-plan.rb --github-output "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$merge_base" "$HEAD_SHA" \
            | ruby scripts/ci/required-clippy-plan.rb --github-output "$GITHUB_OUTPUT"
          echo "Required clippy mode: $(tail -n 4 "$GITHUB_OUTPUT" | tr '\n' ' ')"
      - name: Bootstrap Mini-gate step state
        run: |
          set -euo pipefail
          state_dir="${RUNNER_TEMP:-/tmp}/mini-gate"
          mkdir -p "$state_dir"
          date +%s >"$state_dir/job_started_at_epoch"
          echo "unknown-pre-instrumented-step" >"$state_dir/last_step"
          echo "MINI_GATE_STATE_DIR=$state_dir" >>"$GITHUB_ENV"
      - name: App registry shelf lint
        run: bash scripts/ci/mini-gate-step.sh "App registry shelf lint" -- bash scripts/lints/lint-app-registry-shelf.sh
      - name: Cloud recovery recipe syntax
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/cloud-recipe-pycache
        run: bash scripts/ci/mini-gate-step.sh "Cloud recovery recipe syntax" -- python3 -m py_compile scripts/cloud_backup/*.py
      - name: No build-artifact blobs in tree
        run: bash scripts/ci/mini-gate-step.sh "No build-artifact blobs in tree" -- bash scripts/lints/lint-no-build-artifacts.sh --tree HEAD
      - name: cargo fmt --check
        run: bash scripts/ci/mini-gate-step.sh "cargo fmt --check" -- cargo fmt --all -- --check
      - name: lint no write-path syncing store
        run: bash scripts/ci/mini-gate-step.sh "lint no write-path syncing store" -- bash scripts/lints/lint-no-write-path-syncing-store.sh
      - name: Atom counter writer-boundary lint
        run: bash scripts/ci/mini-gate-step.sh "Atom counter writer-boundary lint" -- python3 scripts/lints/lint-atom-counter-writers.py
      - name: Model purity lint
        run: bash scripts/ci/mini-gate-step.sh "Model purity lint" -- bash scripts/ci/model-purity-lint.sh
      - name: Module layer check
        run: bash scripts/ci/mini-gate-step.sh "Module layer check" -- python3 scripts/ci/layer-check.py --crate fold_db/crates/model --crate fold_db/crates/core --crate lastdb_node
      - name: Workspace fastembed-unification lint
        run: bash scripts/ci/mini-gate-step.sh "Workspace fastembed-unification lint" -- bash scripts/ci/lint-workspace-fastembed-unification.sh
      - name: Heavy clippy workspace-coverage lint
        run: bash scripts/ci/mini-gate-step.sh "Heavy clippy workspace-coverage lint" -- ruby scripts/lints/lint-heavy-clippy-workspace-coverage.rb
      - name: cargo clippy (path-selected required lane)
        if: steps.required-clippy-plan.outputs.run_clippy == 'true'
        env:
          CARGO_BUILD_JOBS: "2"
          CLIPPY_FAMILY: ${{ steps.required-clippy-plan.outputs.family }}
          CLIPPY_MODE: ${{ steps.required-clippy-plan.outputs.mode }}
        run: bash scripts/ci/mini-gate-step.sh "cargo clippy (${CLIPPY_MODE}:${CLIPPY_FAMILY})" -- ruby scripts/ci/required-clippy-plan.rb --run "$CLIPPY_FAMILY"
      - name: cargo clippy (schema_service_core functional core)
        env:
          CARGO_BUILD_JOBS: "2"
        run: bash scripts/ci/mini-gate-step.sh "cargo clippy (schema_service_core)" -- cargo clippy --locked -p schema_service_core --lib --features schema-org-seed-data -- -D warnings -D clippy::disallowed_methods -D clippy::disallowed_types
      - name: Schema core statics gate
        run: bash scripts/ci/mini-gate-step.sh "Schema core statics gate" -- bash scripts/lints/lint-schema-core-statics.sh
      - name: Assert fastembed is NOT compiled in the Mini gate lane
        run: |
          bash scripts/ci/mini-gate-step.sh "Assert fastembed is NOT compiled in the Mini gate lane" -- bash -euo pipefail -c '
          tree="$(cargo tree -p lastdb_node -e no-dev -i fastembed 2>&1 || true)"
          if printf "%s\n" "$tree" | grep -q "^fastembed v"; then
            echo "FAIL: fastembed is linked into the default lastdb_node lane:" >&2
            printf "%s\n" "$tree" >&2
            echo "lastdb_node product graph must stay fastembed-free; FastEmbed belongs to schema-service tooling only." >&2
            exit 1
          fi
          echo "OK: fastembed is not compiled in the default lastdb_node lane."
          '

  lastdb_app_sdk_check:
    name: lastdb_app_sdk typecheck + lint + build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Check Node/npm toolchain
        run: |
          node --version
          npm --version
      - name: npm ci
        working-directory: lastdb_app_sdk
        run: npm ci
      - name: npm run typecheck
        working-directory: lastdb_app_sdk
        run: npm run typecheck
      - name: npm run lint
        working-directory: lastdb_app_sdk
        run: npm run lint
      - name: npm run build
        working-directory: lastdb_app_sdk
        run: npm run build

  full_workspace_check:
    name: full workspace cargo clippy (heavy)
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Install ripgrep
        run: sudo apt-get install -y --no-install-recommends ripgrep
      - name: Install Rust
        run: |
          rustup toolchain install --profile minimal --component clippy,rustfmt
          rustup show active-toolchain
      - name: Cache cargo and target (full_workspace_check)
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: heavy
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Workspace fastembed-unification lint
        run: bash scripts/ci/lint-workspace-fastembed-unification.sh
      - name: Heavy clippy workspace-coverage lint
        run: ruby scripts/lints/lint-heavy-clippy-workspace-coverage.rb
      - name: cargo clippy --workspace --lib --bins (no ONNX packages)
        run: |
          ulimit -n 8192 || true
          cargo clippy --workspace --lib --bins --locked \
            --exclude generate_validated_schema_org_seeds \
            --exclude schema_service_worker \
            -- -D warnings
      - name: cargo clippy off-lane fastembed bins
        run: |
          ulimit -n 8192 || true
          cargo clippy --locked \
            -p generate_validated_schema_org_seeds \
            -p schema_service_worker \
            --bins \
            -- -D warnings
      - name: Start the default schema service and read its seed vocabulary
        run: |
          set -euo pipefail
          cargo build --locked -p schema_service_server_http --bin schema_service
          runtime="$(mktemp -d "$RUNNER_TEMP/schema-service-startup.XXXXXX")"
          OBS_FILE_PATH="$runtime/observability.jsonl" \
            target/debug/schema_service --port 19102 >"$runtime/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          if ! curl --fail --silent --show-error --retry 30 --retry-connrefused \
            --retry-delay 1 --max-time 2 http://127.0.0.1:19102/v1/health \
            --output "$runtime/health.json"; then
            cat "$runtime/server.log"
            exit 1
          fi
          curl --fail --silent --show-error --max-time 10 \
            http://127.0.0.1:19102/v1/fields/vocabulary --output "$runtime/vocabulary.json"
          seed_count="$(jq length schema_service/crates/core/src/builtin_canonical_fields.json)"
          jq --exit-status --argjson expected "$seed_count" \
            '.name_policy_version == 1 and (.fields | length) == $expected' \
            "$runtime/vocabulary.json"
          kill -0 "$server_pid"
          printf 'Default schema service started without FastEmbed; GET vocabulary returned %s seed fields. Source: %s\n' \
            "$seed_count" "$GITHUB_SHA" >>"$GITHUB_STEP_SUMMARY"

  diff_file_size:
    name: Changed-file size lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install tree-sitter (pinned)
        run: python3 -m pip install --quiet tree-sitter==0.23.2 tree-sitter-rust==0.23.2
      - name: Touched Rust functions stay under the size limit
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/lints/lint-diff-fn-size.py --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Changed Rust files stay under the size limit
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/lints/lint-diff-file-size.py --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: No new too_many_arguments allows
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/lints/lint-diff-new-allows.py --base "$BASE_SHA" --head "$HEAD_SHA"

  secret_scan:
    name: secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Scan tracked text files for secrets
        run: python3 scripts/lints/lint-secrets.py

  atom_history:
    name: Atom history product proof
    permissions:
      contents: read
    uses: ./.github/workflows/atom-history.yml
    with:
      base_sha: ${{ github.event.pull_request.base.sha || '' }}
      head_sha: ${{ github.event.pull_request.head.sha || '' }}

  record_home:
    name: Record home product proof
    permissions:
      contents: read
    uses: ./.github/workflows/record-home.yml
    with:
      base_sha: ${{ github.event.pull_request.base.sha || '' }}
      head_sha: ${{ github.event.pull_request.head.sha || '' }}

  ci-required:
    name: ci-required
    needs:
      - build_test
      - lastdb_app_sdk_check
      - full_workspace_check
      - diff_file_size
      - secret_scan
      - atom_history
      - record_home
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: All required jobs must succeed
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          echo "Required job results: $RESULTS"
          # Every non-test required job must succeed.
          # A skip is a failure.
          if [ "$RESULTS" != "success,success,success,success,success,success,success" ]; then
            echo "A required job did not succeed"
            exit 1
          fi
          echo "All required jobs passed."
