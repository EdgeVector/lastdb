name: app-install-smoke

# End-to-end install smoke: build LastDB, install the newest proved stable
# row, then run that app on this build.
#
# A main build has no exact compat row. The public stable index still names
# the last proved build, which is the brew bottle version string. Install
# uses that row. Health checks still fail the job. The daemon keeps a
# 16 MiB worker stack so a debug build can finish the first write.
#
# No unit tests (deleted 2026-10-09). This is an e2e smoke with real installs.

on:
  pull_request:
    paths:
      - .github/workflows/app-install-smoke.yml
  workflow_dispatch:
    inputs:
      apps:
        description: 'Apps to test (comma-separated: brain,search,lastsecrets or "all")'
        required: false
        default: 'brain'
  schedule:
    # Daily at 09:00 UTC - catch app/lastdb compatibility breakage
    - cron: '0 9 * * *'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  app-install-smoke:
    name: install-${{ matrix.app }}
    runs-on: macos-14  # Apple Silicon like production
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app:
          - brain
          # Add more apps as they get smoke tests
          # - search
          # - lastsecrets
    steps:
      - uses: actions/checkout@v7

      - name: Configure git for private dependencies
        run: git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Install Rust toolchain
        run: rustup show active-toolchain

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: app-smoke-macos-aarch64

      - name: Build LastDB Mini binaries
        run: |
          cargo build --locked -p lastdb_node --bin lastdb --bin lastdbd
          
          # Verify builds
          target/debug/lastdb --version
          target/debug/lastdbd --version

      - name: Set up test environment
        run: |
          # Fresh isolated home for this test
          export TEST_HOME="${HOME}/app-smoke-test-$$"
          mkdir -p "$TEST_HOME"
          echo "TEST_HOME=$TEST_HOME" >> "$GITHUB_ENV"
          echo "LASTDB_HOME=$TEST_HOME/.lastdb" >> "$GITHUB_ENV"
          
          # Add built binaries to PATH
          echo "$(pwd)/target/debug" >> "$GITHUB_PATH"
          
          # Create proof directory
          mkdir -p "$TEST_HOME/proof"
          echo "PROOF_DIR=$TEST_HOME/proof" >> "$GITHUB_ENV"

      - name: Start LastDB daemon
        run: |
          cd "$TEST_HOME"
          
          # Start daemon in background
          lastdbd --data-dir "$LASTDB_HOME" > "$PROOF_DIR/lastdbd-startup.log" 2>&1 &
          LASTDBD_PID=$!
          echo "LASTDBD_PID=$LASTDBD_PID" >> "$GITHUB_ENV"
          
          # Wait for socket
          timeout=60
          while [ $timeout -gt 0 ] && [ ! -S "$LASTDB_HOME/data/folddb.sock" ]; do
            sleep 1
            timeout=$((timeout - 1))
          done
          
          if [ ! -S "$LASTDB_HOME/data/folddb.sock" ]; then
            echo "LastDB socket did not appear after 60s"
            cat "$PROOF_DIR/lastdbd-startup.log"
            exit 1
          fi
          
          # Check health
          lastdb --data-dir "$LASTDB_HOME" status | tee "$PROOF_DIR/lastdb-status-initial.txt"
          
          # Log LastDB version being tested
          lastdb --version | tee "$PROOF_DIR/lastdb-version.txt"

      - name: Query static registry
        run: |
          cd "$TEST_HOME"
          
          # List available apps in registry
          lastdb app list --channel stable | tee "$PROOF_DIR/registry-apps.txt"
          
          # Show app info from registry (already JSON output)
          lastdb app info ${{ matrix.app }} | tee "$PROOF_DIR/${{ matrix.app }}-registry-info.json"

          # The stable row key is the proved build string, not this commit.
          curl -fsSL "https://raw.githubusercontent.com/EdgeVector/homebrew-lastdb/main/registry/stable.json" \
            -o "$PROOF_DIR/stable-index.json"
          PROVED_BUILD="$(jq -r --arg app "${{ matrix.app }}" '
            [.apps[] | select(.app_id == $app) | .compat[]]
            | max_by(.proved_at)
            | .lastdb_version // empty
          ' "$PROOF_DIR/stable-index.json")"
          if [ -z "$PROVED_BUILD" ]; then
            echo "No stable compat row for ${{ matrix.app }}"
            exit 1
          fi
          echo "Newest proved lastdb build: $PROVED_BUILD"
          echo "PROVED_BUILD=$PROVED_BUILD" >> "$GITHUB_ENV"
          printf '%s\n' "$PROVED_BUILD" > "$PROOF_DIR/proved-lastdb-version.txt"

          lastdb app resolve ${{ matrix.app }} --json --lastdb-version "$PROVED_BUILD" \
            | tee "$PROOF_DIR/${{ matrix.app }}-resolve.json"

      - name: Install ${{ matrix.app }} from registry
        run: |
          cd "$TEST_HOME"

          if [ -z "${PROVED_BUILD:-}" ]; then
            echo "PROVED_BUILD is empty"
            exit 1
          fi
          
          # Install the newest proved row. The daemon under test is still this build.
          lastdb app install ${{ matrix.app }} --channel stable --lastdb-version "$PROVED_BUILD" \
            2>&1 | tee "$PROOF_DIR/${{ matrix.app }}-install.log"
          
          # Verify install receipt
          if [ -f "$LASTDB_HOME/apps/${{ matrix.app }}/lastdb-app-install.json" ]; then
            cat "$LASTDB_HOME/apps/${{ matrix.app }}/lastdb-app-install.json" | tee "$PROOF_DIR/${{ matrix.app }}-install-receipt.json"
          else
            echo "Install receipt not found at $LASTDB_HOME/apps/${{ matrix.app }}/lastdb-app-install.json"
            ls -la "$LASTDB_HOME/apps/" || echo "apps dir does not exist"
            exit 1
          fi

      - name: Set up ${{ matrix.app }} dependencies (Brain)
        if: matrix.app == 'brain'
        run: |
          set -o pipefail
          # Work in the source checkout
          cd "$LASTDB_HOME/apps/${{ matrix.app }}/source"
          
          # Install Bun (Brain's package manager)
          brew install bun
          
          # Install dependencies
          bun install --frozen-lockfile 2>&1 | tee "$PROOF_DIR/${{ matrix.app }}-deps-install.log"
          
          # bun link only registers the package name. It does not install the
          # command. Later steps call `brain`, so put bin/brain on PATH.
          chmod +x "$PWD/bin/brain"
          BUN_BIN="${BUN_INSTALL:-$HOME/.bun}/bin"
          mkdir -p "$BUN_BIN"
          ln -sfn "$PWD/bin/brain" "$BUN_BIN/brain"
          if [ ! -x "$BUN_BIN/brain" ]; then
            echo "brain command is not executable at $BUN_BIN/brain"
            exit 1
          fi
          echo "$BUN_BIN" >> "$GITHUB_PATH"
          "$BUN_BIN/brain" --version 2>&1 | tee "$PROOF_DIR/${{ matrix.app }}-link.log"

      - name: Initialize ${{ matrix.app }} schemas (Brain)
        if: matrix.app == 'brain'
        run: |
          # Work from source checkout
          cd "$LASTDB_HOME/apps/${{ matrix.app }}/source"
          
          # Sync schemas with LastDB
          brain init 2>&1 | tee "$PROOF_DIR/${{ matrix.app }}-init.log" || true
          
          # Check schema registration
          lastdb --data-dir "$LASTDB_HOME" schemas list | grep -E "brain|fbrain" | tee "$PROOF_DIR/${{ matrix.app }}-schemas.txt" || echo "No brain schemas found"

      - name: Run ${{ matrix.app }} health checks (Brain)
        if: matrix.app == 'brain'
        run: |
          set -o pipefail
          # The socket file can outlive a dead daemon. Fail here with the
          # daemon log instead of a later "socket did not accept" line.
          if ! kill -0 "$LASTDBD_PID" 2>/dev/null; then
            echo "lastdbd pid $LASTDBD_PID is not running"
            tail -n 50 "$PROOF_DIR/lastdbd-startup.log"
            exit 1
          fi

          # Test basic Brain commands
          brain --version 2>&1 | tee "$PROOF_DIR/${{ matrix.app }}-version.txt"
          
          # List empty brain (should succeed)
          brain list 2>&1 | tee "$PROOF_DIR/${{ matrix.app }}-list-empty.txt"
          
          # Try creating a test concept. put reads the body from stdin.
          # --content is rejected. The slug is the only positional.
          # The type is --type.
          TEST_ID="test-concept-ci-$$"
          echo "Testing ${{ matrix.app }} write and read operations with ID: $TEST_ID"
          
          printf '%s\n' "Test concept from app-install-smoke CI run ${{ github.run_number }}" | brain put "$TEST_ID" --type concept 2>&1 | tee "$PROOF_DIR/${{ matrix.app }}-put-test.txt" || {
            echo "Brain put failed"
            cat "$PROOF_DIR/${{ matrix.app }}-put-test.txt"
            exit 1
          }
          
          # Try reading it back. get takes the slug, then --type.
          brain get "$TEST_ID" --type concept 2>&1 | tee "$PROOF_DIR/${{ matrix.app }}-get-test.txt" || {
            echo "Brain get failed"
            cat "$PROOF_DIR/${{ matrix.app }}-get-test.txt"
            exit 1
          }
          
          # Verify content contains our test string
          if grep -q "Test concept from app-install-smoke" "$PROOF_DIR/${{ matrix.app }}-get-test.txt"; then
            echo "✓ Brain read/write test passed"
          else
            echo "✗ Brain read/write test failed - content mismatch"
            exit 1
          fi
          
          # Check LastDB status after operations
          lastdb --data-dir "$LASTDB_HOME" status | tee "$PROOF_DIR/lastdb-status-after-${{ matrix.app }}.txt"

      - name: Collect proof summary
        if: always()
        run: |
          cd "$PROOF_DIR"
          
          # Get LastDB build info
          LASTDB_VERSION=$(cat lastdb-version.txt 2>/dev/null || echo "unknown")
          
          # Get app resolution
          APP_SHA=$(cat ${{ matrix.app }}-resolve.json 2>/dev/null | grep -o '"sha":"[^"]*"' | head -1 | cut -d'"' -f4 || echo "unknown")
          APP_VERSION=$(cat ${{ matrix.app }}-resolve.json 2>/dev/null | grep -o '"app_version":"[^"]*"' | head -1 | cut -d'"' -f4 || echo "unknown")
          
          # Create summary
          cat > smoke-summary.txt <<EOF
          LastDB App Install Smoke Test
          ==============================
          Date: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          App: ${{ matrix.app }}
          Runner: macos-14 (Apple Silicon)
          CI Run: ${{ github.run_number }}
          
          LastDB Build:
          $LASTDB_VERSION

          Proved row:
          ${PROVED_BUILD:-unknown}
          
          App Resolution:
          - Version: $APP_VERSION
          - SHA: $APP_SHA
          
          Install Receipt:
          $(cat ${{ matrix.app }}-install-receipt.json 2>/dev/null | head -20 || echo "N/A")
          
          Health Check Results:
          EOF
          
          if [ "${{ matrix.app }}" = "brain" ]; then
            cat >> smoke-summary.txt <<EOF
          - Brain version: $(cat brain-version.txt 2>/dev/null || echo "FAILED")
          - Brain list: $(test -f brain-list-empty.txt && echo "OK" || echo "FAILED")
          - Brain schemas: $(grep -c "brain" brain-schemas.txt 2>/dev/null || echo "0") registered
          - Write test: $(grep -q "test-concept" brain-put-test.txt 2>/dev/null && echo "OK" || echo "FAILED")
          - Read test: $(grep -q "Test concept from app-install-smoke" brain-get-test.txt 2>/dev/null && echo "OK" || echo "FAILED")
          EOF
          fi
          
          echo ""
          cat smoke-summary.txt

      - name: Upload proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-install-smoke-${{ matrix.app }}-${{ github.run_number }}
          path: ${{ env.PROOF_DIR }}
          if-no-files-found: error

      - name: Add summary to job output
        if: always()
        run: |
          echo "## App Install Smoke: ${{ matrix.app }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat "$PROOF_DIR/smoke-summary.txt" >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "Summary not available" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Cleanup
        if: always()
        run: |
          # Stop LastDB
          if [ -n "$LASTDBD_PID" ]; then
            kill "$LASTDBD_PID" 2>/dev/null || true
            sleep 2
            kill -9 "$LASTDBD_PID" 2>/dev/null || true
          fi
          
          # Remove test home (proof saved via artifact)
          rm -rf "$TEST_HOME"

  smoke-report:
    name: smoke-report
    if: ${{ always() }}
    needs: [app-install-smoke]
    runs-on: ubuntu-24.04
    steps:
      - name: Report smoke test results
        run: |
          echo "app-install-smoke=${{ needs.app-install-smoke.result }}"
          
          # This is a canary job - report status but never block
          if [ "${{ needs.app-install-smoke.result }}" = "success" ]; then
            echo "✓ Smoke tests passed"
          else
            echo "✗ Smoke tests failed - review artifacts"
          fi
          
          # Always succeed - this is not a gate
          exit 0
