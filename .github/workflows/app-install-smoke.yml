name: app-install-smoke

# End-to-end install smoke: build LastDB, install the newest proved
# row for each app, then run that app on this build. Tests all four priority
# apps (Brain, LastSecrets, lastseek, Search) across both contract surfaces
# (HTTP API + outbox).
#
# The stable shelf is the last brew release. Its brain row is from
# 2026-10-01 and still sends the field name body. Schema service rejects
# that name. The next shelf has the row proved with the current nightly.
# That brain sends canonical field names. Install uses next when the app
# has a next row, and stable when it does not. The daemon keeps a 64 MiB
# worker stack so a debug build can finish a brain write.
#
# No unit tests (deleted 2026-10-09). This is an e2e smoke with real installs.

on:
  pull_request:
    paths:
      - .github/workflows/app-install-smoke.yml
  workflow_dispatch:
    inputs:
      apps:
        description: 'Apps to test (comma-separated: brain,lastsecrets,lastseek,search or "all")'
        required: false
        default: 'all'
  schedule:
    # Daily at 09:00 UTC - catch app/lastdb compatibility breakage
    - cron: '0 9 * * *'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  app-install-smoke:
    name: install-${{ matrix.app }}
    runs-on: macos-14  # Apple Silicon like production
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app:
          - brain
          - lastsecrets
          - lastseek
          - search
    steps:
      - uses: actions/checkout@v7

      - name: Configure git for private dependencies
        run: git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Install Rust toolchain
        run: rustup show active-toolchain

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: app-smoke-macos-aarch64

      - name: Build LastDB Mini binaries
        run: |
          cargo build --locked -p lastdb_node --bin lastdb --bin lastdbd
          
          # Verify builds
          target/debug/lastdb --version
          target/debug/lastdbd --version

      - name: Set up test environment
        run: |
          # Fresh isolated home for this test
          export TEST_HOME="${HOME}/app-smoke-test-$$"
          mkdir -p "$TEST_HOME"
          echo "TEST_HOME=$TEST_HOME" >> "$GITHUB_ENV"
          echo "LASTDB_HOME=$TEST_HOME/.lastdb" >> "$GITHUB_ENV"
          
          # Add built binaries to PATH
          echo "$(pwd)/target/debug" >> "$GITHUB_PATH"
          
          # Create proof directory
          mkdir -p "$TEST_HOME/proof"
          echo "PROOF_DIR=$TEST_HOME/proof" >> "$GITHUB_ENV"

      - name: Start LastDB daemon
        if: always()
        run: |
          cd "$TEST_HOME"
          
          # Start daemon in background
          lastdbd --data-dir "$LASTDB_HOME" > "$PROOF_DIR/lastdbd-startup.log" 2>&1 &
          LASTDBD_PID=$!
          echo "LASTDBD_PID=$LASTDBD_PID" >> "$GITHUB_ENV"
          
          # Wait for socket file to appear
          timeout=60
          while [ $timeout -gt 0 ] && [ ! -S "$LASTDB_HOME/data/folddb.sock" ]; do
            sleep 1
            timeout=$((timeout - 1))
          done
          
          if [ ! -S "$LASTDB_HOME/data/folddb.sock" ]; then
            echo "LastDB socket did not appear after 60s"
            cat "$PROOF_DIR/lastdbd-startup.log"
            exit 1
          fi
          
          # Wait for daemon to be actually ready (not just socket file existing)
          echo "Socket file exists, now testing daemon responsiveness..."
          timeout=60
          while [ $timeout -gt 0 ]; do
            if lastdb --data-dir "$LASTDB_HOME" status > /dev/null 2>&1; then
              echo "Daemon is responding"
              break
            fi
            sleep 1
            timeout=$((timeout - 1))
          done
          
          # Final health check
          if ! lastdb --data-dir "$LASTDB_HOME" status > "$PROOF_DIR/lastdb-status-initial.txt" 2>&1; then
            echo "LastDB daemon is not responding after 60s"
            cat "$PROOF_DIR/lastdbd-startup.log"
            cat "$PROOF_DIR/lastdb-status-initial.txt"
            exit 1
          fi
          
          echo "Daemon started successfully"
          cat "$PROOF_DIR/lastdb-status-initial.txt"
          
          # Log LastDB version being tested
          lastdb --version | tee "$PROOF_DIR/lastdb-version.txt"

      - name: Query static registry
        if: always()
        run: |
          cd "$TEST_HOME"
          
          # Prefer the next shelf. Stable is the last brew release and
          # still names the 2026-10-01 brain, which sends field name body.
          curl -fsSL "https://raw.githubusercontent.com/EdgeVector/homebrew-lastdb/main/registry/next.json" \
            -o "$PROOF_DIR/next-index.json"
          curl -fsSL "https://raw.githubusercontent.com/EdgeVector/homebrew-lastdb/main/registry/stable.json" \
            -o "$PROOF_DIR/stable-index.json"
          APP="${{ matrix.app }}"
          CHANNEL=stable
          if jq -e --arg app "$APP" '.apps[] | select(.app_id == $app) | .compat[0]' "$PROOF_DIR/next-index.json" >/dev/null; then
            CHANNEL=next
          fi
          echo "REGISTRY_CHANNEL=$CHANNEL" >> "$GITHUB_ENV"
          echo "Registry channel: $CHANNEL"
          lastdb app list --channel "$CHANNEL" | tee "$PROOF_DIR/registry-apps.txt"

          if ! lastdb app info "$APP" --channel "$CHANNEL" > "$PROOF_DIR/${APP}-registry-info.json" 2>"$PROOF_DIR/${APP}-registry-info.err"; then
            echo "app $APP is not in the $CHANNEL registry"
            echo "SKIP_REGISTRY=true" >> "$GITHUB_ENV"
            echo "INSTALLED=false" >> "$GITHUB_ENV"
            cat "$PROOF_DIR/${APP}-registry-info.err" || true
            exit 0
          fi
          cat "$PROOF_DIR/${APP}-registry-info.json"

          # The row key is the proved build string, not this commit.
          PROVED_BUILD="$(jq -r --arg app "$APP" '
            [.apps[] | select(.app_id == $app) | .compat[]]
            | max_by(.proved_at)
            | .lastdb_version // empty
          ' "$PROOF_DIR/${CHANNEL}-index.json")"
          if [ -z "$PROVED_BUILD" ]; then
            echo "No $CHANNEL compat row for $APP"
            exit 1
          fi
          echo "Newest proved lastdb build: $PROVED_BUILD"
          echo "PROVED_BUILD=$PROVED_BUILD" >> "$GITHUB_ENV"
          printf '%s\n' "$PROVED_BUILD" > "$PROOF_DIR/proved-lastdb-version.txt"

          lastdb app resolve "$APP" --json --channel "$CHANNEL" --lastdb-version "$PROVED_BUILD" \
            | tee "$PROOF_DIR/${APP}-resolve.json"

      - name: Install ${{ matrix.app }} from registry
        if: always() && env.SKIP_REGISTRY != 'true'
        run: |
          set -o pipefail  # Make pipe failures detectable
          cd "$TEST_HOME"

          if [ -z "${PROVED_BUILD:-}" ]; then
            echo "PROVED_BUILD is empty"
            exit 1
          fi
          
          # Install the newest proved row. The daemon under test is still this build.
          if lastdb app install ${{ matrix.app }} --channel "$REGISTRY_CHANNEL" --lastdb-version "$PROVED_BUILD" 2>&1 | tee "$PROOF_DIR/${{ matrix.app }}-install.log"; then
            echo "INSTALLED=true" >> "$GITHUB_ENV"
            
            # Verify install receipt
            if [ -f "$LASTDB_HOME/apps/${{ matrix.app }}/lastdb-app-install.json" ]; then
              cat "$LASTDB_HOME/apps/${{ matrix.app }}/lastdb-app-install.json" | tee "$PROOF_DIR/${{ matrix.app }}-install-receipt.json"
            fi
            
            # Set APP_SOURCE for registry-installed apps
            if [ -d "$LASTDB_HOME/apps/${{ matrix.app }}/source" ]; then
              echo "APP_SOURCE=$LASTDB_HOME/apps/${{ matrix.app }}/source" >> "$GITHUB_ENV"
              echo "Using registry-installed source: $LASTDB_HOME/apps/${{ matrix.app }}/source"
            fi
          else
            echo "INSTALLED=false" >> "$GITHUB_ENV"
            echo "❌ App ${{ matrix.app }} could not be installed from registry"
            echo "This is expected if the app is not yet published. Continuing with source checkout..."
          fi

      - name: Checkout app source (fallback if not in registry)
        if: env.INSTALLED == 'false' && env.SKIP_REGISTRY != 'true'
        run: |
          cd "$TEST_HOME"
          mkdir -p apps-source
          SKIP_APP_LOCAL=false
          
          case "${{ matrix.app }}" in
            brain)
              git clone --depth 1 https://github.com/EdgeVector/brain.git apps-source/brain
              ;;
            lastsecrets)
              git clone --depth 1 https://github.com/EdgeVector/lastsecrets.git apps-source/lastsecrets
              ;;
            lastseek)
              if [ -n "${{ secrets.APP_REPOS_TOKEN }}" ]; then
                git clone --depth 1 https://x-access-token:${{ secrets.APP_REPOS_TOKEN }}@github.com/EdgeVector/lastseek.git apps-source/lastseek 2>&1 | tee "$PROOF_DIR/lastseek-clone.log" || {
                  echo "❌ lastseek clone failed even with APP_REPOS_TOKEN"
                  SKIP_APP_LOCAL=true
                  echo "SKIP_APP=true" >> "$GITHUB_ENV"
                }
              else
                echo "⚠️  lastseek is private and secrets.APP_REPOS_TOKEN is not configured"
                echo "Configure APP_REPOS_TOKEN secret with a PAT that has access to EdgeVector/lastseek"
                SKIP_APP_LOCAL=true
                echo "SKIP_APP=true" >> "$GITHUB_ENV"
              fi
              ;;
            search)
              git clone --depth 1 https://github.com/EdgeVector/search.git apps-source/search
              ;;
          esac
          
          if [ "$SKIP_APP_LOCAL" != "true" ] && [ -d "apps-source/${{ matrix.app }}" ]; then
            echo "APP_SOURCE=$TEST_HOME/apps-source/${{ matrix.app }}" >> "$GITHUB_ENV"
          fi

      - name: Verify app source available
        if: env.SKIP_APP != 'true' && env.SKIP_REGISTRY != 'true'
        run: |
          # Verify APP_SOURCE was set by either registry install or source checkout
          if [ -z "$APP_SOURCE" ]; then
            echo "❌ FATAL: APP_SOURCE not set - app install and source checkout both failed"
            echo "This job must fail because the app was supposed to be tested but is not available"
            exit 1
          fi
          
          # Verify the source directory exists
          if [ ! -d "$APP_SOURCE" ]; then
            echo "❌ FATAL: APP_SOURCE=$APP_SOURCE does not exist"
            exit 1
          fi
          
          echo "✓ App source available at: $APP_SOURCE"

      # === Brain (HTTP API) ===
      - name: Set up Brain dependencies
        if: matrix.app == 'brain' && env.SKIP_APP != 'true' && env.SKIP_REGISTRY != 'true'
        run: |
          set -o pipefail
          cd "$APP_SOURCE"
          
          # Install Bun
          brew install bun
          
          # Install dependencies
          bun install --frozen-lockfile 2>&1 | tee "$PROOF_DIR/brain-deps-install.log"
          
          # bun link only registers the package name. It does not install the
          # command. Later steps call `brain`, so put bin/brain on PATH.
          chmod +x "$PWD/bin/brain"
          BUN_BIN="${BUN_INSTALL:-$HOME/.bun}/bin"
          mkdir -p "$BUN_BIN"
          ln -sfn "$PWD/bin/brain" "$BUN_BIN/brain"
          if [ ! -x "$BUN_BIN/brain" ]; then
            echo "brain command is not executable at $BUN_BIN/brain"
            exit 1
          fi
          echo "$BUN_BIN" >> "$GITHUB_PATH"
          "$BUN_BIN/brain" --version 2>&1 | tee "$PROOF_DIR/brain-link.log"
        env:
          # Brain reads socket path from this env var
          FBRAIN_FOLDDB_SOCKET: ${{ env.LASTDB_HOME }}/data/folddb.sock

      - name: Initialize Brain schemas
        if: matrix.app == 'brain' && env.SKIP_APP != 'true' && env.SKIP_REGISTRY != 'true'
        run: |
          cd "$APP_SOURCE"
          
          # Sync schemas with LastDB via Unix socket
          brain init 2>&1 | tee "$PROOF_DIR/brain-init.log"
          
          # Schema registration check is optional - just note it in logs
          echo "Brain schemas initialized (check lastdb for details)" | tee "$PROOF_DIR/brain-schemas.txt"
        env:
          # Brain reads socket path from this env var
          FBRAIN_FOLDDB_SOCKET: ${{ env.LASTDB_HOME }}/data/folddb.sock

      - name: Run Brain health checks
        if: matrix.app == 'brain' && env.SKIP_APP != 'true' && env.SKIP_REGISTRY != 'true'
        run: |
          set -o pipefail
          # The socket file can outlive a dead daemon. Fail here with the
          # daemon log instead of a later "socket did not accept" line.
          if ! kill -0 "$LASTDBD_PID" 2>/dev/null; then
            echo "lastdbd pid $LASTDBD_PID is not running"
            tail -n 50 "$PROOF_DIR/lastdbd-startup.log"
            exit 1
          fi

          # Test basic Brain commands
          brain --version 2>&1 | tee "$PROOF_DIR/brain-version.txt"
          
          # List empty brain (should succeed)
          brain list 2>&1 | tee "$PROOF_DIR/brain-list-empty.txt"
          
          # Try creating a test concept. put reads the body from stdin.
          # --content is rejected. The slug is the only positional.
          # The type is --type.
          TEST_ID="test-concept-ci-$$"
          echo "Testing brain write and read operations with ID: $TEST_ID"
          
          printf '%s\n' "Test concept from app-install-smoke CI run ${{ github.run_number }}" | brain put "$TEST_ID" --type concept 2>&1 | tee "$PROOF_DIR/brain-put-test.txt" || {
            echo "Brain put failed"
            cat "$PROOF_DIR/brain-put-test.txt"
            # The start-of-step pid check misses a worker that dies during put.
            # The socket error then hides the stack overflow in the daemon log.
            if ! kill -0 "$LASTDBD_PID" 2>/dev/null; then
              echo "lastdbd pid $LASTDBD_PID died during brain put"
              tail -n 50 "$PROOF_DIR/lastdbd-startup.log"
            fi
            exit 1
          }
          
          # Try reading it back. get takes the slug, then --type.
          brain get "$TEST_ID" --type concept 2>&1 | tee "$PROOF_DIR/brain-get-test.txt" || {
            echo "Brain get failed"
            cat "$PROOF_DIR/brain-get-test.txt"
            exit 1
          }
          
          # Verify content contains our test string
          if grep -q "Test concept from app-install-smoke" "$PROOF_DIR/brain-get-test.txt"; then
            echo "✓ Brain read/write test passed"
          else
            echo "✗ Brain read/write test failed - content mismatch"
            exit 1
          fi
          
          # Check LastDB status after operations
          lastdb --data-dir "$LASTDB_HOME" status | tee "$PROOF_DIR/lastdb-status-after-brain.txt"
        env:
          # Brain reads socket path from this env var
          FBRAIN_FOLDDB_SOCKET: ${{ env.LASTDB_HOME }}/data/folddb.sock

      # === LastSecrets (HTTP API) ===
      - name: Set up LastSecrets dependencies
        if: matrix.app == 'lastsecrets' && env.SKIP_APP != 'true' && env.SKIP_REGISTRY != 'true'
        run: |
          set -o pipefail
          cd "$APP_SOURCE"
          
          # Install Bun
          brew install bun
          
          # Install dependencies
          bun install --frozen-lockfile 2>&1 | tee "$PROOF_DIR/lastsecrets-deps-install.log"
          
          # lastsecrets uses package.json bin pointing to src/cli.ts (not a compiled bin/ file)
          # bun link registers the command based on package.json bin config
          bun link 2>&1 | tee "$PROOF_DIR/lastsecrets-link.log"
          
          # Add Bun's global bin directory to PATH
          BUN_BIN="${BUN_INSTALL:-$HOME/.bun}/bin"
          echo "$BUN_BIN" >> "$GITHUB_PATH"
          
          # Verify the command is available
          "$BUN_BIN/lastsecrets" --version 2>&1 || echo "No version flag"
        env:
          # LastSecrets reads socket path from this env var
          LASTSECRETS_SOCKET_PATH: ${{ env.LASTDB_HOME }}/data/folddb.sock

      - name: Initialize LastSecrets
        if: matrix.app == 'lastsecrets' && env.SKIP_APP != 'true'
        run: |
          cd "$APP_SOURCE"
          
          # Initialize schemas via Unix socket
          lastsecrets init 2>&1 | tee "$PROOF_DIR/lastsecrets-init.log"
          
          # Schema registration check is optional - just note it in logs
          echo "LastSecrets schemas initialized (check lastdb for details)" | tee "$PROOF_DIR/lastsecrets-schemas.txt"
        env:
          # LastSecrets reads socket path from this env var
          LASTSECRETS_SOCKET_PATH: ${{ env.LASTDB_HOME }}/data/folddb.sock

      - name: Run LastSecrets health checks
        if: matrix.app == 'lastsecrets' && env.SKIP_APP != 'true'
        run: |
          set -o pipefail
          # The socket file can outlive a dead daemon. Fail here with the
          # daemon log instead of a later "socket did not accept" line.
          if ! kill -0 "$LASTDBD_PID" 2>/dev/null; then
            echo "lastdbd pid $LASTDBD_PID is not running"
            tail -n 50 "$PROOF_DIR/lastdbd-startup.log"
            exit 1
          fi

          lastsecrets --version 2>&1 | tee "$PROOF_DIR/lastsecrets-version.txt" || echo "No version flag"
          
          # List empty secrets
          lastsecrets list 2>&1 | tee "$PROOF_DIR/lastsecrets-list-empty.txt"
          
          # Store and retrieve a test secret
          TEST_SLUG="test-secret-ci-$$"
          echo "Testing lastsecrets write and read operations with slug: $TEST_SLUG"
          
          printf '%s' "test-value-${{ github.run_number }}" | \
            lastsecrets put "$TEST_SLUG" \
              --label "CI smoke test secret" \
              --provider test \
              --purpose ci-smoke \
              --env test \
              --value-stdin 2>&1 | tee "$PROOF_DIR/lastsecrets-put-test.txt" || {
            echo "LastSecrets put failed"
            cat "$PROOF_DIR/lastsecrets-put-test.txt"
            if ! kill -0 "$LASTDBD_PID" 2>/dev/null; then
              echo "lastdbd pid $LASTDBD_PID died during lastsecrets put"
              tail -n 50 "$PROOF_DIR/lastdbd-startup.log"
            fi
            exit 1
          }
          
          # Retrieve it
          lastsecrets get "$TEST_SLUG" 2>&1 | tee "$PROOF_DIR/lastsecrets-get-test.txt" || {
            echo "LastSecrets get failed"
            cat "$PROOF_DIR/lastsecrets-get-test.txt"
            exit 1
          }
          
          # Verify
          if grep -q "test-value-${{ github.run_number }}" "$PROOF_DIR/lastsecrets-get-test.txt"; then
            echo "✓ LastSecrets read/write test passed"
          else
            echo "✗ LastSecrets read/write test failed - value mismatch"
            exit 1
          fi
          
          # Check LastDB status after operations
          lastdb --data-dir "$LASTDB_HOME" status | tee "$PROOF_DIR/lastdb-status-after-lastsecrets.txt"
        env:
          # LastSecrets reads socket path from this env var
          LASTSECRETS_SOCKET_PATH: ${{ env.LASTDB_HOME }}/data/folddb.sock

      # === lastseek (Outbox) ===
      - name: Set up lastseek dependencies
        if: matrix.app == 'lastseek' && env.SKIP_APP != 'true' && env.SKIP_REGISTRY != 'true'
        run: |
          cd "$APP_SOURCE"
          
          # Build Rust binary
          cargo build --locked --release 2>&1 | tee "$PROOF_DIR/lastseek-build.log"
          
          # Install binary
          cp target/release/lastseek "$HOME/.cargo/bin/" || cp target/release/lastseek /usr/local/bin/

      - name: Initialize lastseek and seed outbox
        if: matrix.app == 'lastseek' && env.SKIP_APP != 'true'
        run: |
          # Create inbox directory
          mkdir -p "$LASTDB_HOME/apps/search/inbox"
          
          # Generate test IndexChangeBatch file
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat > "$LASTDB_HOME/apps/search/inbox/test-batch-001.json" <<EOF
          {
            "format_version": 1,
            "schema_name": "brain/Concept",
            "searchable_fields": ["title", "content"],
            "changes": [
              {
                "mutation_id": "test-mutation-${{ github.run_number }}",
                "kind": "upsert",
                "key_value": {
                  "hash": null,
                  "range": "test-concept-001"
                },
                "fields_and_values": {
                  "id": "test-concept-001",
                  "title": "Test Concept",
                  "content": "Smoke test for lastseek outbox consumption"
                }
              }
            ]
          }
          EOF
          
          lastseek --version 2>&1 | tee "$PROOF_DIR/lastseek-version.txt"

      - name: Run lastseek health checks
        if: matrix.app == 'lastseek' && env.SKIP_APP != 'true'
        run: |
          # Test consuming the inbox (without --consume to preserve the file)
          lastseek ingest --inbox "$LASTDB_HOME/apps/search/inbox" 2>&1 | tee "$PROOF_DIR/lastseek-ingest-test.txt"
          
          if [ $? -eq 0 ]; then
            echo "✓ lastseek outbox format test passed"
          else
            echo "✗ lastseek outbox format test failed"
            exit 1
          fi

      # === Search (Outbox) ===
      - name: Set up Search dependencies
        if: matrix.app == 'search' && env.SKIP_APP != 'true' && env.SKIP_REGISTRY != 'true'
        run: |
          cd "$APP_SOURCE"
          
          # Install Bun
          brew install bun
          
          # Add Bun's global bin directory to PATH
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          
          # Install dependencies
          bun install --frozen-lockfile 2>&1 | tee "$PROOF_DIR/search-deps-install.log"
          
          # Link command globally so 'search' is on PATH
          bun link 2>&1 | tee "$PROOF_DIR/search-link.log"

      - name: Initialize Search and seed outbox
        if: matrix.app == 'search' && env.SKIP_APP != 'true'
        run: |
          cd "$APP_SOURCE"
          
          # Create inbox directory
          mkdir -p "$LASTDB_HOME/apps/search/inbox"
          
          # Generate test IndexChangeBatch file for search
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat > "$LASTDB_HOME/apps/search/inbox/test-search-batch-001.json" <<EOF
          {
            "format_version": 1,
            "schema_name": "brain/Concept",
            "searchable_fields": ["title", "content"],
            "changes": [
              {
                "mutation_id": "test-search-mutation-${{ github.run_number }}",
                "kind": "upsert",
                "key_value": {
                  "hash": null,
                  "range": "test-search-concept-001"
                },
                "fields_and_values": {
                  "id": "test-search-concept-001",
                  "title": "Search Test Concept",
                  "content": "Semantic search smoke test content"
                }
              }
            ]
          }
          EOF
          
          # Initialize search (processes pending inbox)
          search init 2>&1 | tee "$PROOF_DIR/search-init.log"
          
          # Check version
          search --version 2>&1 | tee "$PROOF_DIR/search-version.txt" || echo "No version flag"

      - name: Run Search health checks
        if: matrix.app == 'search' && env.SKIP_APP != 'true'
        run: |
          cd "$APP_SOURCE"
          
          # Test draining the inbox
          search drain 2>&1 | tee "$PROOF_DIR/search-drain-test.txt"
          
          # Test status
          search status 2>&1 | tee "$PROOF_DIR/search-status.txt" || true
          
          # Verify drain succeeded
          if grep -qE "(drained|processed|indexed)" "$PROOF_DIR/search-drain-test.txt" || [ $? -eq 0 ]; then
            echo "✓ Search outbox format test passed"
          else
            echo "⚠️  Search drain completed (verify output manually)"
          fi

      - name: Final health check
        if: env.SKIP_APP != 'true'
        run: |
          # Check LastDB status after all operations
          lastdb --data-dir "$LASTDB_HOME" status | tee "$PROOF_DIR/lastdb-status-final.txt"

      - name: Validate health checks ran
        if: always()
        run: |
          # Verify that health checks actually executed for this app (unless intentionally skipped)
          if [ "$SKIP_APP" = "true" ]; then
            echo "✓ App intentionally skipped (likely due to access restrictions)"
            echo "HEALTH_CHECKS_STATUS=skipped-intentional" >> "$GITHUB_ENV"
          else
            # Check that app-specific health check files exist
            HEALTH_CHECK_PASSED=false
            
            case "${{ matrix.app }}" in
              brain)
                if [ -f "$PROOF_DIR/brain-get-test.txt" ] && grep -q "Test concept from app-install-smoke" "$PROOF_DIR/brain-get-test.txt"; then
                  HEALTH_CHECK_PASSED=true
                fi
                ;;
              lastsecrets)
                if [ -f "$PROOF_DIR/lastsecrets-get-test.txt" ] && grep -q "test-value-" "$PROOF_DIR/lastsecrets-get-test.txt"; then
                  HEALTH_CHECK_PASSED=true
                fi
                ;;
              lastseek)
                if [ -f "$PROOF_DIR/lastseek-ingest-test.txt" ]; then
                  HEALTH_CHECK_PASSED=true
                fi
                ;;
              search)
                if [ -f "$PROOF_DIR/search-drain-test.txt" ]; then
                  HEALTH_CHECK_PASSED=true
                fi
                ;;
            esac
            
            if [ "$HEALTH_CHECK_PASSED" = "true" ]; then
              echo "✓ Health checks executed and passed for ${{ matrix.app }}"
              echo "HEALTH_CHECKS_STATUS=passed" >> "$GITHUB_ENV"
            else
              echo "❌ FATAL: Health checks did not execute for ${{ matrix.app }}"
              echo "This indicates a workflow logic error - health check steps were skipped when they should have run"
              echo "HEALTH_CHECKS_STATUS=failed" >> "$GITHUB_ENV"
              exit 1
            fi
          fi

      - name: Collect proof summary
        if: always()
        run: |
          cd "$PROOF_DIR"
          
          # Get LastDB build info
          LASTDB_VERSION=$(cat lastdb-version.txt 2>/dev/null || echo "unknown")
          
          # Get app resolution
          APP_SHA=$(cat ${{ matrix.app }}-resolve.json 2>/dev/null | grep -o '"sha":"[^"]*"' | head -1 | cut -d'"' -f4 || echo "unknown")
          APP_VERSION=$(cat ${{ matrix.app }}-resolve.json 2>/dev/null | grep -o '"app_version":"[^"]*"' | head -1 | cut -d'"' -f4 || echo "unknown")
          
          # Create summary
          cat > smoke-summary.txt <<EOF
          LastDB App Install Smoke Test
          ==============================
          Date: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          App: ${{ matrix.app }}
          Runner: macos-14 (Apple Silicon)
          CI Run: ${{ github.run_number }}
          
          LastDB Build:
          $LASTDB_VERSION

          Proved row:
          ${PROVED_BUILD:-unknown}
          
          App Resolution:
          - Version: $APP_VERSION
          - SHA: $APP_SHA
          
          Install Receipt:
          $(cat ${{ matrix.app }}-install-receipt.json 2>/dev/null | head -20 || echo "N/A")
          
          Health Check Results:
          EOF
          
          
          if [ "$SKIP_APP" = "true" ]; then
            cat >> smoke-summary.txt <<EOF
          - Intentionally skipped (repository not accessible, requires APP_REPOS_TOKEN)
          EOF
          elif [ "${{ matrix.app }}" = "brain" ]; then
            cat >> smoke-summary.txt <<EOF
          - Brain version: $(cat brain-version.txt 2>/dev/null || echo "FAILED")
          - Brain list: $(test -f brain-list-empty.txt && echo "OK" || echo "FAILED")
          - Write test: $(grep -q "test-concept" brain-put-test.txt 2>/dev/null && echo "OK" || echo "FAILED")
          - Read test: $(grep -q "Test concept from app-install-smoke" brain-get-test.txt 2>/dev/null && echo "OK" || echo "FAILED")
          EOF
          elif [ "${{ matrix.app }}" = "lastsecrets" ]; then
            cat >> smoke-summary.txt <<EOF
          - LastSecrets init: $(test -f lastsecrets-init.log && echo "OK" || echo "FAILED")
          - Write test: $(test -f lastsecrets-put-test.txt && echo "OK" || echo "FAILED")
          - Read test: $(grep -q "test-value-${{ github.run_number }}" lastsecrets-get-test.txt 2>/dev/null && echo "OK" || echo "FAILED")
          EOF
          elif [ "${{ matrix.app }}" = "lastseek" ]; then
            cat >> smoke-summary.txt <<EOF
          - lastseek build: $(test -f lastseek-build.log && echo "OK" || echo "FAILED")
          - Ingest test: $(grep -qE "(processed|consumed)" lastseek-ingest-test.txt 2>/dev/null && echo "OK" || echo "UNKNOWN")
          EOF
          elif [ "${{ matrix.app }}" = "search" ]; then
            cat >> smoke-summary.txt <<EOF
          - Search init: $(test -f search-init.log && echo "OK" || echo "FAILED")
          - Drain test: $(test -f search-drain-test.txt && echo "OK" || echo "FAILED")
          EOF
          fi
          
          echo "" >> smoke-summary.txt
          cat smoke-summary.txt

      - name: Upload proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-install-smoke-${{ matrix.app }}-${{ github.run_number }}
          path: ${{ env.PROOF_DIR }}
          if-no-files-found: error

      - name: Add summary to job output
        if: always()
        run: |
          echo "## App Install Smoke: ${{ matrix.app }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Show health check status prominently
          if [ "${SKIP_REGISTRY:-false}" = "true" ]; then
            echo "⚠️  **SKIPPED** - ${{ matrix.app }} is not yet published in registry" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "This app will be tested automatically once it is published to the next or stable registry." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          elif [ "$HEALTH_CHECKS_STATUS" = "skipped-intentional" ]; then
            echo "⚠️  **INTENTIONALLY SKIPPED** - Repository not accessible (requires APP_REPOS_TOKEN)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          elif [ "$HEALTH_CHECKS_STATUS" = "passed" ]; then
            echo "✅ **HEALTH CHECKS PASSED**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat "$PROOF_DIR/smoke-summary.txt" >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "Summary not available" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Cleanup
        if: always()
        run: |
          # Stop LastDB
          if [ -n "$LASTDBD_PID" ]; then
            kill "$LASTDBD_PID" 2>/dev/null || true
            sleep 2
            kill -9 "$LASTDBD_PID" 2>/dev/null || true
          fi
          
          # Remove test home (proof saved via artifact)
          rm -rf "$TEST_HOME"

  smoke-report:
    name: smoke-report
    if: ${{ always() }}
    needs: [app-install-smoke]
    runs-on: ubuntu-24.04
    steps:
      - name: Report smoke test results
        run: |
          echo "app-install-smoke=${{ needs.app-install-smoke.result }}"
          
          # Report status
          if [ "${{ needs.app-install-smoke.result }}" = "success" ]; then
            echo "✓ All app smoke tests passed"
          else
            echo "⚠️  Some app smoke tests failed or were skipped - review artifacts and job summaries"
            echo ""
            echo "Expected issues:"
            echo "- lastseek: Repository not accessible (private, requires EdgeVector org access)"
            echo "- Apps may not be in registry yet (will use source fallback)"
          fi
          
          # This is a canary job - report status but never block
          exit 0
