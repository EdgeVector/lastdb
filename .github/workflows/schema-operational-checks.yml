name: Canonical schema operational checks

# Tom requested these isolated node, S3, model, recovery and migration checks.
# Only accepted main receives a dedicated disposable-bucket AWS role.
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      protein_baseline:
        description: Optional exact baseline revision for the generated-home field protein upgrade
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: schema-operations-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: '2'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_TERM_COLOR: never

jobs:
  node:
    name: Real-node canonical lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Prepare external evidence directory
        run: mkdir -p "$RUNNER_TEMP/schema-evidence/node"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: schema-node-operations-debug
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build an optional exact protein baseline in CI
        if: github.event_name == 'workflow_dispatch' && inputs.protein_baseline != ''
        env:
          PROTEIN_BASELINE: ${{ inputs.protein_baseline }}
        run: |
          set -euo pipefail
          [[ "$PROTEIN_BASELINE" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "$PROTEIN_BASELINE"
          git worktree add --detach "$RUNNER_TEMP/protein-baseline-src" "$PROTEIN_BASELINE"
          (cd "$RUNNER_TEMP/protein-baseline-src" && \
            CARGO_TARGET_DIR="$RUNNER_TEMP/protein-baseline-target" FOLDDB_BUILD_VERSION_OVERRIDE="bench-$PROTEIN_BASELINE" \
            cargo build --locked -p lastdb_node --bin lastdbd)
          cp "$RUNNER_TEMP/protein-baseline-target/debug/lastdbd" "$RUNNER_TEMP/protein-baseline-lastdbd"
          git worktree remove "$RUNNER_TEMP/protein-baseline-src"
      - name: Build the exact daemon in CI
        env:
          FOLDDB_BUILD_VERSION_OVERRIDE: bench-${{ github.sha }}
        run: cargo build --locked -p lastdb_node --bin lastdbd
      - name: Run fresh-home cases with external network access disabled
        shell: bash
        run: |
          set -euo pipefail
          SCHEMA_CHECK_UID="$(id -u)"
          SCHEMA_CHECK_GID="$(id -g)"
          export SCHEMA_CHECK_UID SCHEMA_CHECK_GID
          sudo --preserve-env=HOME,RUNNER_TEMP,GITHUB_SHA,GITHUB_ACTIONS,RUNNER_ENVIRONMENT,GITHUB_STEP_SUMMARY,SCHEMA_CHECK_UID,SCHEMA_CHECK_GID \
            unshare --net -- sh -eu -c '
              ip link set lo up
              exec setpriv --reuid "$SCHEMA_CHECK_UID" --regid "$SCHEMA_CHECK_GID" --init-groups \
                python3 scripts/schema_checks/node_check.py --candidate "$1" \
                --candidate-revision "$GITHUB_SHA" --output "$RUNNER_TEMP/schema-evidence/node/results"
            ' sh "$PWD/target/debug/lastdbd" \
            2>&1 | tee "$RUNNER_TEMP/schema-evidence/node/run.log"
      - name: Upgrade only the run-owned generated database
        if: github.event_name == 'workflow_dispatch' && inputs.protein_baseline != ''
        env:
          PROTEIN_BASELINE: ${{ inputs.protein_baseline }}
        run: |
          set -euo pipefail
          SCHEMA_CHECK_UID="$(id -u)"
          SCHEMA_CHECK_GID="$(id -g)"
          export SCHEMA_CHECK_UID SCHEMA_CHECK_GID
          sudo --preserve-env=HOME,RUNNER_TEMP,GITHUB_SHA,GITHUB_ACTIONS,RUNNER_ENVIRONMENT,SCHEMA_CHECK_UID,SCHEMA_CHECK_GID,PROTEIN_BASELINE \
            unshare --net -- sh -eu -c '
              ip link set lo up
              exec setpriv --reuid "$SCHEMA_CHECK_UID" --regid "$SCHEMA_CHECK_GID" --init-groups \
                python3 scripts/schema_checks/protein_upgrade.py --candidate "$1" \
                --candidate-revision "$GITHUB_SHA" --baseline "$RUNNER_TEMP/protein-baseline-lastdbd" \
                --baseline-revision "$PROTEIN_BASELINE" --output "$RUNNER_TEMP/schema-evidence/node/upgrade"
            ' sh "$PWD/target/debug/lastdbd" \
            2>&1 | tee "$RUNNER_TEMP/schema-evidence/node/upgrade.log"
      - name: Index evidence
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: python3 scripts/schema_checks/evidence.py --stage index --label node --directory "$RUNNER_TEMP/schema-evidence/node"
      - uses: actions/upload-artifact@v4
        id: evidence
        if: always()
        with:
          name: schema-node-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/schema-evidence/node
          retention-days: 7
          if-no-files-found: error
      - name: Publish evidence links
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact-digest }}
        run: python3 scripts/schema_checks/evidence.py --stage summary --label node --directory "$RUNNER_TEMP/schema-evidence/node"

  semantics:
    name: Actual semantic model
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Prepare external evidence directory
        run: mkdir -p "$RUNNER_TEMP/schema-evidence/model"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: schema-real-semantic-model
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run the actual product model and bundled adapter
        env:
          FASTEMBED_CACHE_DIR: ${{ runner.temp }}/schema-model-cache
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          cargo run --locked -p schema_service_server_shared --features fastembed \
            --example canonical_semantics -- "$RUNNER_TEMP/schema-evidence/model/results" \
            2>&1 | tee "$RUNNER_TEMP/schema-evidence/model/run.log"
      - name: Index evidence
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: python3 scripts/schema_checks/evidence.py --stage index --label model --directory "$RUNNER_TEMP/schema-evidence/model"
      - uses: actions/upload-artifact@v4
        id: evidence
        if: always()
        with:
          name: schema-model-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/schema-evidence/model
          retention-days: 7
          if-no-files-found: error
      - name: Publish evidence links
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact-digest }}
        run: python3 scripts/schema_checks/evidence.py --stage summary --label model --directory "$RUNNER_TEMP/schema-evidence/model"

  s3-protocol:
    name: S3 adapter protocol and commit faults
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Prepare external evidence directory
        run: mkdir -p "$RUNNER_TEMP/schema-evidence/s3-protocol"
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.8'
          cache: false
      - name: Build pinned upstream MinIO in CI
        env:
          GOBIN: ${{ runner.temp }}/schema-minio-bin
        run: go install github.com/minio/minio@9e49d5e7a648f00e26f2246f4dc28e6b07f8c84a
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: schema-s3-operations
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Compile the explicit S3 target in CI
        run: |
          set -euo pipefail
          cargo test --locked -p schema_service_s3 --test s3_canonical_properties \
            --no-run --message-format=json > "$RUNNER_TEMP/schema-s3-build.json"
          python3 -c 'import json,os,sys; rows=[json.loads(line) for line in open(sys.argv[1])]; paths=[row["executable"] for row in rows if row.get("reason")=="compiler-artifact" and row.get("target",{}).get("name")=="s3_canonical_properties" and row.get("executable")]; assert len(paths)==1; open(os.environ["GITHUB_ENV"],"a").write("SCHEMA_S3_TEST_BINARY="+paths[0]+"\n")' "$RUNNER_TEMP/schema-s3-build.json"
      - name: Run isolated S3 protocol and fault cases
        shell: bash
        run: |
          set -euo pipefail
          SCHEMA_CHECK_UID="$(id -u)"
          SCHEMA_CHECK_GID="$(id -g)"
          export SCHEMA_CHECK_UID SCHEMA_CHECK_GID
          sudo --preserve-env=HOME,PATH,RUNNER_TEMP,GITHUB_SHA,GITHUB_ACTIONS,SCHEMA_S3_TEST_BINARY,SCHEMA_CHECK_UID,SCHEMA_CHECK_GID \
            unshare --net -- sh -eu -c '
              ip link set lo up
              exec setpriv --reuid "$SCHEMA_CHECK_UID" --regid "$SCHEMA_CHECK_GID" --init-groups \
                python3 scripts/schema_checks/s3_protocol.py --minio "$RUNNER_TEMP/schema-minio-bin/minio" \
                --test-binary "$SCHEMA_S3_TEST_BINARY" \
                --output "$RUNNER_TEMP/schema-evidence/s3-protocol/results"
            ' 2>&1 | tee "$RUNNER_TEMP/schema-evidence/s3-protocol/protocol.log"
      - name: Index evidence
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: python3 scripts/schema_checks/evidence.py --stage index --label s3-protocol --directory "$RUNNER_TEMP/schema-evidence/s3-protocol"
      - uses: actions/upload-artifact@v4
        id: evidence
        if: always()
        with:
          name: schema-s3-protocol-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/schema-evidence/s3-protocol
          retention-days: 7
          if-no-files-found: error
      - name: Publish evidence links
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact-digest }}
        run: python3 scripts/schema_checks/evidence.py --stage summary --label s3-protocol --directory "$RUNNER_TEMP/schema-evidence/s3-protocol"

  s3-aws:
    name: Actual AWS S3 isolated bucket
    if: github.repository == 'EdgeVector/lastdb' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Prepare external evidence directory
        run: mkdir -p "$RUNNER_TEMP/schema-evidence/s3-aws"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: schema-s3-operations
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Compile the explicit S3 target before credentials exist
        run: cargo test --locked -p schema_service_s3 --test s3_canonical_properties --no-run
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::152335099025:role/lastdb-schema-checks-ci
          role-session-name: schema-check-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: us-west-2
          role-duration-seconds: 1800
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":"s3:*","Resource":["arn:aws:s3:::lastdb-schema-ci-152335099025-${{ github.run_id }}-${{ github.run_attempt }}","arn:aws:s3:::lastdb-schema-ci-152335099025-${{ github.run_id }}-${{ github.run_attempt }}/*"]}]}
      - name: Create one fresh owned check bucket
        run: python3 scripts/schema_checks/aws_bucket.py create --output "$RUNNER_TEMP/schema-evidence/s3-aws"
      - name: Run actual AWS conditional writes and service races
        env:
          SCHEMA_S3_TEST_MODE: isolated-aws-bucket
          SCHEMA_S3_TEST_EXPECTED_ACCOUNT: '152335099025'
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          set -euo pipefail
          cargo test --offline --locked -p schema_service_s3 --test s3_canonical_properties \
            aws_ -- --test-threads=1 --nocapture 2>&1 | tee "$RUNNER_TEMP/schema-evidence/s3-aws/aws.log"
      - name: Remove only this run's owned bucket
        if: always()
        run: python3 scripts/schema_checks/aws_bucket.py cleanup --output "$RUNNER_TEMP/schema-evidence/s3-aws"
      - name: Index evidence
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: python3 scripts/schema_checks/evidence.py --stage index --label s3-aws --directory "$RUNNER_TEMP/schema-evidence/s3-aws"
      - uses: actions/upload-artifact@v4
        id: evidence
        if: always()
        with:
          name: schema-s3-aws-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/schema-evidence/s3-aws
          retention-days: 7
          if-no-files-found: error
      - name: Publish evidence links
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact-digest }}
        run: python3 scripts/schema_checks/evidence.py --stage summary --label s3-aws --directory "$RUNNER_TEMP/schema-evidence/s3-aws"
