name: Signed history DEV proofs

# Phase 1 AcceptEntry proofs against the in-repo grant-blind reference_relay.
# No AWS/IAM/secrets. CI may cargo build; agents must not build on Tom's machine.
#
# Job `relay_e2e` builds `signed_history_relay_e2e` (release) and runs it against
# a spawned reference_relay: signed append/read, grant + revoke (403), never-granted
# append/read (403), ~300 MiB of
# signed bundles, and a discovering restore into FoldDB. Both phases must finish
# under 60 s. Job `log_sync_relay_timeout` proves the node RelayClient's ~30s
# request timeout against a hung TCP peer. Job `relay_e2e` then runs the same binary against the Exemem DEV relay,
# with the same scope and the same relay URL as job `deployed_relay` (below): output `deployed` of job `scope`, and
# the `exemem_relay_url` input, else the variable EXEMEM_RELAY_URL, else environments.dev.exemem_api. No credentials.
# Both runs set LASTDB_RELAY_E2E_STREAMS=true (proves log/streams). The Exemem run then deletes the blobs it uploaded
# (about 315 MB of bundles) with blob/drop, also after a failed step, and reads back that they are gone (blob/list empty,
# blob/get 404, presigned object GET refused); the job summary prints the result, and a failed cleanup fails the step. Its log entries
# (a few KB) stay: no relay route deletes birth, grant or bundle entries. The reference_relay runs set
# LASTDB_RELAY_E2E_CLEANUP=false: that relay refuses blob/drop on a database with grants, and its data dir is temporary.
# Job `deployed_relay` runs the personal database proof (`personal_database_proof.py --relay-url`) against the
# Exemem DEV relay. Each run
# makes a fresh identity (a new seed, offline), so it writes to a personal database of its own. The relay bills the
# account that the signing node key derives: no account, API key or secret is used. It runs on pushes to main, on the
# daily run (cloud-backup-daily.yml) and on dispatch, and on a pull request only when the PR changes a file of the
# proof, its nodes, the log sync, replay and spool code that the personal sync uses, the relays or this workflow
# (job `scope`, output `deployed`; a docs-only pull request does not run it). The relay URL is the
# `exemem_relay_url` input, else the variable EXEMEM_RELAY_URL, else environments.dev.exemem_api. After each
# snapshot the node drops what the relay no longer needs (`log/trim`, `blob/drop`), so a run leaves its newest
# snapshot, the entries after it and the files they name on the relay: the job summary says how much.
# Job `upgrade` takes the newest published nightly build that is not the commit under test, makes a connected home with it
# (records, a snapshot, a tail), and continues that same home on the build under test (`upgrade_proof.py`).
# Job `blob_stream` puts and gets a 512 MiB generated file through a reference_relay
# process, compares digests, and fails if that process's peak memory (VmHWM) is over 128 MiB.
#
# exemem-infra deploy.yml (prove_dev_relay.py, LASTDB_RELAY_E2E_BIN): check out
# EdgeVector/lastdb at the Phase 2 SHA, run
#   cargo build --locked -p signed_history_relay_e2e --bin signed_history_relay_e2e --release
# (or download the `signed-history-relay-e2e-bin-<sha>` artifact this job uploads),
# then export LASTDB_RELAY_E2E_BIN=$PWD/target/release/signed_history_relay_e2e and
# RELAY_URL=<relay origin>. Its last stdout line is JSON with upload_seconds and
# restore_seconds (see signed_history_relay_e2e/README.md).
#
# Job `signed-history-proofs-complete` is the merge gate (ruleset `signed-history-proofs-required` on main). It
# reports on every pull request: it passes when every proof in scope passed, and when the pull request changes no
# file of the proofs (then no proof runs). The files in scope are one list, in job `scope`. The workflow has no
# `paths` filter because a required check that never reports blocks the pull request for good.
on:
  pull_request:
  push:
    # A branch push is covered by its pull request: one run for a commit, and one gate result.
    branches: [main]
  workflow_dispatch:
    inputs:
      exemem_relay_url:
        description: "Also run signed_history_relay_e2e against this relay origin (no credentials)"
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      exemem_relay_url:
        description: "Also run signed_history_relay_e2e against this relay origin (no credentials)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  # A pull request supersedes its own older run. No other run is cancelled: every push to main starts this
  # workflow, and a push that changes no proof file must not stop the proofs of the commit before it.
  group: signed-history-dev-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: scope of the proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.scope.outputs.run }}
      deployed: ${{ steps.scope.outputs.deployed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: A pull request and a push to main run the proofs only for their own files
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # The files the proofs depend on. This is the only list.
          proofs='^(mutation_log/|relay_protocol/|reference_relay/|signed_history_dev/|signed_history_client/|signed_history_materialize/|signed_history_relay_e2e/|app_identity_crypto/|cloud_backup_protocol/|scripts/signed_history/|scripts/operations/personal_[^/]*$|scripts/operations/(shared_database_proof|lease_proof|lease_change_proof|personal_database_proof|personal_proof_[^/]*|existing_home_proof|upgrade_proof|record_runs|record_ops)\.py$|scripts/(harness|v1_records)\.py$|scripts/benchmarks/node\.py$|fold_db/crates/model/|fold_db/crates/core/src/(fold_db_core/mutation_manager|storage/disk_pack|storage/disk_backup|storage/format/metadata)/|fold_db/crates/core/src/(db_operations/schema_store|storage/local_file_ref)(\.rs$|/)|fold_db/crates/core/src/crypto\.rs$|lastdb_node/environments\.json$|lastdb_node/src/log_sync/|lastdb_node/src/registered_share/|lastdb_node/src/(personal_author|personal_seal|shared_seal|personal_identity|database_birth|author_identity|device_identity)\.rs$|lastdb_node/src/(cloud|host|profile)(\.rs$|/)|lastdb_node/src/exec/app_api/(change|write|write_file|write_signed|database|databases|databases_chain)(\.rs$|/)|lastdb_node/src/exec/database_(received|routes|share|owned)\.rs$|lastdb_node/src/bin/lastdb/(admin_cmds|cli_defs|cloud_cmds|snapshot_line|usage_line|share_cmds)(\.rs$|/)|lastdb_node/src/bin/log_sync_relay_timeout_probe\.rs$|lastdb_node/src/exec/admin_routes\.rs$|\.github/workflows/signed-history-dev\.yml$)'
          # The personal sync: its proofs, the log sync, the replay and spool code it imports, both relays.
          own='^(scripts/operations/personal_[^/]*|scripts/operations/record_(runs|ops)\.py|scripts/(harness|v1_records)\.py|scripts/benchmarks/node\.py|lastdb_node/environments\.json|lastdb_node/src/log_sync/.*|lastdb_node/src/registered_share/.*|lastdb_node/src/(personal_author|personal_seal|shared_seal|personal_identity|database_birth|author_identity|device_identity)\.rs|lastdb_node/src/(cloud|host|profile)(\.rs|/.*)|lastdb_node/src/exec/app_api/(change|write|write_file|write_signed|database|databases|databases_chain)(\.rs|/.*)|lastdb_node/src/exec/database_(received|routes|share|owned)\.rs|lastdb_node/src/bin/lastdb/(admin_cmds|cli_defs|cloud_cmds|snapshot_line|usage_line|share_cmds)(\.rs|/.*)|lastdb_node/src/exec/admin_routes\.rs|mutation_log/.*|relay_protocol/.*|reference_relay/.*|signed_history_relay_e2e/.*|app_identity_crypto/.*|cloud_backup_protocol/.*|fold_db/crates/model/.*|fold_db/crates/core/src/(fold_db_core/mutation_manager|storage/disk_pack|storage/disk_backup|storage/format/metadata)/.*|fold_db/crates/core/src/(db_operations/schema_store|storage/local_file_ref)(\.rs|/.*)|fold_db/crates/core/src/crypto\.rs|\.github/workflows/signed-history-dev\.yml)$'
          # Dispatch, the daily call and anything else run every proof.
          run=true
          deployed=true
          base=""
          if [[ "$EVENT" == pull_request ]]; then
            # The checkout is the merge of the pull request into main: its first parent is main.
            base="$(git rev-parse --verify --quiet 'HEAD^1' || true)"
          elif [[ "$EVENT" == push ]]; then
            base="$BEFORE"
          fi
          if [[ "$EVENT" == pull_request || "$EVENT" == push ]]; then
            # With no usable base the change is unknown, so every proof runs.
            if [[ -n "$base" ]] && git cat-file -e "${base}^{commit}" 2>/dev/null; then
              changed="$(git diff --name-only "$base" HEAD)"
              if ! grep -Eq "$proofs" <<< "$changed"; then
                run=false
              fi
              if [[ "$EVENT" == pull_request ]] && ! grep -Eq "$own" <<< "$changed"; then
                deployed=false
              fi
            fi
          fi
          if [[ "$run" == false ]]; then
            deployed=false
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "deployed=$deployed" >> "$GITHUB_OUTPUT"
          echo "proofs run: $run; deployed relay proof runs: $deployed (event $EVENT)" >> "$GITHUB_STEP_SUMMARY"

  proofs:
    name: reference_relay scenarios
    needs: scope
    if: ${{ needs.scope.outputs.run == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: signed-history-dev-folddb
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build reference_relay and signed_history_dev
        run: |
          set -euo pipefail
          cargo build --locked -p reference_relay --bin reference_relay
          cargo build --locked -p signed_history_dev --bin signed_history_dev
      - name: Run Phase 1 scenarios
        run: |
          set -euo pipefail
          WORK="${RUNNER_TEMP}/signed-history-dev"
          mkdir -p "$WORK"
          ./target/debug/signed_history_dev \
            --relay-bin "$PWD/target/debug/reference_relay" \
            --work-dir "$WORK" \
            --json-out "$WORK/summary.json" \
            --blob-bytes $((300 * 1024 * 1024)) \
            | tee "$WORK/stdout.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: signed-history-dev-${{ github.sha }}
          path: |
            ${{ runner.temp }}/signed-history-dev/summary.json
            ${{ runner.temp }}/signed-history-dev/stdout.log
          retention-days: 7
          if-no-files-found: warn
      - name: Publish summary
        if: always()
        run: |
          {
            echo "## Signed history DEV proofs"
            echo "Source: $GITHUB_SHA"
            echo "Grant-gating reference_relay only. No AWS/IAM/secrets."
            echo "Scenarios: forge_reject, revoke_cutoff, converge, restore_replay, nongrantee_reject, blob_perf."
            echo "converge and restore_replay also check real FoldDB records after replay."
            if [[ -f "${RUNNER_TEMP}/signed-history-dev/summary.json" ]]; then
              echo
              echo '```json'
              cat "${RUNNER_TEMP}/signed-history-dev/summary.json"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  relay_e2e:
    name: relay e2e (reference_relay, Exemem DEV relay)
    needs: scope
    if: ${{ needs.scope.outputs.run == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CARGO_BUILD_JOBS: "2"
      EXEMEM_RELAY_INPUT: ${{ inputs.exemem_relay_url || vars.EXEMEM_RELAY_URL }}
      DEPLOYED: ${{ needs.scope.outputs.deployed }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: signed-history-relay-e2e-release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build reference_relay and signed_history_relay_e2e (release)
        run: |
          set -euo pipefail
          cargo build --locked -p reference_relay --bin reference_relay --release
          cargo build --locked -p signed_history_relay_e2e --bin signed_history_relay_e2e --release
      - name: Run signed_history_relay_e2e against reference_relay
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/relay-e2e"
          mkdir -p "$OUT"
          ./target/release/reference_relay --listen 127.0.0.1:0 --data-dir "$OUT/relay-data" \
            > "$OUT/relay.addr" 2> "$OUT/relay.stderr" &
          RELAY_PID=$!
          trap 'kill "$RELAY_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 100); do
            [[ -s "$OUT/relay.addr" ]] && break
            sleep 0.1
          done
          ADDR="$(head -n1 "$OUT/relay.addr")"
          [[ -n "$ADDR" ]] || { echo "reference_relay printed no address" >&2; exit 1; }
          export LASTDB_RELAY_E2E_BIN="$PWD/target/release/signed_history_relay_e2e"
          export RELAY_URL="http://${ADDR}"
          export LASTDB_RELAY_E2E_STREAMS=true
          export LASTDB_RELAY_E2E_CLEANUP=false
          "$LASTDB_RELAY_E2E_BIN" | tee "$OUT/reference.stdout"
          python3 scripts/signed_history/check_relay_e2e.py "$OUT/reference.stdout" reference_relay --expect-streams
          python3 scripts/signed_history/check_relay_process.py --stderr "$OUT/relay.stderr" \
            --expect-line 'route=log/streams status=200$' \
            --expect-line 'route=log/streams status=403$' \
            --expect-line 'route=log/read status=200 entries=[0-9]+$'
      - name: Run signed_history_relay_e2e against the Exemem DEV relay
        if: ${{ needs.scope.outputs.deployed == 'true' }}
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/relay-e2e"
          mkdir -p "$OUT"
          url="${EXEMEM_RELAY_INPUT:-}"
          if [[ -z "$url" ]]; then
            url="$(jq -er '.environments.dev.exemem_api' lastdb_node/environments.json)"
          fi
          echo "EXEMEM_RELAY_URL=${url%/}" >> "$GITHUB_ENV"
          export LASTDB_RELAY_E2E_BIN="$PWD/target/release/signed_history_relay_e2e"
          export RELAY_URL="${url%/}"
          export LASTDB_RELAY_E2E_STREAMS=true
          "$LASTDB_RELAY_E2E_BIN" | tee "$OUT/exemem.stdout"
          python3 scripts/signed_history/check_relay_e2e.py "$OUT/exemem.stdout" exemem --expect-streams \
            --expect-cleanup
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: signed-history-relay-e2e-${{ github.sha }}
          path: |
            ${{ runner.temp }}/relay-e2e/*.stdout
            ${{ runner.temp }}/relay-e2e/relay.stderr
          retention-days: 7
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        with:
          name: signed-history-relay-e2e-bin-${{ github.sha }}
          path: target/release/signed_history_relay_e2e
          retention-days: 7
          if-no-files-found: error
      - name: Publish summary
        if: always()
        run: |
          {
            echo "## Signed history relay e2e"
            echo "Source: $GITHUB_SHA"
            echo "Binary: signed_history_relay_e2e (LASTDB_RELAY_E2E_BIN). Scenarios: signed append/read, grant + revoke (403), never-granted append/read (403), ~300 MiB signed bundles, discovering restore into FoldDB, and log/streams (steps streams_*). No credentials."
            if [[ "${DEPLOYED}" != true ]]; then
              echo "Exemem relay: not run (this pull request changes no file of the personal sync or the relays; job scope, output deployed)."
            else
              echo "Exemem relay: ${EXEMEM_RELAY_URL:-not chosen (the step failed before it chose a relay)}"
            fi
            if [[ -f "${RUNNER_TEMP}/relay-e2e/exemem.stdout" ]]; then
              echo
              echo "### Exemem DEV relay cleanup"
              python3 scripts/signed_history/check_relay_e2e.py "${RUNNER_TEMP}/relay-e2e/exemem.stdout" exemem \
                --expect-cleanup | sed -n 's/^cleanup: //p; s/^  - /- /p' || true
            fi
            for f in reference exemem; do
              if [[ -f "${RUNNER_TEMP}/relay-e2e/$f.stdout" ]]; then
                echo
                echo "### $f"
                echo '```json'
                tail -n1 "${RUNNER_TEMP}/relay-e2e/$f.stdout"
                echo '```'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

  blob_stream:
    name: large file through blob routes (reference_relay memory)
    needs: scope
    if: ${{ needs.scope.outputs.run == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "2"
      BLOB_FILE_BYTES: "536870912"
      MAX_RELAY_PEAK_BYTES: "134217728"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: signed-history-relay-e2e-release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build reference_relay and signed_history_relay_e2e (release)
        run: |
          set -euo pipefail
          cargo build --locked -p reference_relay --bin reference_relay --release
          cargo build --locked -p signed_history_relay_e2e --bin signed_history_relay_e2e --release
      - name: Put and get a generated file; relay memory stays far below the file size
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/blob-stream"
          mkdir -p "$OUT"
          ./target/release/reference_relay --listen 127.0.0.1:0 --data-dir "$OUT/relay-data" \
            > "$OUT/relay.addr" 2> "$OUT/relay.stderr" &
          RELAY_PID=$!
          trap 'kill "$RELAY_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 100); do
            [[ -s "$OUT/relay.addr" ]] && break
            sleep 0.1
          done
          ADDR="$(head -n1 "$OUT/relay.addr")"
          [[ -n "$ADDR" ]] || { echo "reference_relay printed no address" >&2; exit 1; }
          export RELAY_URL="http://${ADDR}"
          export LASTDB_RELAY_E2E_TOTAL_BYTES=1048576
          export LASTDB_RELAY_E2E_CLEANUP=false
          export LASTDB_RELAY_E2E_BLOB_FILE_BYTES="$BLOB_FILE_BYTES"
          export LASTDB_RELAY_E2E_WORK_DIR="$OUT/work"
          ./target/release/signed_history_relay_e2e | tee "$OUT/blob.stdout"
          python3 scripts/signed_history/check_relay_e2e.py "$OUT/blob.stdout" blob_stream \
            --expect-blob-file "$BLOB_FILE_BYTES"
          python3 scripts/signed_history/check_relay_process.py --stderr "$OUT/relay.stderr" \
            --pid "$RELAY_PID" --max-peak-bytes "$MAX_RELAY_PEAK_BYTES" \
            --expect-line 'route=blob/put status=200$' \
            --expect-line 'route=blob/upload status=200$' \
            --expect-line 'route=blob/bytes status=200$' | tee "$OUT/process.txt"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: signed-history-blob-stream-${{ github.sha }}
          path: |
            ${{ runner.temp }}/blob-stream/blob.stdout
            ${{ runner.temp }}/blob-stream/process.txt
            ${{ runner.temp }}/blob-stream/relay.stderr
          retention-days: 7
          if-no-files-found: warn
      - name: Publish summary
        if: always()
        run: |
          {
            echo "## Large file through the blob routes"
            echo "Source: $GITHUB_SHA"
            echo "A 512 MiB generated file is put from disk and gotten to disk through a reference_relay process; the digests must match and the relay's peak resident memory (VmHWM) must stay under 128 MiB."
            if [[ -f "${RUNNER_TEMP}/blob-stream/process.txt" ]]; then
              echo '```'
              cat "${RUNNER_TEMP}/blob-stream/process.txt"
              echo '```'
            fi
            if [[ -f "${RUNNER_TEMP}/blob-stream/blob.stdout" ]]; then
              echo '```json'
              tail -n1 "${RUNNER_TEMP}/blob-stream/blob.stdout"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  shared_nodes:
    name: shared database on real nodes (reference_relay)
    needs: scope
    if: ${{ needs.scope.outputs.run == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      FOLDDB_BUILD_VERSION_OVERRIDE: bench-${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: signed-history-shared-nodes
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build reference_relay, lastdbd and lastdb
        run: |
          set -euo pipefail
          cargo build --locked -p reference_relay --bin reference_relay
          cargo build --locked -p lastdb_node --bin lastdb --bin lastdbd
      - name: Publisher, two writers and a reader on real nodes
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/shared-nodes"
          mkdir -p "$OUT"
          ./target/debug/reference_relay --listen 127.0.0.1:0 --data-dir "$OUT/relay-data" \
            > "$OUT/relay.addr" 2> "$OUT/relay.stderr" &
          RELAY_PID=$!
          trap 'kill "$RELAY_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 100); do
            [[ -s "$OUT/relay.addr" ]] && break
            sleep 0.1
          done
          ADDR="$(head -n1 "$OUT/relay.addr")"
          [[ -n "$ADDR" ]] || { echo "reference_relay printed no address" >&2; exit 1; }
          python3 scripts/operations/shared_database_proof.py \
            --daemon "$PWD/target/debug/lastdbd" --cli "$PWD/target/debug/lastdb" \
            --relay-url "http://${ADDR}" --revision "$GITHUB_SHA" \
            --relay-data "$OUT/relay-data" \
            --output "$OUT/nodes" 2>&1 | tee "$OUT/proof.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: signed-history-shared-nodes-${{ github.sha }}
          path: |
            ${{ runner.temp }}/shared-nodes/proof.log
            ${{ runner.temp }}/shared-nodes/relay.stderr
            ${{ runner.temp }}/shared-nodes/nodes/summary.json
            ${{ runner.temp }}/shared-nodes/nodes/*/node.log
          retention-days: 7
          if-no-files-found: warn
      - name: Publish summary
        if: always()
        run: |
          {
            echo "## Signed history shared database on real nodes"
            echo "Source: $GITHUB_SHA"
            echo "Publisher, writers A and B, reader C: real lastdbd nodes on the reference relay. Accepted and not accepted proposals, then a lowered role."
            if [[ -f "${RUNNER_TEMP}/shared-nodes/nodes/summary.json" ]]; then
              echo '```json'
              cat "${RUNNER_TEMP}/shared-nodes/nodes/summary.json"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  lease_nodes:
    name: write leases on real nodes (reference_relay)
    needs: scope
    if: ${{ needs.scope.outputs.run == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      FOLDDB_BUILD_VERSION_OVERRIDE: bench-${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: signed-history-shared-nodes
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build reference_relay, lastdbd and lastdb
        run: |
          set -euo pipefail
          cargo build --locked -p reference_relay --bin reference_relay
          cargo build --locked -p lastdb_node --bin lastdb --bin lastdbd
      - name: Write leases, publisher, two writers and a reader on real nodes
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/lease-nodes"
          mkdir -p "$OUT"
          ./target/debug/reference_relay --listen 127.0.0.1:0 --data-dir "$OUT/relay-data" \
            > "$OUT/relay.addr" 2> "$OUT/relay.stderr" &
          RELAY_PID=$!
          trap 'kill "$RELAY_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 100); do
            [[ -s "$OUT/relay.addr" ]] && break
            sleep 0.1
          done
          ADDR="$(head -n1 "$OUT/relay.addr")"
          [[ -n "$ADDR" ]] || { echo "reference_relay printed no address" >&2; exit 1; }
          python3 scripts/operations/lease_proof.py \
            --daemon "$PWD/target/debug/lastdbd" --cli "$PWD/target/debug/lastdb" \
            --relay-url "http://${ADDR}" --revision "$GITHUB_SHA" \
            --output "$OUT/nodes" 2>&1 | tee "$OUT/proof.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: signed-history-lease-nodes-${{ github.sha }}
          path: |
            ${{ runner.temp }}/lease-nodes/proof.log
            ${{ runner.temp }}/lease-nodes/relay.stderr
            ${{ runner.temp }}/lease-nodes/nodes/summary.json
            ${{ runner.temp }}/lease-nodes/nodes/*/node.log
          retention-days: 7
          if-no-files-found: warn
      - name: Publish summary
        if: always()
        run: |
          {
            echo "## Signed history write leases on real nodes"
            echo "Source: $GITHUB_SHA"
            echo "Publisher, A, B, C: real lastdbd nodes on the reference relay. Direct writes under a lease, expiry, renewal, closing, reduced roles."
            if [[ -f "${RUNNER_TEMP}/lease-nodes/nodes/summary.json" ]]; then
              echo '```json'
              cat "${RUNNER_TEMP}/lease-nodes/nodes/summary.json"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  personal_nodes:
    name: personal database on real nodes (reference_relay)
    needs: scope
    if: ${{ needs.scope.outputs.run == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: "2"
      # Writes of the scale step. Tens of thousands, sized to finish in a few minutes.
      PROOF_SCALE_WRITES: "20000"
      CARGO_PROFILE_DEV_DEBUG: "0"
      FOLDDB_BUILD_VERSION_OVERRIDE: bench-${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: signed-history-shared-nodes
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build reference_relay, lastdbd and lastdb
        run: |
          set -euo pipefail
          cargo build --locked -p reference_relay --bin reference_relay --bin entry_audit
          cargo build --locked -p lastdb_node --bin lastdb --bin lastdbd
      - name: Devices A to D, the relay, order by edit time, kill -9 under load, and scale
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/personal-nodes"
          mkdir -p "$OUT"
          python3 scripts/operations/personal_database_proof.py \
            --daemon "$PWD/target/debug/lastdbd" --cli "$PWD/target/debug/lastdb" \
            --relay-bin "$PWD/target/debug/reference_relay" --revision "$GITHUB_SHA" \
            --output "$OUT/nodes" 2>&1 | tee "$OUT/proof.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: signed-history-personal-nodes-${{ github.sha }}
          path: |
            ${{ runner.temp }}/personal-nodes/proof.log
            ${{ runner.temp }}/personal-nodes/nodes/relay.stderr
            ${{ runner.temp }}/personal-nodes/nodes/summary.json
            ${{ runner.temp }}/personal-nodes/nodes/*/node.log
            ${{ runner.temp }}/personal-nodes/nodes/*/shutdown.json
            ${{ runner.temp }}/personal-nodes/nodes/*/cleanup.json
          retention-days: 7
          if-no-files-found: warn
      - name: Publish summary
        if: always()
        run: |
          {
            echo "## Personal database on real nodes"
            echo "Source: $GITHUB_SHA"
            echo "Device A writes single and batched records in two schemas, device B and restored homes C and D start from the recovery phrase alone, the later edit wins whichever device syncs first, a deleted record stays deleted, alternate keys and files arrive with the relay stopped, the relay holds no key, value or schema name, an idle turn reads nothing, kill -9 under write load loses and repeats nothing, and tens of thousands of writes run in bounded memory. A snapshot is the checkpoint: a restore installs it and reads only the tail, equals a full replay, survives a kill during the install, and a second snapshot uploads only the changed files."
            if [[ -f "${RUNNER_TEMP}/personal-nodes/nodes/summary.json" ]]; then
              echo '```json'
              cat "${RUNNER_TEMP}/personal-nodes/nodes/summary.json"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  existing_home:
    name: a home that holds data gets a relay and publishes its first snapshot (reference_relay)
    needs: scope
    if: ${{ needs.scope.outputs.run == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      FOLDDB_BUILD_VERSION_OVERRIDE: bench-${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: signed-history-shared-nodes
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build reference_relay, lastdbd and lastdb
        run: |
          set -euo pipefail
          cargo build --locked -p reference_relay --bin reference_relay
          cargo build --locked -p lastdb_node --bin lastdb --bin lastdbd
      - name: A home with data and no relay, the first snapshot, later writes, and a restore
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/existing-home"
          mkdir -p "$OUT"
          python3 scripts/operations/existing_home_proof.py \
            --daemon "$PWD/target/debug/lastdbd" --cli "$PWD/target/debug/lastdb" \
            --relay-bin "$PWD/target/debug/reference_relay" --revision "$GITHUB_SHA" \
            --output "$OUT/nodes" 2>&1 | tee "$OUT/proof.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: signed-history-existing-home-${{ github.sha }}
          path: |
            ${{ runner.temp }}/existing-home/proof.log
            ${{ runner.temp }}/existing-home/nodes/relay.stderr
            ${{ runner.temp }}/existing-home/nodes/*/node.log
            ${{ runner.temp }}/existing-home/nodes/*/*/node.log
          retention-days: 7
          if-no-files-found: warn
      - name: Publish summary
        if: always()
        run: |
          {
            echo "## A home that holds data gets a relay and publishes its first snapshot"
            echo "Source: $GITHUB_SHA."
            echo "A home written with no relay (records in three schemas, an alternate key, a file) starts with the reference relay, publishes its files as a first snapshot before any later write goes up, sends each later write as one entry, and a restore from the recovery phrase equals it and replays only the later entries. The relay holds no marker."
          } >> "$GITHUB_STEP_SUMMARY"

  upgrade:
    name: a home of the previous nightly continues on the build under test (reference_relay)
    needs: scope
    if: ${{ needs.scope.outputs.run == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      FOLDDB_BUILD_VERSION_OVERRIDE: bench-${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: signed-history-shared-nodes
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build reference_relay, lastdbd and lastdb
        run: |
          set -euo pipefail
          cargo build --locked -p reference_relay --bin reference_relay
          cargo build --locked -p lastdb_node --bin lastdb --bin lastdbd
      - name: The previous nightly makes a home, the build under test continues it, and a restore equals it
        env:
          PULL_REQUEST_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/upgrade"
          mkdir -p "$OUT"
          python3 scripts/operations/upgrade_proof.py \
            --daemon "$PWD/target/debug/lastdbd" --cli "$PWD/target/debug/lastdb" \
            --relay-bin "$PWD/target/debug/reference_relay" --revision "$GITHUB_SHA" \
            --exclude-oid "${PULL_REQUEST_HEAD:-$GITHUB_SHA}" \
            --output "$OUT/nodes" 2>&1 | tee "$OUT/proof.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: signed-history-upgrade-${{ github.sha }}
          path: |
            ${{ runner.temp }}/upgrade/proof.log
            ${{ runner.temp }}/upgrade/nodes/relay.stderr
            ${{ runner.temp }}/upgrade/nodes/*/node.log
          retention-days: 7
          if-no-files-found: warn

  deployed_relay:
    name: personal database on the Exemem DEV relay
    needs: scope
    if: ${{ needs.scope.outputs.deployed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      FOLDDB_BUILD_VERSION_OVERRIDE: bench-${{ github.sha }}
      EXEMEM_RELAY_INPUT: ${{ inputs.exemem_relay_url || vars.EXEMEM_RELAY_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: signed-history-shared-nodes
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build lastdbd and lastdb
        run: |
          set -euo pipefail
          cargo build --locked -p lastdb_node --bin lastdb --bin lastdbd
          cargo build --locked -p reference_relay --bin entry_audit
      - name: Choose the relay
        run: |
          set -euo pipefail
          url="${EXEMEM_RELAY_INPUT:-}"
          if [[ -z "$url" ]]; then
            url="$(jq -er '.environments.dev.exemem_api' lastdb_node/environments.json)"
          fi
          echo "RELAY_URL=${url%/}" >> "$GITHUB_ENV"
      - name: Personal database on the DEV relay, a fresh identity
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/deployed-personal"
          mkdir -p "$OUT"
          python3 scripts/operations/personal_database_proof.py \
            --daemon "$PWD/target/debug/lastdbd" --cli "$PWD/target/debug/lastdb" \
            --relay-url "$RELAY_URL" --entry-audit "$PWD/target/debug/entry_audit" --revision "$GITHUB_SHA" \
            --output "$OUT/nodes" 2>&1 | tee "$OUT/proof.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: signed-history-deployed-relay-${{ github.sha }}
          path: |
            ${{ runner.temp }}/deployed-personal/proof.log
            ${{ runner.temp }}/deployed-personal/nodes/summary.json
            ${{ runner.temp }}/deployed-personal/nodes/summary.md
            ${{ runner.temp }}/deployed-personal/nodes/*/node.log
            ${{ runner.temp }}/deployed-personal/nodes/*/shutdown.json
            ${{ runner.temp }}/deployed-personal/nodes/*/cleanup.json
          retention-days: 7
          if-no-files-found: warn

  log_sync_relay_timeout:
    name: log_sync relay timeout on hung peer
    needs: scope
    if: ${{ needs.scope.outputs.run == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: log-sync-relay-timeout-probe
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build log_sync_relay_timeout_probe (release)
        run: |
          set -euo pipefail
          cargo build --locked -p lastdb_node --bin log_sync_relay_timeout_probe --release
      - name: Hung peer must time out within budget
        run: |
          set -euo pipefail
          OUT="${RUNNER_TEMP}/log-sync-timeout"
          mkdir -p "$OUT"
          python3 scripts/signed_history/hang_http_peer.py > "$OUT/peer.addr" &
          PEER_PID=$!
          trap 'kill "$PEER_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 50); do
            [[ -s "$OUT/peer.addr" ]] && break
            sleep 0.1
          done
          ADDR="$(head -n1 "$OUT/peer.addr")"
          [[ -n "$ADDR" ]] || { echo "hang peer printed no address" >&2; exit 1; }
          export RELAY_URL="http://${ADDR}"
          ./target/release/log_sync_relay_timeout_probe | tee "$OUT/probe.stderr"
          echo "hung peer timed out as required (RELAY_URL=$RELAY_URL)" >> "$GITHUB_STEP_SUMMARY"

  complete:
    # The merge gate. Ruleset `signed-history-proofs-required` on main requires a check of this name.
    name: signed-history-proofs-complete
    needs: [scope, proofs, relay_e2e, blob_stream, shared_nodes, lease_nodes, personal_nodes, existing_home, upgrade, deployed_relay, log_sync_relay_timeout]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every proof in scope passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "- \(.key): \(.value.result)"' <<< "$NEEDS" | tee -a "$GITHUB_STEP_SUMMARY"
          # In scope a proof must succeed. Out of scope it must not have run at all.
          jq -e '
            (.scope.outputs.run == "true") as $run
            | (.scope.outputs.deployed == "true") as $deployed
            | .scope.result == "success"
              and (del(.scope) | to_entries | all(
                .value.result == (if $run and (.key != "deployed_relay" or $deployed) then "success" else "skipped" end)))
          ' <<< "$NEEDS" > /dev/null || { echo "::error::A proof in scope did not pass, or the scope job failed."; exit 1; }
          echo "Every proof in scope passed." >> "$GITHUB_STEP_SUMMARY"
