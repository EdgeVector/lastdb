name: One-time lifecycle edge evidence

# Tom approved the incorrect-age, generation/cleanup, and v2 lifecycle cases.
# Temporary evidence branch only. Close its PR WITHOUT MERGE after retention.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  actions: read

concurrency:
  group: lifecycle-edge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  evidence:
    if: github.head_ref == 'direct/lifecycle-edge-evidence-20261025'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      CARGO_BUILD_JOBS: '3'
      CARGO_PROFILE_DEV_RELEASE_DEBUG: '0'
      PRODUCT_SHA: d57c63f859a63cd184055b3fab5095f1a534b6f6
      V2_SHA: 9b744e16fe270c64b35d14c7afdb69d7d4b93f12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Record exact source inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lifecycle-evidence"
          git merge-base --is-ancestor "$PRODUCT_SHA" HEAD
          git merge-base --is-ancestor "$V2_SHA" HEAD
          {
            git rev-parse HEAD HEAD^{tree}
            echo "Product: $PRODUCT_SHA"
            echo "V2: $V2_SHA"
            echo 'Generated data only; no primary/cloud input. One-time support does not merge.'
          } | tee "$RUNNER_TEMP/lifecycle-evidence/source.txt" >> "$GITHUB_STEP_SUMMARY"
          echo "FOLDDB_BUILD_VERSION_OVERRIDE=bench-$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lifecycle-one-time
          save-if: 'false'
      - name: Build the exact core evidence and daemon
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked -p fold_db --example lifecycle_edge_evidence -- -D warnings
          cargo build --locked --profile dev-release -p fold_db --example lifecycle_edge_evidence
          cargo build --locked --profile dev-release -p lastdb_node --bin lastdbd
      - name: Incorrect Hash ages and both generation contention directions on v1 and v2
        shell: bash
        run: |
          set -euo pipefail
          target/dev-release/examples/lifecycle_edge_evidence 2>&1 \
            | tee "$RUNNER_TEMP/lifecycle-evidence/core.log"
          cat "$RUNNER_TEMP/lifecycle-evidence/core.log" >> "$GITHUB_STEP_SUMMARY"
      - name: Actual v2 socket TTL, Delete, Purge, marker cleanup, run merge and restart
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/benchmarks/lifecycle_v2_evidence.py \
            --binary "$GITHUB_WORKSPACE/target/dev-release/lastdbd" \
            --revision "$(git rev-parse HEAD)" --output "$RUNNER_TEMP/lifecycle-evidence/socket-v2"
      - uses: actions/upload-artifact@v4
        id: upload
        if: always()
        with:
          name: lifecycle-edge-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lifecycle-evidence/
          retention-days: 14
          if-no-files-found: error
      - name: Download and verify the complete retained archive
        if: always() && steps.upload.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ARTIFACT_SHA256: ${{ steps.upload.outputs.artifact-digest }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          BASELINE_SHA: 9b744e16fe270c64b35d14c7afdb69d7d4b93f12
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > "$RUNNER_TEMP/lifecycle-artifact.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/lifecycle-artifact.zip"
          python3 scripts/benchmarks/range_continuation/artifact.py \
            --metadata "$RUNNER_TEMP/lifecycle-artifact.json" --archive "$RUNNER_TEMP/lifecycle-artifact.zip"
