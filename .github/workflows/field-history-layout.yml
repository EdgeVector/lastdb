name: Record history compiler layouts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  layout:
    name: Inspect ${{ matrix.label }} request layouts
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: before-708
            revision: 71fb949a89d1ba77909ca9d57cfcfaf7d7418d45
          - label: after-708
            revision: 18bc31a40ea5253563aececc1a30fd030da0949b
          - label: current
            revision: ${{ github.event.pull_request.head.sha || github.sha }}
    env:
      CARGO_BUILD_JOBS: '2'
      RUSTFLAGS: '-Zprint-type-sizes'
      RUSTC_BOOTSTRAP: '1'
      FOLDDB_BUILD_VERSION_OVERRIDE: bench-${{ matrix.revision }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: driver
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.revision }}
          path: source
          persist-credentials: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
          key: layout-downloads-${{ runner.os }}-${{ hashFiles('source/Cargo.lock') }}
      - name: Record exact source and compiler
        working-directory: source
        env:
          SOURCE_REVISION: ${{ matrix.revision }}
        run: |
          [ "$(git rev-parse HEAD)" = "$SOURCE_REVISION" ]
          mkdir "$RUNNER_TEMP/layout"
          rustc --version --verbose > "$RUNNER_TEMP/layout/compiler.txt"
          echo "$SOURCE_REVISION" > "$RUNNER_TEMP/layout/source.txt"
          echo "$RUSTFLAGS" > "$RUNNER_TEMP/layout/flags.txt"
      - name: Build the actual daemon with compiler layout output
        working-directory: source
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/layout-target
        run: |
          cargo build --locked --profile dev-release -p lastdb_node --bin lastdbd > "$RUNNER_TEMP/layout/compiler.log" 2>&1
      - name: Summarize actual request layouts
        env:
          SOURCE_REVISION: ${{ matrix.revision }}
        run: |
          python3 driver/scripts/operations/field_history_layout.py --log "$RUNNER_TEMP/layout/compiler.log" \
            --output "$RUNNER_TEMP/layout/layouts.json" --revision "$SOURCE_REVISION" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        id: evidence
        if: always()
        with:
          name: field-history-layout-${{ matrix.label }}-${{ github.sha }}
          path: ${{ runner.temp }}/layout
          if-no-files-found: error
          retention-days: 7
      - name: Record artifact provenance
        if: always()
        env:
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact-digest }}
          SOURCE_REVISION: ${{ matrix.revision }}
          RESULT: ${{ job.status }}
        run: |
          {
            echo "Source: $SOURCE_REVISION"
            echo "Result: $RESULT"
            echo "Artifact: $ARTIFACT_URL"
            echo "Artifact SHA256: $ARTIFACT_DIGEST"
            echo "Expiration: 7 days after this run."
            echo "Compiler layout only. No primary access or runtime memory claim."
          } >> "$GITHUB_STEP_SUMMARY"
