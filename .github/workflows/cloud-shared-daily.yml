name: Daily shared DEV operations

on:
  push:
    branches: [main]
  schedule:
    - cron: '53 10 * * *'
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [suite, automatic, cleanup, reclamation, abandoned]
        default: suite

permissions:
  contents: read

env:
  # One six-device automatic sync and source-free restore per accepted main push.
  # The full four-case suite still runs daily; manual qualification stays manual.
  SELECTED_OPERATION: ${{ github.event_name == 'push' && 'automatic' || github.event.schedule == '17 * * * *' && 'cleanup' || inputs.operation || 'suite' }}

concurrency:
  group: cloud-shared-daily
  cancel-in-progress: false
  # Preserve pending main revisions instead of replacing all but the latest.
  queue: max

jobs:
  admission:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # Admission has no cloud credentials; main CI/build gates may take 45 minutes.
    timeout-minutes: 65
    permissions:
      contents: read
      checks: read
    outputs:
      operation: ${{ steps.admit.outputs.operation }}
      cases: ${{ steps.admit.outputs.cases }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: admit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cloud_backup/shared_daily_admit.py

  build:
    needs: admission
    if: needs.admission.outputs.operation != 'cleanup'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/cloud-backup-build.yml

  cleanup:
    name: Retire owned shared DEV scopes
    needs: admission
    environment: cloud-backup-dev
    runs-on: ubuntu-24.04
    # Two bounded cleanup passes plus at most one credential-free retirement drain.
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::152335099025:role/LastDBSharedDailyDev
          aws-region: us-west-2
          role-session-name: shared-cleanup-${{ github.run_id }}
      - name: Advance bounded retirement after the full drain
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/cloud_backup/shared_daily_suite.py --cleanup
          --source "$GITHUB_SHA" --output "$RUNNER_TEMP/shared-daily-cleanup.json"
      - name: Plan capacity for all selected cases
        id: capacity
        timeout-minutes: 3
        env:
          OPERATION: ${{ needs.admission.outputs.operation }}
        run: python3 scripts/cloud_backup/shared_daily_capacity.py --operation "$OPERATION"
      - name: Clear the first cleanup role session before waiting
        if: steps.capacity.outputs.wait_seconds != '0' && steps.capacity.outputs.wait_seconds != ''
        run: |
          set -euo pipefail
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_SECURITY_TOKEN; do
            printf '%s=\n' "$name" >> "$GITHUB_ENV"
            unset "$name"
          done
      - name: Wait without cloud credentials for already-fenced scope capacity
        if: steps.capacity.outputs.wait_seconds != '0' && steps.capacity.outputs.wait_seconds != ''
        timeout-minutes: 62
        env:
          WAIT_SECONDS: ${{ steps.capacity.outputs.wait_seconds }}
        run: python3 scripts/cloud_backup/shared_daily_capacity.py --wait-seconds "$WAIT_SECONDS"
      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.capacity.outputs.wait_seconds != '0' && steps.capacity.outputs.wait_seconds != ''
        with:
          unset-current-credentials: true
          role-to-assume: arn:aws:iam::152335099025:role/LastDBSharedDailyDev
          aws-region: us-west-2
          role-session-name: shared-cleanup-drained-${{ github.run_id }}
      - name: Reclaim the drained scopes with the fresh role session
        if: steps.capacity.outputs.wait_seconds != '0' && steps.capacity.outputs.wait_seconds != ''
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test ! -e "$RUNNER_TEMP/shared-daily-cleanup-initial.json"
          mv "$RUNNER_TEMP/shared-daily-cleanup.json" "$RUNNER_TEMP/shared-daily-cleanup-initial.json"
          python3 scripts/cloud_backup/shared_daily_suite.py --cleanup \
            --source "$GITHUB_SHA" --output "$RUNNER_TEMP/shared-daily-cleanup.json"
      - name: Require capacity before any case can enroll
        timeout-minutes: 3
        env:
          OPERATION: ${{ needs.admission.outputs.operation }}
        run: python3 scripts/cloud_backup/shared_daily_capacity.py --operation "$OPERATION" --check
      - uses: actions/upload-artifact@v7
        if: always()
        id: evidence
        with:
          name: shared-daily-cleanup-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/shared-daily-cleanup.json
            ${{ runner.temp }}/shared-daily-cleanup-initial.json
          if-no-files-found: error
          retention-days: 90
      - name: Record result provenance
        if: always() && steps.evidence.outputs.artifact-id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ steps.evidence.outputs.artifact-id }}
        run: python3 scripts/cloud_backup/shared_daily_artifact.py "$ARTIFACT"

  cases:
    name: Shared DEV / ${{ matrix.case }}
    needs: [admission, build, cleanup]
    if: needs.admission.outputs.operation != 'cleanup'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        case: ${{ fromJSON(needs.admission.outputs.cases) }}
    environment: cloud-backup-dev
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.case == 'abandoned' && 125 || matrix.case == 'reclamation' && 95 || 10 }}
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: ${{ runner.temp }}/client-package
      - name: Unpack the exact accepted client
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/client-bin"
          tar -xzf "$RUNNER_TEMP/client-package/lastdb-x86_64-unknown-linux-gnu.tar.gz" \
            -C "$RUNNER_TEMP/client-bin" lastdb lastdbd
          sha256sum "$RUNNER_TEMP/client-package/lastdb-x86_64-unknown-linux-gnu.tar.gz"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::152335099025:role/LastDBSharedDailyDev
          aws-region: us-west-2
          role-session-name: shared-${{ matrix.case }}-${{ github.run_id }}
      - name: Enroll, operate, verify and fence the fresh scope
        env:
          CASE: ${{ matrix.case }}
          CLIENT_VERSION: ${{ needs.build.outputs.version }}
          LASTDB_CLOUD_DEV_API_KEY: ${{ secrets.LASTDB_CLOUD_DEV_API_KEY }}
          LASTDB_CLOUD_DEV_RECOVERY_PHRASE: ${{ secrets.LASTDB_CLOUD_DEV_RECOVERY_PHRASE }}
        run: >-
          python3 scripts/cloud_backup/shared_daily_suite.py --case "$CASE"
          --source "$GITHUB_SHA" --version "$CLIENT_VERSION" --bin-dir "$RUNNER_TEMP/client-bin"
          --output "$RUNNER_TEMP/shared-daily-$CASE.json"
      - uses: actions/upload-artifact@v7
        if: always()
        id: evidence
        with:
          name: shared-daily-${{ matrix.case }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/shared-daily-${{ matrix.case }}.json
          if-no-files-found: error
          retention-days: 90
      - name: Record result provenance
        if: always() && steps.evidence.outputs.artifact-id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ steps.evidence.outputs.artifact-id }}
        run: python3 scripts/cloud_backup/shared_daily_artifact.py "$ARTIFACT"

  complete:
    name: Shared daily complete
    if: always()
    needs: [admission, build, cleanup, cases]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: shared-daily-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/shared-daily-results
          merge-multiple: true
      - name: Require actual exact-source results and cleanup state
        env:
          ADMISSION_RESULT: ${{ needs.admission.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          CLEANUP_RESULT: ${{ needs.cleanup.result }}
          CASES_RESULT: ${{ needs.cases.result }}
        run: >-
          python3 scripts/cloud_backup/shared_daily_results.py --operation "$SELECTED_OPERATION"
          --directory "$RUNNER_TEMP/shared-daily-results"
