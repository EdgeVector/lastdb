name: App multi-key latency
on:
  pull_request:
    paths:
      - 'scripts/benchmarks/app_multi_key*'
      - '.github/workflows/app-multi-key-latency.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: app-multi-key-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        records: [1000, 10000]
    env:
      CARGO_BUILD_JOBS: '3'
      CARGO_TERM_COLOR: never
      # CI uses the DEV Schema Service. The definition check and both release
      # daemons read this one value, so they always name the same registry.
      ENVIRONMENT: dev
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASELINE_SHA: 34e6d312efadd10bade667895be7356cfddc48f8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.10'
      - name: Check out the exact public app sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for app in fkanban brain; do
            for label in baseline candidate; do
              revision=$(jq -r --arg app "$app" --arg label "$label" '.[$app][$label]' scripts/benchmarks/app_multi_key_revisions.json)
              [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
              directory="$RUNNER_TEMP/app-sources/$app/$label"
              git init "$directory"
              git -C "$directory" remote add origin "https://github.com/EdgeVector/$app.git"
              git -C "$directory" fetch --depth 1 origin "$revision"
              git -C "$directory" checkout --detach FETCH_HEAD
              cd "$directory"
              bun install --frozen-lockfile
              cd "$GITHUB_WORKSPACE"
            done
          done
      - name: Require registered app definitions before the build
        run: bun scripts/benchmarks/app_multi_key_catalog.mjs "$RUNNER_TEMP/app-sources" scripts/benchmarks/app_multi_key_revisions.json
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: app-multi-key
          save-if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.BASELINE_SHA }}
          path: compatible-release
          persist-credentials: false
      - name: Build the compatible control and current release in CI
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/app-binaries"
          for label in baseline candidate; do
            if [ "$label" = baseline ]; then
              source="$GITHUB_WORKSPACE/compatible-release"
              selected="$BASELINE_SHA"
            else
              source="$GITHUB_WORKSPACE"
              selected="$CANDIDATE_SHA"
            fi
            [[ "$selected" =~ ^[0-9a-f]{40}$ ]]
            test "$(git -C "$source" rev-parse HEAD)" = "$selected"
            cd "$source"
            FOLDDB_BUILD_VERSION_OVERRIDE="bench-$selected" \
              CARGO_TARGET_DIR="$RUNNER_TEMP/app-target-$label" \
              cargo build --locked --profile dev-release -p lastdb_node --bin lastdbd
            cp "$RUNNER_TEMP/app-target-$label/dev-release/lastdbd" "$RUNNER_TEMP/app-binaries/$label"
            rm -rf "$RUNNER_TEMP/app-target-$label"
          done
      - name: Compare app operations, explicit conversion, and the release upgrade
        run: |
          python3 scripts/benchmarks/app_multi_key_compare.py \
            --binary "$RUNNER_TEMP/app-binaries/candidate" --revision "$CANDIDATE_SHA" \
            --baseline-binary "$RUNNER_TEMP/app-binaries/baseline" --baseline-revision "$BASELINE_SHA" \
            --records '${{ matrix.records }}' \
            --apps "$RUNNER_TEMP/app-sources" --driver "$GITHUB_WORKSPACE/scripts/benchmarks/app_multi_key.mjs" \
            --revisions "$GITHUB_WORKSPACE/scripts/benchmarks/app_multi_key_revisions.json" \
            --output "$RUNNER_TEMP/app-multi-key-results"
      - name: Upload the comparison
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-multi-key-${{ matrix.records }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/app-multi-key-results/
          if-no-files-found: error
          retention-days: 14
      - name: Verify the artifact upload
        if: ${{ always() && steps.upload.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ARTIFACT_SHA256: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > "$RUNNER_TEMP/app-artifact.json"
          python3 scripts/benchmarks/artifact.py --metadata "$RUNNER_TEMP/app-artifact.json" --output "$RUNNER_TEMP/app-artifact-receipt"

