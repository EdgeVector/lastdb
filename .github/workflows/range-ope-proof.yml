name: Range OPE crypto proof

on:
  pull_request:
    paths:
      - 'lastdb_range_crypto/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/range-ope-proof.yml'
  push:
    branches: [main]
    paths:
      - 'lastdb_range_crypto/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/range-ope-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: range-ope-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  range-ope-proof:
    name: Scoped whole-range OPE proof
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Select Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          key: range-ope-proof
      # Tom's 2026-10-24 "Do all of these" authorizes the single CI-only
      # crypto proof in the primary adoption plan. Other tests stay retired.
      - name: Lint the portable crate and proof
        run: cargo clippy --locked -p lastdb_range_crypto --all-targets -- -D warnings
      - name: Execute the authorized crypto proof
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked -p lastdb_range_crypto --example range_ope_proof \
            | tee "$RUNNER_TEMP/range-ope-proof.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/range-ope-source.txt"
          sha256sum "$RUNNER_TEMP/range-ope-proof.txt" > "$RUNNER_TEMP/range-ope-proof.sha256"
          {
            echo '### Range OPE crypto proof'
            echo "Source: $(git rev-parse HEAD)"
            cat "$RUNNER_TEMP/range-ope-proof.txt"
            cat "$RUNNER_TEMP/range-ope-proof.sha256"
            echo 'This establishes checked behavior, not a cryptographic audit.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        id: proof
        with:
          name: range-ope-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/range-ope-proof.txt
            ${{ runner.temp }}/range-ope-proof.sha256
            ${{ runner.temp }}/range-ope-source.txt
          if-no-files-found: error
          retention-days: 14
      - name: Record artifact location and retention
        env:
          ARTIFACT_URL: ${{ steps.proof.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.proof.outputs.artifact-digest }}
        run: |
          echo "Artifact: $ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifact SHA-256: $ARTIFACT_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo 'Retention: 14 days from upload.' >> "$GITHUB_STEP_SUMMARY"
