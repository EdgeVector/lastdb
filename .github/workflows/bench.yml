name: LastDB benchmarks

# Slowdowns are advisory. Build failures and incomplete measurements are errors.
# Keep this workflow separate from the ci-required merge gate.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]
  schedule:
    - cron: "27 9 * * *"
  workflow_dispatch:
    inputs:
      profile:
        description: Benchmark size
        type: choice
        options: [standard, nightly]
        default: standard

permissions:
  contents: read
  actions: read

concurrency:
  # Supersede PR measurements only. Every main push keeps its own run.
  group: lastdb-bench-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  benchmark:
    name: Reads, durable writes, and concurrency (advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: "4"
      CARGO_TERM_COLOR: always
      BENCH_PROFILE: ${{ github.event_name == 'schedule' && 'nightly' || inputs.profile || 'standard' }}
    steps:
      - name: Prepare external result directory
        run: |
          result_dir="$RUNNER_TEMP/lastdb-benchmarks-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$result_dir"
          echo "BENCH_OUTPUT=$result_dir" >> "$GITHUB_ENV"

      - name: Checkout benchmark driver from the workflow revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: benchmark-driver
          sparse-checkout: scripts/benchmarks
          persist-credentials: false

      - name: Checkout exact candidate source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          fetch-depth: 2
          persist-credentials: false

      - name: Select exact revisions
        id: revisions
        working-directory: candidate
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          candidate_sha="$(git rev-parse HEAD)"
          baseline_sha="${PR_BASE:-${PUSH_BASE:-}}"
          if [ -z "$baseline_sha" ] || [[ "$baseline_sha" =~ ^0+$ ]]; then
            baseline_sha="$(git rev-parse HEAD^)"
          fi
          [[ "$candidate_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$baseline_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "candidate=$candidate_sha" >> "$GITHUB_OUTPUT"
          echo "baseline=$baseline_sha" >> "$GITHUB_OUTPUT"

      - name: Check benchmark script syntax
        run: python3 -m py_compile benchmark-driver/scripts/benchmarks/*.py

      - name: Checkout baseline
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.revisions.outputs.baseline }}
          path: baseline
          persist-credentials: false

      - name: Reserve disk space for both builds and the nightly corpus
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Select one Rust toolchain for both builds
        working-directory: candidate
        run: |
          set -euo pipefail
          rustup show active-toolchain
          toolchain="$(rustup show active-toolchain | cut -d ' ' -f 1)"
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"

      - name: Cache dependency downloads only
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
          key: benchmark-downloads-${{ runner.os }}-${{ hashFiles('candidate/Cargo.lock', 'baseline/Cargo.lock') }}
          restore-keys: benchmark-downloads-${{ runner.os }}-

      - name: Build both optimized daemons
        env:
          CANDIDATE_SHA: ${{ steps.revisions.outputs.candidate }}
          BASELINE_SHA: ${{ steps.revisions.outputs.baseline }}
        run: |
          set -euo pipefail
          mkdir -p "$BENCH_OUTPUT"
          rustc --version --verbose > "$BENCH_OUTPUT/toolchain.txt"
          for version in baseline candidate; do
            if [ "$version" = baseline ]; then revision="$BASELINE_SHA"; else revision="$CANDIDATE_SHA"; fi
            (
              cd "$version"
              # Separate fresh targets avoid stale cached storage libraries.
              export CARGO_TARGET_DIR="$RUNNER_TEMP/bench-target-$version"
              export FOLDDB_BUILD_VERSION_OVERRIDE="bench-$revision"
              cargo build --locked --profile dev-release -p lastdb_node --bin lastdbd
            ) 2>&1 | tee "$BENCH_OUTPUT/build-$version.log"
          done

      - name: Measure alternating baseline and candidate pairs
        env:
          CANDIDATE_SHA: ${{ steps.revisions.outputs.candidate }}
          BASELINE_SHA: ${{ steps.revisions.outputs.baseline }}
        run: |
          timeout --signal=TERM --kill-after=120s 65m \
            python3 benchmark-driver/scripts/benchmarks/run.py \
              --baseline "$RUNNER_TEMP/bench-target-baseline/dev-release/lastdbd" \
              --candidate "$RUNNER_TEMP/bench-target-candidate/dev-release/lastdbd" \
              --baseline-revision "$BASELINE_SHA" \
              --candidate-revision "$CANDIDATE_SHA" \
              --profile "$BENCH_PROFILE" --output "$BENCH_OUTPUT"

      - name: Publish benchmark summary
        if: always()
        env:
          MEASUREMENT_OUTCOME: ${{ job.status }}
        run: python3 benchmark-driver/scripts/benchmarks/report.py --output "$BENCH_OUTPUT" --job-status "$MEASUREMENT_OUTCOME"

      - name: Upload measurements and build receipts
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lastdb-benchmarks-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.BENCH_OUTPUT }}/
          retention-days: 14
          if-no-files-found: error

      - name: Verify upload and record its download receipt
        if: ${{ always() && steps.upload.outcome == 'success' }}
        id: receipt
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ARTIFACT_SHA256: ${{ steps.upload.outputs.artifact-digest }}
          CANDIDATE_SHA: ${{ steps.revisions.outputs.candidate }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > "$RUNNER_TEMP/benchmark-artifact-metadata.json"
          python3 benchmark-driver/scripts/benchmarks/artifact.py \
            --metadata "$RUNNER_TEMP/benchmark-artifact-metadata.json" \
            --output "$RUNNER_TEMP/benchmark-download-receipt"

      - name: Retain the compact download receipt
        if: ${{ always() && steps.receipt.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: lastdb-benchmark-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/benchmark-download-receipt/artifact.json
          retention-days: 14
          if-no-files-found: error
