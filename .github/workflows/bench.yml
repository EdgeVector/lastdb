name: LastDB benchmarks

# Slowdowns are advisory. Build failures and incomplete measurements are errors.
# Keep this workflow separate from the ci-required merge gate.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]
  schedule:
    - cron: "27 9 * * *"
  workflow_dispatch:
    inputs:
      profile:
        description: Benchmark size
        type: choice
        options: [standard, nightly]
        default: standard

permissions:
  contents: read

concurrency:
  # Supersede PR measurements only. Every main push keeps its own run.
  group: lastdb-bench-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  benchmark:
    name: Reads, durable writes, and concurrency (advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: "4"
      CARGO_TERM_COLOR: always
      BENCH_PROFILE: ${{ github.event_name == 'schedule' && 'nightly' || inputs.profile || 'standard' }}
    steps:
      - name: Checkout candidate and benchmark driver
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          fetch-depth: 2
          persist-credentials: false

      - name: Select exact revisions
        id: revisions
        working-directory: candidate
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          candidate_sha="$(git rev-parse HEAD)"
          baseline_sha="${PR_BASE:-${PUSH_BASE:-}}"
          if [ -z "$baseline_sha" ] || [[ "$baseline_sha" =~ ^0+$ ]]; then
            baseline_sha="$(git rev-parse HEAD^)"
          fi
          [[ "$candidate_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$baseline_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "candidate=$candidate_sha" >> "$GITHUB_OUTPUT"
          echo "baseline=$baseline_sha" >> "$GITHUB_OUTPUT"

      - name: Check benchmark script syntax
        run: python3 -m py_compile candidate/scripts/benchmarks/*.py

      - name: Checkout baseline
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.revisions.outputs.baseline }}
          path: baseline
          persist-credentials: false

      - name: Select one Rust toolchain for both builds
        working-directory: candidate
        run: |
          set -euo pipefail
          rustup show active-toolchain
          toolchain="$(rustup show active-toolchain | cut -d ' ' -f 1)"
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"

      - name: Cache dependency downloads only
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
          key: benchmark-downloads-${{ runner.os }}-${{ hashFiles('candidate/Cargo.lock', 'baseline/Cargo.lock') }}
          restore-keys: benchmark-downloads-${{ runner.os }}-

      - name: Build both optimized daemons
        env:
          CANDIDATE_SHA: ${{ steps.revisions.outputs.candidate }}
          BASELINE_SHA: ${{ steps.revisions.outputs.baseline }}
        run: |
          set -euo pipefail
          mkdir -p results
          rustc --version --verbose > results/toolchain.txt
          for version in baseline candidate; do
            if [ "$version" = baseline ]; then revision="$BASELINE_SHA"; else revision="$CANDIDATE_SHA"; fi
            (
              cd "$version"
              # Separate fresh targets avoid stale cached storage libraries.
              export CARGO_TARGET_DIR="$RUNNER_TEMP/bench-target-$version"
              export FOLDDB_BUILD_VERSION_OVERRIDE="bench-$revision"
              cargo build --locked --profile dev-release -p lastdb_node --bin lastdbd
            ) 2>&1 | tee "results/build-$version.log"
          done

      - name: Measure alternating baseline and candidate pairs
        env:
          CANDIDATE_SHA: ${{ steps.revisions.outputs.candidate }}
          BASELINE_SHA: ${{ steps.revisions.outputs.baseline }}
        run: |
          timeout --signal=TERM --kill-after=30s 65m \
            python3 candidate/scripts/benchmarks/run.py \
              --baseline "$RUNNER_TEMP/bench-target-baseline/dev-release/lastdbd" \
              --candidate "$RUNNER_TEMP/bench-target-candidate/dev-release/lastdbd" \
              --baseline-revision "$BASELINE_SHA" \
              --candidate-revision "$CANDIDATE_SHA" \
              --profile "$BENCH_PROFILE" --output results

      - name: Publish benchmark summary
        if: always()
        env:
          MEASUREMENT_OUTCOME: ${{ job.status }}
        run: python3 candidate/scripts/benchmarks/report.py --output results --job-status "$MEASUREMENT_OUTCOME"

      - name: Upload measurements and build receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lastdb-benchmarks-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/
          retention-days: 14
          if-no-files-found: error
