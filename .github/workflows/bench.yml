name: Single mutation revision comparison

# Temporary CI runner for the requested historical comparison. Do not merge
# this workflow over the general benchmark workflow in PR #296.
on:
  workflow_dispatch:
    inputs:
      before:
        description: Complete baseline commit SHA
        default: 12fb0890b396e6adcbe62d1db257bbe814160239
        required: true
        type: string
      after:
        description: Complete simplified commit SHA
        default: fa83333bc31640c574827eda5685afea14aa95cc
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  compare:
    name: Single mutation latency, four alternating pairs
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: "4"
      CARGO_TERM_COLOR: always
      BEFORE_SHA: ${{ inputs.before }}
      AFTER_SHA: ${{ inputs.after }}
    steps:
      - name: Prepare external evidence directory
        run: |
          set -euo pipefail
          [[ "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$AFTER_SHA" =~ ^[0-9a-f]{40}$ ]]
          output="$RUNNER_TEMP/mutation-comparison-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$output"
          echo "BENCH_OUTPUT=$output" >> "$GITHUB_ENV"

      - name: Checkout benchmark driver
        uses: actions/checkout@v5
        with:
          path: driver
          persist-credentials: false

      - name: Checkout exact baseline
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.before }}
          path: before
          persist-credentials: false

      - name: Checkout exact simplified revision
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.after }}
          path: after
          persist-credentials: false

      - name: Reserve disk space for both optimized builds
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Select one Rust toolchain and check driver syntax
        working-directory: driver
        run: |
          set -euo pipefail
          toolchain="$(rustup show active-toolchain | cut -d ' ' -f 1)"
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/python-cache" python3 -m py_compile \
            docs/proofs/mutation-request-ioc-20261023/measure.py \
            docs/proofs/mutation-request-ioc-20261023/report.py
          command -v lsof || sudo apt-get install -y --no-install-recommends lsof

      - name: Cache dependency downloads only
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
          key: mutation-compare-downloads-${{ runner.os }}-${{ hashFiles('before/Cargo.lock', 'after/Cargo.lock') }}
          restore-keys: mutation-compare-downloads-${{ runner.os }}-

      - name: Build both exact revisions with separate fresh targets
        run: |
          set -euo pipefail
          rustc --version --verbose > "$BENCH_OUTPUT/toolchain.txt"
          for label in before after; do
            if [ "$label" = before ]; then revision="$BEFORE_SHA"; else revision="$AFTER_SHA"; fi
            (
              cd "$label"
              [ "$(git rev-parse HEAD)" = "$revision" ]
              export CARGO_TARGET_DIR="$RUNNER_TEMP/mutation-target-$label"
              export FOLDDB_BUILD_VERSION_OVERRIDE="bench-$revision"
              cargo build --locked --profile dev-release -p lastdb_node --bin lastdbd
              "$CARGO_TARGET_DIR/dev-release/lastdbd" --version | grep -F "bench-$revision"
            ) 2>&1 | tee "$BENCH_OUTPUT/build-$label.log"
          done

      - name: Measure the single mutation route on generated homes
        run: |
          set -euo pipefail
          export TMPDIR="$RUNNER_TEMP"
          scratch="$(mktemp -d "$TMPDIR/lastdb-ioc-bench.XXXXXX")"
          timeout --signal=TERM --kill-after=120s 25m \
            python3 driver/docs/proofs/mutation-request-ioc-20261023/measure.py \
              --before "$RUNNER_TEMP/mutation-target-before/dev-release/lastdbd" \
              --after "$RUNNER_TEMP/mutation-target-after/dev-release/lastdbd" \
              --scratch "$scratch" --output "$BENCH_OUTPUT" --rounds 4 \
            2>&1 | tee "$BENCH_OUTPUT/measurement.log"
          rmdir "$scratch"

      - name: Publish the latency comparison
        if: always()
        run: |
          python3 driver/docs/proofs/mutation-request-ioc-20261023/report.py \
            --output "$BENCH_OUTPUT" --before "$BEFORE_SHA" --after "$AFTER_SHA"

      - name: Upload raw evidence
        if: always()
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: mutation-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.BENCH_OUTPUT }}/
          retention-days: 14
          if-no-files-found: error

      - name: Verify the uploaded archive and retain its receipt
        if: ${{ always() && steps.upload.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ARTIFACT_SHA256: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > "$RUNNER_TEMP/mutation-artifact.json"
          python3 driver/docs/proofs/mutation-request-ioc-20261023/report.py \
            --output "$BENCH_OUTPUT" --before "$BEFORE_SHA" --after "$AFTER_SHA" \
            --artifact-metadata "$RUNNER_TEMP/mutation-artifact.json"
