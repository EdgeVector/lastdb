name: LastDB benchmarks

# Completion and upload are required for product changes. Speed changes are advisory.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: "27 9 * * *"

permissions:
  contents: read
  actions: read

concurrency:
  # Hosted PR runs supersede their own older attempt. No host measurement lock exists.
  group: lastdb-bench-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      required: ${{ steps.plan.outputs.required }}
      baseline: ${{ steps.plan.outputs.baseline }}
      candidate: ${{ steps.plan.outputs.candidate }}
      driver: ${{ steps.plan.outputs.driver }}
      reason: ${{ steps.plan.outputs.reason }}
    steps:
      # The event's merge tree contains the current driver even for an old PR head.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select exact product revisions and changed paths
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          args=()
          if [ "$EVENT_NAME" != pull_request ] && [ "$EVENT_NAME" != merge_group ]; then args+=(--always); fi
          python3 scripts/benchmarks/plan.py "${args[@]}" --output "$RUNNER_TEMP/benchmark-plan.json"

  benchmark:
    needs: plan
    if: needs.plan.outputs.required == 'true'
    uses: ./.github/workflows/bench-run.yml
    with:
      baseline: ${{ needs.plan.outputs.baseline }}
      candidate: ${{ needs.plan.outputs.candidate }}
      driver: ${{ needs.plan.outputs.driver }}
      profile: ${{ github.event_name == 'schedule' && 'nightly' || 'standard' }}
      investigation: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 317 }}
      legacy_cache_upgrade: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 363 }}
      ttl_active: ${{ github.event_name == 'pull_request' && github.head_ref == 'direct/lifecycle-age-marker-ttl-latency-20261025' }}

  benchmark-complete:
    name: benchmark-complete
    needs: [plan, benchmark]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require complete measurements and verified uploads for product changes
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          REQUIRED: ${{ needs.plan.outputs.required }}
          BENCHMARK_RESULT: ${{ needs.benchmark.result }}
          REASON: ${{ needs.plan.outputs.reason }}
        run: |
          set -euo pipefail
          [ "$PLAN_RESULT" = success ]
          case "$REQUIRED:$BENCHMARK_RESULT" in
            true:success) echo "Complete benchmark and verified uploads. Speed changes remain advisory." ;;
            false:skipped) echo "No product changes; measurements are unnecessary." ;;
            *) echo "::error::Required benchmark or upload did not complete: $BENCHMARK_RESULT"; exit 1 ;;
          esac
          echo "$REASON" >> "$GITHUB_STEP_SUMMARY"
