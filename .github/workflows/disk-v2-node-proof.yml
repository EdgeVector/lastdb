name: Disk v2 node proof

# Disk format v2, phase V3 (docs/design-lastdb-disk-size-20261024.md in the
# EdgeVector workspace). A real lastdbd starts on an empty home, which must be
# v2 from the first start, and writes a seed with the shape of the primary
# (scripts/disk_v2). The proof fails when the v2 node folder is above 2.0x of
# the logical atom bytes at any sample, or when a key list, a read, or the
# logical atoms of a seed schema change. The disk format v1 conversion cases
# went with disk format v1 (Tom, 2026-10-26: decision D1).
# The paths are the code that the node reads or writes with: the run homes,
# the at-rest envelopes and seals, the atom codec, and the node start that
# selects the home.
on:
  pull_request:
    paths:
      # Every laststore source file is disk format v2 code since D1.
      - 'vendor/laststore/src/**'
      - 'vendor/laststore/Cargo.toml'
      - 'fold_db/crates/core/src/storage/disk_pack/**'
      - 'fold_db/crates/core/src/storage/encrypting_*'
      - 'fold_db/crates/core/src/storage/encrypting_*/**'
      - 'fold_db/crates/core/src/atom/**'
      - 'fold_db/crates/model/src/atom/**'
      - 'fold_db/crates/core/src/crypto/**'
      - 'fold_db/crates/core/src/mini_cutover/**'
      - 'fold_db/crates/core/src/db_operations/atom_store/**'
      - 'lastdb_node/src/host/**'
      - 'scripts/disk_v2/**'
      - 'scripts/benchmarks/node.py'
      - '.github/workflows/disk-v2-node-proof.yml'
  workflow_dispatch:
  schedule:
    # Match the nightly benchmark schedule (UTC).
    - cron: "27 9 * * *"

permissions:
  contents: read

concurrency:
  # A newer PR update supersedes its run; nightly/manual runs stay independent.
  group: disk-v2-node-proof-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  proof:
    name: Disk v2 node proof (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 170
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CARGO_BUILD_JOBS: '3'
      CARGO_TERM_COLOR: never
      NO_COLOR: '1'
    steps:
      - name: Checkout the candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          persist-credentials: false
      - name: Check the proof script syntax
        run: python3 -m py_compile candidate/scripts/disk_v2/*.py candidate/scripts/benchmarks/node.py
      - name: Check the free disk space
        id: space
        shell: bash
        run: |
          set -euo pipefail
          df -h "$RUNNER_TEMP" /tmp
          echo "free=$(df -Pk "$RUNNER_TEMP" | awk 'NR == 2 {print int($4 / 1048576)}')" >> "$GITHUB_OUTPUT"
      # The build removes its target folder after the copy.
      - name: Reclaim disk space for the build
        if: runner.os == 'Linux' && steps.space.outputs.free < 40
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false
      - name: Build the candidate
        shell: bash
        working-directory: candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          rustc --version
          FOLDDB_BUILD_VERSION_OVERRIDE="bench-$CANDIDATE_SHA" CARGO_TARGET_DIR="$RUNNER_TEMP/target-candidate" \
            cargo build --locked --profile dev-release -p lastdb_node --bin lastdbd --bin lastdb
          mkdir -p "$RUNNER_TEMP/programs/candidate"
          cp "$RUNNER_TEMP/target-candidate/dev-release/lastdbd" "$RUNNER_TEMP/programs/candidate/lastdbd"
          cp "$RUNNER_TEMP/target-candidate/dev-release/lastdb" "$RUNNER_TEMP/programs/candidate/lastdb"
          rm -rf "$RUNNER_TEMP/target-candidate"
          "$RUNNER_TEMP/programs/candidate/lastdbd" --version
      - name: Run the node proof
        shell: bash
        timeout-minutes: 100
        run: |
          set -euo pipefail
          df -h "$RUNNER_TEMP" /tmp
          python3 candidate/scripts/disk_v2/node_proof.py \
            --candidate "$RUNNER_TEMP/programs/candidate/lastdbd" --candidate-revision "$CANDIDATE_SHA" \
            --output "$RUNNER_TEMP/disk-v2-node-proof" | tee "$RUNNER_TEMP/disk-v2-node-proof.md"
      - name: Publish the proof summary
        if: always()
        shell: bash
        run: |
          if [ -s "$RUNNER_TEMP/disk-v2-node-proof.md" ]; then
            cat "$RUNNER_TEMP/disk-v2-node-proof.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Interrupt a real CAS deletion and require normal reopen recovery
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          python3 candidate/scripts/disk_v2/cas_interrupt.py \
            --candidate "$RUNNER_TEMP/programs/candidate/lastdbd" --candidate-revision "$CANDIDATE_SHA" \
            --output "$RUNNER_TEMP/cas-delete-interruption" | tee "$RUNNER_TEMP/cas-delete-interruption.md"
          cat "$RUNNER_TEMP/cas-delete-interruption.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cas-delete-interruption-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cas-delete-interruption
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: disk-v2-node-proof-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/disk-v2-node-proof
          if-no-files-found: ignore
          retention-days: 14
