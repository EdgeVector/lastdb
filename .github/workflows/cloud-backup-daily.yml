name: Daily cloud recovery check

on:
  schedule:
    - cron: '23 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-backup-recovery-daily
  cancel-in-progress: false

# Unsigned mutation-log DEV load and snapshot roundtrip are retired.
# The DEV gate is signed-history-dev.yml (AcceptEntry + reference_relay).
jobs:
  signed_history:
    name: Signed-history DEV proofs
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/signed-history-dev.yml

  notify:
    name: Notify on failure
    needs: [signed_history]
    if: always() && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/notify-scheduled-failure.yml
    with:
      workflow_file: cloud-backup-daily.yml
      job_results: ${{ needs.signed_history.result }}
