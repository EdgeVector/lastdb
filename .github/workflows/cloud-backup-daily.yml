name: Daily cloud recovery check

on:
  schedule:
    - cron: '23 10 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: cloud-backup-recovery-daily-driver
  cancel-in-progress: false

jobs:
  recovery-freshness:
    name: Require a recent real DEV recovery
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Dispatch the existing main operation only when due
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cloud_backup/daily_driver.py
