name: Cloud backup client build

# One exact DEV client for the recovery and cleanup workflows. `client: build`
# compiles github.sha with the dev-release profile. `client: nightly` downloads
# the latest published nightly Linux client and does not compile. Callers that
# omit client keep the build. The job has no cloud credentials. Like every
# cloud backup job, it ends within 10 minutes; a slower build fails here
# instead of delaying the recovery result.
on:
  workflow_call:
    inputs:
      client:
        description: "build compiles github.sha; nightly downloads the latest published nightly"
        type: string
        required: false
        default: build
    outputs:
      version:
        description: The exact client version that the binaries report.
        value: ${{ jobs.build.outputs.version }}
      artifact:
        description: The name of this run's client package artifact.
        value: ${{ jobs.build.outputs.artifact }}

permissions:
  contents: read

jobs:
  build:
    name: ${{ inputs.client == 'nightly' && 'Download the published nightly client' || 'Build the exact DEV client' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact: ${{ steps.version.outputs.artifact }}
    env:
      CARGO_BUILD_JOBS: '4'
      CARGO_TERM_COLOR: never
      SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select the client
        id: version
        env:
          CLIENT: ${{ inputs.client }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$CLIENT" in
            build|nightly) ;;
            *) printf 'The client input must be build or nightly\n' >&2; exit 1 ;;
          esac
          if [ "$CLIENT" = "nightly" ]; then
            python3 scripts/release/published_client.py \
              --out-dir "$RUNNER_TEMP/cloud-backup-client" \
              > "$RUNNER_TEMP/published-client.txt"
            mapfile -t lines < "$RUNNER_TEMP/published-client.txt"
            test "${#lines[@]}" -eq 2
            version="${lines[0]#version=}"
            tarball="${lines[1]#tarball=}"
            test -n "$version"
            test "$version" != "${lines[0]}"
            test "$tarball" = "$RUNNER_TEMP/cloud-backup-client/lastdb-x86_64-unknown-linux-gnu.tar.gz"
            test -f "$tarball"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-nightly\.[0-9]{8}\.g[0-9a-f]{9}$ ]]
            cat "$RUNNER_TEMP/published-client.txt"
          else
            rustup show active-toolchain
            base="$(python3 -c 'import re,tomllib; v=tomllib.load(open("Cargo.toml","rb"))["workspace"]["package"]["version"].split("-")[0]; assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+",v); print(v)')"
            version="$base-nightly.$(date -u +%Y%m%d).g${SOURCE_COMMIT:0:9}"
            printf 'CARGO_TARGET_DIR=%s/cloud-backup-build\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          fi
          printf 'CLIENT_VERSION=%s\n' "$version" >> "$GITHUB_ENV"
          printf 'version=%s\nartifact=cloud-backup-client-%s-%s\n' \
            "$version" "$SOURCE_COMMIT" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2
        if: success() && inputs.client == 'build'
        with:
          shared-key: cloud-backup-recovery-linux
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the exact accepted client
        if: success() && inputs.client == 'build'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          FOLDDB_BUILD_VERSION_OVERRIDE="$CLIENT_VERSION" \
            cargo build --locked --profile dev-release -p lastdb_node --bin lastdb --bin lastdbd
      - name: Package the exact client
        if: success() && inputs.client == 'build'
        run: |
          set -euo pipefail
          python3 scripts/release/nightly_package.py \
            --target x86_64-unknown-linux-gnu \
            --bin-dir "$CARGO_TARGET_DIR/dev-release" \
            --out-dir "$RUNNER_TEMP/cloud-backup-client" \
            --git-oid "$SOURCE_COMMIT" --expect-version "$CLIENT_VERSION" \
            --source-epoch "$(git show -s --format=%ct HEAD)"
      - name: Retain the verified client package
        id: client-artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: ${{ runner.temp }}/cloud-backup-client
          if-no-files-found: error
          retention-days: 3
      - name: Record client provenance
        env:
          GH_TOKEN: ${{ github.token }}
          CLIENT: ${{ inputs.client }}
          ARTIFACT_ID: ${{ steps.client-artifact.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.client-artifact.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.client-artifact.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          metadata=
          for delay in 1 2 4 8 16; do
            if metadata="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" \
              --jq '[.id, .workflow_run.head_sha, .digest, .expired, .expires_at] | @tsv')"; then
              break
            fi
            sleep "$delay"
          done
          IFS=$'\t' read -r artifact_id artifact_source artifact_digest expired expiration <<< "$metadata"
          test "$artifact_id" = "$ARTIFACT_ID"
          test "$artifact_source" = "$SOURCE_COMMIT"
          test "${artifact_digest#sha256:}" = "${ARTIFACT_DIGEST#sha256:}"
          test "$expired" = false
          test -n "$expiration"
          {
            if [ "$CLIENT" = "nightly" ]; then
              printf '\nPublished nightly client: %s\n\n' "$CLIENT_VERSION"
            else
              printf '\nExact client source: %s\n\n' "$SOURCE_COMMIT"
            fi
            printf '[Client package](%s)\n\n' "$ARTIFACT_URL"
            printf 'Artifact ID: %s; ZIP SHA256: %s\n\n' "$ARTIFACT_ID" "$ARTIFACT_DIGEST"
            sha256sum "$RUNNER_TEMP/cloud-backup-client/lastdb-x86_64-unknown-linux-gnu.tar.gz"
            printf 'Artifact expires: %s\n' "$expiration"
            if [ "$CLIENT" = "nightly" ]; then
              printf '\nThe download uses no cloud credentials and makes no PROD or primary change.\n'
            else
              printf '\nThe build uses no cloud credentials and makes no PROD or primary change.\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
