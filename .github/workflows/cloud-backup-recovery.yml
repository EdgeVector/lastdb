name: Cloud backup recovery

# Real DEV operations: pinned recovery, automatic snapshot/log uploads, a saved
# policy across restart, a changed snapshot interval, and source-free recovery.
# The manual `baseline` mode cuts the fixed baseline once for each home format
# (scripts/cloud_backup/baseline.py), because a client restores only a
# snapshot of its own home format.
# A baseline run also points the two protected inputs at the new baseline.
# The manual fresh-v2 mode seeds a new source and proves its own Backup V2 chain.
# The manual shared-recovery mode uses a separate preadmitted two-device DEV
# scope. It never moves a V2 baseline or asks for cloud cleanup.
# Shared-readback reuses only a completed operation's exact published cut.
# Every job ends within 10 minutes. Cleanup runs in cloud-backup-cleanup.yml;
# this operation never waits for it and fails fast while a cleanup is active.
on:
  pull_request:
    paths:
      - '.github/workflows/cloud-backup-recovery.yml'
      - '.github/workflows/cloud-backup-build.yml'
      - '.github/workflows/cloud-backup-cleanup.yml'
      - 'scripts/cloud_backup/**'
      - 'scripts/release/nightly_package.py'
      - 'lastdb_node/**'
      - 'lastdb_host/**'
      - 'lastdb_identity/**'
      - 'lastdb_uds/**'
      - 'lastdb_storage_policy/**'
      - 'app_identity_crypto/**'
      - 'env_flag/**'
      - 'schema_service/crates/schema_types/**'
      - 'fold_db/crates/observability/**'
      - 'fold_db/crates/core/**'
      - '**/cloud_backup_protocol/**'
      - 'cloud_backup_client/**'
      - 'cloud_backup_plan/**'
      - 'vendor/laststore/**'
      - 'folddb_profile/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
  workflow_dispatch:
    inputs:
      mode:
        description: "recovery = full operation; fresh-v2 = generated source; baseline = format-specific baseline; writer-check = credential metadata; shared-recovery = new shared cut; shared-readback = verify a retained cut."
        type: choice
        options: [recovery, fresh-v2, baseline, writer-check, shared-recovery, shared-readback]
        default: recovery
      proof_run:
        description: "Earlier accepted-main shared recovery run ID, for shared-readback only."
        type: string
        required: false

permissions:
  contents: read

concurrency:
  # Accepted-main operations serialize. A PR never receives cloud credentials.
  group: cloud-backup-recovery-${{ github.event.pull_request.number || 'accepted-main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  recipe-syntax:
    name: Cloud recovery recipe syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Require accepted main for a manual cloud operation
        if: github.event_name == 'workflow_dispatch'
        env:
          SELECTED_REF: ${{ github.ref }}
        run: test "$SELECTED_REF" = refs/heads/main
      - name: Check the operational recipe syntax
        run: python3 -m py_compile scripts/cloud_backup/*.py

  ownership-readback:
    name: Read real CI ownership records
    needs: recipe-syntax
    if: github.event_name != 'workflow_dispatch' || (inputs.mode != 'shared-recovery' && inputs.mode != 'shared-readback')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify actual main ownership archives without cloud credentials
        env:
          GH_TOKEN: ${{ github.token }}
          LASTDB_CLOUD_DEV_BASELINE_SCOPE: ${{ vars.LASTDB_CLOUD_DEV_BASELINE_SCOPE }}
        run: python3 scripts/cloud_backup/inspect_history.py

  build-client:
    name: Build
    needs: recipe-syntax
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.mode != 'writer-check'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/cloud-backup-build.yml

  baseline-writer-check:
    name: Read protected baseline writer metadata
    needs: recipe-syntax
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.mode == 'writer-check'
    environment: cloud-backup-dev
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read credential metadata without a baseline or cloud operation
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: python3 scripts/cloud_backup/baseline_writer.py

  recover-dev:
    name: Automatic DEV backup and recovery
    needs: [recipe-syntax, build-client]
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && (inputs.mode == 'recovery' || inputs.mode == 'fresh-v2' || inputs.mode == 'baseline')
    environment: cloud-backup-dev
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    env:
      SOURCE_COMMIT: ${{ github.sha }}
      CLIENT_VERSION: ${{ needs.build-client.outputs.version }}
      # The daily driver dispatches recovery; a manual main run can move the baseline.
      RUN_MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require protected DEV inputs
        env:
          LASTDB_CLOUD_DEV_API_KEY: ${{ secrets.LASTDB_CLOUD_DEV_API_KEY }}
          LASTDB_CLOUD_DEV_RECOVERY_PHRASE: ${{ secrets.LASTDB_CLOUD_DEV_RECOVERY_PHRASE }}
          LASTDB_CLOUD_DEV_BASELINE: ${{ secrets.LASTDB_CLOUD_DEV_BASELINE }}
          LASTDB_CLOUD_DEV_BASELINE_SCOPE: ${{ vars.LASTDB_CLOUD_DEV_BASELINE_SCOPE }}
        run: |
          python3 -c 'import os; names=("LASTDB_CLOUD_DEV_API_KEY","LASTDB_CLOUD_DEV_RECOVERY_PHRASE","LASTDB_CLOUD_DEV_BASELINE","LASTDB_CLOUD_DEV_BASELINE_SCOPE"); missing=[n for n in names if not os.environ.get(n)]; raise SystemExit("Missing DEV inputs: "+", ".join(missing) if missing else 0)'
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build-client.outputs.artifact }}
          path: ${{ runner.temp }}/cloud-backup-client
      - name: Unpack the exact client
        run: |
          set -euo pipefail
          CLIENT_BIN_DIR="$RUNNER_TEMP/cloud-backup-bin"
          mkdir -m 700 "$CLIENT_BIN_DIR"
          tar -xzf "$RUNNER_TEMP/cloud-backup-client/lastdb-x86_64-unknown-linux-gnu.tar.gz" \
            -C "$CLIENT_BIN_DIR" lastdb lastdbd
          sha256sum "$RUNNER_TEMP/cloud-backup-client/lastdb-x86_64-unknown-linux-gnu.tar.gz"
          printf 'CLIENT_BIN_DIR=%s\n' "$CLIENT_BIN_DIR" >> "$GITHUB_ENV"
      - name: Admit this run without waiting for cleanup
        env:
          LASTDB_CLOUD_DEV_API_KEY: ${{ secrets.LASTDB_CLOUD_DEV_API_KEY }}
          LASTDB_CLOUD_DEV_BASELINE: ${{ secrets.LASTDB_CLOUD_DEV_BASELINE }}
          LASTDB_CLOUD_DEV_BASELINE_SCOPE: ${{ vars.LASTDB_CLOUD_DEV_BASELINE_SCOPE }}
        run: |
          python3 scripts/cloud_backup/preflight.py \
            --bin-dir "$CLIENT_BIN_DIR" \
            --source "$SOURCE_COMMIT" --version "$CLIENT_VERSION" \
            --output "$RUNNER_TEMP/cloud-ci-preflight"
      - name: Check protected-input credential before a baseline starts
        if: env.RUN_MODE == 'baseline'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: python3 scripts/cloud_backup/baseline_writer.py
      - name: Choose this run's new CI backup stream
        id: ci-start
        env:
          LASTDB_CLOUD_DEV_BASELINE_SCOPE: ${{ vars.LASTDB_CLOUD_DEV_BASELINE_SCOPE }}
        run: |
          python3 scripts/cloud_backup/prepare_start.py \
            --source "$SOURCE_COMMIT" --output "$RUNNER_TEMP/cloud-ci-start"
      - name: Retain CI ownership before the first upload
        id: ci-start-artifact
        uses: actions/upload-artifact@v7
        with:
          name: cloud-ci-start-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cloud-ci-start/ci-start.json
          if-no-files-found: error
          retention-days: 90
      - name: Admit this exact CI stream before the source starts
        env:
          GH_TOKEN: ${{ github.token }}
          LASTDB_CLOUD_DEV_API_KEY: ${{ secrets.LASTDB_CLOUD_DEV_API_KEY }}
          LASTDB_CLOUD_DEV_BASELINE: ${{ secrets.LASTDB_CLOUD_DEV_BASELINE }}
          LASTDB_CLOUD_DEV_BASELINE_SCOPE: ${{ vars.LASTDB_CLOUD_DEV_BASELINE_SCOPE }}
          ARTIFACT_ID: ${{ steps.ci-start-artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.ci-start-artifact.outputs.artifact-digest }}
        run: |
          python3 scripts/cloud_backup/register_ownership.py \
            --source "$SOURCE_COMMIT" --artifact-id "$ARTIFACT_ID" \
            --artifact-sha256 "$ARTIFACT_DIGEST" --phase startup \
            --startup-proof "$RUNNER_TEMP/cloud-ci-start-admission.json"
      - name: ${{ env.RUN_MODE == 'fresh-v2' && 'Run Backup V2 recovery from a fresh generated source' || 'Run automatic snapshots, mutation logs, restart and both recoveries' }}
        if: env.RUN_MODE == 'recovery' || env.RUN_MODE == 'fresh-v2'
        env:
          LASTDB_CLOUD_DEV_API_KEY: ${{ secrets.LASTDB_CLOUD_DEV_API_KEY }}
          LASTDB_CLOUD_DEV_RECOVERY_PHRASE: ${{ secrets.LASTDB_CLOUD_DEV_RECOVERY_PHRASE }}
          LASTDB_CLOUD_DEV_BASELINE: ${{ secrets.LASTDB_CLOUD_DEV_BASELINE }}
          LASTDB_CLOUD_DEV_BASELINE_SCOPE: ${{ vars.LASTDB_CLOUD_DEV_BASELINE_SCOPE }}
        run: |
          set -euo pipefail
          args=()
          if [ "$RUN_MODE" = fresh-v2 ]; then
            args+=(--fresh)
          fi
          python3 scripts/cloud_backup/recover.py \
            --bin-dir "$CLIENT_BIN_DIR" \
            --source "$SOURCE_COMMIT" --version "$CLIENT_VERSION" \
            --preflight "$RUNNER_TEMP/cloud-ci-preflight" \
            --startup-proof "$RUNNER_TEMP/cloud-ci-start-admission.json" \
            --startup-artifact "$RUNNER_TEMP/cloud-ci-start/ci-start.json" \
            --output "$RUNNER_TEMP/cloud-backup-recovery" "${args[@]}"
      - name: Retain successful CI stream ownership
        id: ci-stream-artifact
        if: env.RUN_MODE == 'recovery' || env.RUN_MODE == 'fresh-v2'
        uses: actions/upload-artifact@v7
        with:
          name: cloud-ci-stream-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cloud-backup-recovery/ci-stream.json
          if-no-files-found: error
          retention-days: 90
      - name: Record CI ownership provenance
        if: env.RUN_MODE == 'recovery' || env.RUN_MODE == 'fresh-v2'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.ci-stream-artifact.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.ci-stream-artifact.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.ci-stream-artifact.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          {
            printf '\n[Successful CI stream ownership](%s)\n\n' "$ARTIFACT_URL"
            printf 'Source: %s; artifact ID: %s; ZIP SHA256: %s\n\n' "$SOURCE_COMMIT" "$ARTIFACT_ID" "$ARTIFACT_DIGEST"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" \
              --jq '"Ownership artifact expires: " + .expires_at'
            printf '\nThis record identifies observed CI recovery points. It grants no provider deletion authority.\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Save durable CI ownership before this run ends
        if: env.RUN_MODE == 'recovery' || env.RUN_MODE == 'fresh-v2'
        env:
          GH_TOKEN: ${{ github.token }}
          LASTDB_CLOUD_DEV_API_KEY: ${{ secrets.LASTDB_CLOUD_DEV_API_KEY }}
          LASTDB_CLOUD_DEV_BASELINE: ${{ secrets.LASTDB_CLOUD_DEV_BASELINE }}
          LASTDB_CLOUD_DEV_BASELINE_SCOPE: ${{ vars.LASTDB_CLOUD_DEV_BASELINE_SCOPE }}
          ARTIFACT_ID: ${{ steps.ci-stream-artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.ci-stream-artifact.outputs.artifact-digest }}
        run: |
          python3 scripts/cloud_backup/register_ownership.py \
            --source "$SOURCE_COMMIT" --artifact-id "$ARTIFACT_ID" \
            --artifact-sha256 "$ARTIFACT_DIGEST"
      - name: Make, upload and restore a new fixed CI baseline
        if: env.RUN_MODE == 'baseline'
        env:
          LASTDB_CLOUD_DEV_API_KEY: ${{ secrets.LASTDB_CLOUD_DEV_API_KEY }}
          LASTDB_CLOUD_DEV_RECOVERY_PHRASE: ${{ secrets.LASTDB_CLOUD_DEV_RECOVERY_PHRASE }}
          LASTDB_CLOUD_DEV_BASELINE: ${{ secrets.LASTDB_CLOUD_DEV_BASELINE }}
          LASTDB_CLOUD_DEV_BASELINE_SCOPE: ${{ vars.LASTDB_CLOUD_DEV_BASELINE_SCOPE }}
        run: |
          set -euo pipefail
          python3 scripts/cloud_backup/baseline.py \
            --bin-dir "$CLIENT_BIN_DIR" \
            --source "$SOURCE_COMMIT" --version "$CLIENT_VERSION" \
            --preflight "$RUNNER_TEMP/cloud-ci-preflight" \
            --startup-proof "$RUNNER_TEMP/cloud-ci-start-admission.json" \
            --startup-artifact "$RUNNER_TEMP/cloud-ci-start/ci-start.json" \
            --output "$RUNNER_TEMP/cloud-ci-baseline"
      - name: Retain the new CI baseline receipt
        id: ci-baseline-artifact
        if: env.RUN_MODE == 'baseline'
        uses: actions/upload-artifact@v7
        with:
          name: cloud-ci-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cloud-ci-baseline/ci-baseline.json
          if-no-files-found: error
          retention-days: 90
      - name: Move the service CI baseline and keep the replaced one
        if: env.RUN_MODE == 'baseline'
        env:
          GH_TOKEN: ${{ github.token }}
          LASTDB_CLOUD_DEV_API_KEY: ${{ secrets.LASTDB_CLOUD_DEV_API_KEY }}
          LASTDB_CLOUD_DEV_BASELINE: ${{ secrets.LASTDB_CLOUD_DEV_BASELINE }}
          LASTDB_CLOUD_DEV_BASELINE_SCOPE: ${{ vars.LASTDB_CLOUD_DEV_BASELINE_SCOPE }}
          ARTIFACT_ID: ${{ steps.ci-baseline-artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.ci-baseline-artifact.outputs.artifact-digest }}
        run: |
          python3 scripts/cloud_backup/register_ownership.py \
            --source "$SOURCE_COMMIT" --artifact-id "$ARTIFACT_ID" \
            --artifact-sha256 "$ARTIFACT_DIGEST" --phase baseline
      # Without this step every later recovery fails its start claim, because the
      # protected inputs still name the replaced baseline.
      - name: Point the protected inputs at the new CI baseline
        if: env.RUN_MODE == 'baseline'
        env:
          # GITHUB_TOKEN cannot write Actions secrets or variables.
          GH_TOKEN: ${{ secrets.GH_PAT }}
          LASTDB_CLOUD_DEV_RECOVERY_PHRASE: ${{ secrets.LASTDB_CLOUD_DEV_RECOVERY_PHRASE }}
        run: |
          python3 scripts/cloud_backup/baseline_inputs.py \
            --receipt "$RUNNER_TEMP/cloud-ci-baseline/ci-baseline.json" \
            --summary "$RUNNER_TEMP/cloud-ci-baseline/summary.json"

  recover-shared-dev:
    name: Shared DEV snapshot and recovery
    needs: [recipe-syntax, build-client]
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && (inputs.mode == 'shared-recovery' || inputs.mode == 'shared-readback')
    environment: cloud-backup-dev
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    env:
      SOURCE_COMMIT: ${{ github.sha }}
      CLIENT_VERSION: ${{ needs.build-client.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build-client.outputs.artifact }}
          path: ${{ runner.temp }}/cloud-backup-client
      - name: Unpack the exact client
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          CLIENT_BIN_DIR="$RUNNER_TEMP/cloud-backup-bin"
          mkdir -m 700 "$CLIENT_BIN_DIR"
          tar -xzf "$RUNNER_TEMP/cloud-backup-client/lastdb-x86_64-unknown-linux-gnu.tar.gz" \
            -C "$CLIENT_BIN_DIR" lastdb lastdbd
          sha256sum "$RUNNER_TEMP/cloud-backup-client/lastdb-x86_64-unknown-linux-gnu.tar.gz"
          printf 'CLIENT_BIN_DIR=%s\n' "$CLIENT_BIN_DIR" >> "$GITHUB_ENV"
      - name: Bind the earlier accepted-main operation
        if: inputs.mode == 'shared-readback'
        id: prior
        env:
          GH_TOKEN: ${{ github.token }}
          PRIOR_RUN: ${{ inputs.proof_run }}
        run: |
          set -euo pipefail
          [[ "$PRIOR_RUN" =~ ^[1-9][0-9]{0,19}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRIOR_RUN" > "$RUNNER_TEMP/cloud-shared-prior.json"
          prior_source="$(jq -er --arg run "$PRIOR_RUN" '
            select((.id | tostring) == $run and .head_branch == "main" and .event == "workflow_dispatch"
              and .status == "completed" and .run_attempt == 1
              and .path == ".github/workflows/cloud-backup-recovery.yml")
            | .head_sha | select(test("^[0-9a-f]{40}$"))
          ' "$RUNNER_TEMP/cloud-shared-prior.json")"
          printf 'source=%s\n' "$prior_source" >> "$GITHUB_OUTPUT"
      - name: Download the exact retained shared recovery summary
        if: inputs.mode == 'shared-readback'
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.proof_run }}
          name: cloud-shared-recovery-${{ inputs.proof_run }}-1
          path: ${{ runner.temp }}/cloud-shared-prior
          digest-mismatch: error
      - name: Run the selected shared recovery operation
        env:
          RUN_MODE: ${{ inputs.mode }}
          PRIOR_RUN: ${{ inputs.proof_run }}
          PRIOR_SOURCE: ${{ steps.prior.outputs.source }}
          LASTDB_CLOUD_DEV_API_KEY: ${{ secrets.LASTDB_CLOUD_DEV_API_KEY }}
          LASTDB_CLOUD_DEV_RECOVERY_PHRASE: ${{ secrets.LASTDB_CLOUD_DEV_RECOVERY_PHRASE }}
          LASTDB_CLOUD_DEV_SHARED_SCOPE: ${{ vars.LASTDB_CLOUD_DEV_SHARED_SCOPE }}
          LASTDB_CLOUD_DEV_SHARED_DEVICE_SEEDS: ${{ secrets.LASTDB_CLOUD_DEV_SHARED_DEVICE_SEEDS }}
        run: |
          set -euo pipefail
          args=()
          if [[ "$RUN_MODE" == shared-readback ]]; then
            test -n "$PRIOR_SOURCE"
            prior="$RUNNER_TEMP/cloud-shared-prior/summary.json"
            chmod 600 "$prior"
            args+=(--prior-summary "$prior" --prior-run "$PRIOR_RUN" --prior-source "$PRIOR_SOURCE")
          else
            test -z "$PRIOR_RUN"
          fi
          python3 scripts/cloud_backup/shared_recovery.py \
            --bin-dir "$CLIENT_BIN_DIR" \
            --source "$SOURCE_COMMIT" --version "$CLIENT_VERSION" \
            --output "$RUNNER_TEMP/cloud-shared-recovery" "${args[@]}"
      - name: Retain the value-free shared recovery summary
        if: always()
        id: shared-receipt
        uses: actions/upload-artifact@v7
        with:
          name: cloud-shared-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cloud-shared-recovery/summary.json
          if-no-files-found: warn
          retention-days: 90
      - name: Record summary artifact provenance
        if: always() && steps.shared-receipt.outputs.artifact-id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.shared-receipt.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.shared-receipt.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.shared-receipt.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          {
            printf '\n[Shared recovery summary](%s)\n\n' "$ARTIFACT_URL"
            printf 'Source: %s; artifact ID: %s; ZIP SHA256: %s\n\n' "$SOURCE_COMMIT" "$ARTIFACT_ID" "$ARTIFACT_DIGEST"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" \
              --jq '"Shared recovery artifact expires: " + .expires_at'
          } >> "$GITHUB_STEP_SUMMARY"
