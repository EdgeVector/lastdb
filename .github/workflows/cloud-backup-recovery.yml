name: Cloud backup recovery

# Signed Files transfer and Social sharing on an accepted main dispatch.
# Pull requests only check recipe syntax. They never receive cloud credentials.
on:
  pull_request:
    paths:
      - '.github/workflows/cloud-backup-recovery.yml'
      - '.github/workflows/cloud-backup-build.yml'
      - 'scripts/cloud_backup/**'
      - 'apps/social/**'
      - 'lastdb_app_sdk/**'
      - 'lastdb-app.json'
      - 'scripts/release/nightly_package.py'
      - 'lastdb_node/**'
      - 'app_identity_crypto/**'
      - 'schema_service/crates/schema_types/**'
      - 'fold_db/crates/observability/**'
      - 'fold_db/crates/model/**'
      - 'fold_db/crates/core/**'
      - '**/cloud_backup_protocol/**'
      - 'vendor/laststore/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
  workflow_dispatch:
    inputs:
      mode:
        description: "Run a DEV operation or prepare a Social registry declaration"
        type: choice
        options: [signed-files, social-share, social-prepare]
        default: signed-files
      social_install_revision:
        description: "For social-share, optionally install this exact signed DEV Social source before the operation"
        type: string

permissions:
  contents: read

concurrency:
  # Accepted-main operations serialize. A PR never receives cloud credentials.
  group: cloud-backup-recovery-${{ github.event.pull_request.number || 'accepted-main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  recipe-syntax:
    name: Cloud recovery recipe syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Require accepted main for a manual cloud operation
        if: github.event_name == 'workflow_dispatch'
        env:
          SELECTED_REF: ${{ github.ref }}
        run: |
          test "$SELECTED_REF" = refs/heads/main
      - name: Check the operational recipe syntax
        run: |
          python3 -m py_compile scripts/cloud_backup/*.py apps/social/*.py apps/social/social
          python3 -m json.tool lastdb-app.json > /dev/null
          node --check apps/social/web/app.js
          node --check scripts/cloud_backup/social_sdk.mjs

  build-client:
    name: Build
    needs: recipe-syntax
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/cloud-backup-build.yml

  signed-files:
    name: Signed sharing in DEV
    needs: [recipe-syntax, build-client]
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    environment: cloud-backup-dev
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build-client.outputs.artifact }}
          path: ${{ runner.temp }}/cloud-backup-client
      - name: Build the Social SDK for the DEV operation
        if: inputs.mode == 'social-share'
        working-directory: lastdb_app_sdk
        run: |
          npm ci
          npm run build
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
          mkdir -m 700 "$RUNNER_TEMP/social-sdk"
          tar -xzf "$RUNNER_TEMP"/lastdb-app-sdk-*.tgz -C "$RUNNER_TEMP/social-sdk"
          cp ../scripts/cloud_backup/social_sdk.mjs "$RUNNER_TEMP/social-sdk/exercise.mjs"
          printf 'SOCIAL_SDK_OPERATION=%s/social-sdk/exercise.mjs\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Retain the SDK package for app developers
        if: inputs.mode == 'social-share'
        id: social-sdk
        uses: actions/upload-artifact@v7
        with:
          name: social-sdk-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lastdb-app-sdk-*.tgz
          if-no-files-found: error
          retention-days: 14
      - name: Record SDK package provenance
        if: inputs.mode == 'social-share'
        env:
          GH_TOKEN: ${{ github.token }}
          SDK_ARTIFACT_ID: ${{ steps.social-sdk.outputs.artifact-id }}
          SDK_ARTIFACT_URL: ${{ steps.social-sdk.outputs.artifact-url }}
          SDK_ARTIFACT_DIGEST: ${{ steps.social-sdk.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          metadata="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SDK_ARTIFACT_ID" \
            --jq '[.workflow_run.head_sha, .digest, .expired, .expires_at] | @tsv')"
          IFS=$'\t' read -r source digest expired expiration <<< "$metadata"
          test "$source" = "$GITHUB_SHA"
          test "${digest#sha256:}" = "${SDK_ARTIFACT_DIGEST#sha256:}"
          test "$expired" = false
          test -n "$expiration"
          {
            printf 'SDK package source: %s\n\n' "$GITHUB_SHA"
            printf '[Download SDK package](%s)\n\n' "$SDK_ARTIFACT_URL"
            printf 'Archive SHA-256: %s. Expires: %s.\n' "$SDK_ARTIFACT_DIGEST" "$expiration"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Exercise the selected DEV product operation
        env:
          CLIENT_VERSION: ${{ needs.build-client.outputs.version }}
          OPERATION: ${{ inputs.mode }}
          SOCIAL_INSTALL_REVISION: ${{ inputs.social_install_revision }}
          LASTDB_CLOUD_DEV_API_KEY: ${{ inputs.mode != 'social-prepare' && secrets.LASTDB_CLOUD_DEV_API_KEY || '' }}
          LASTDB_CLOUD_DEV_RECOVERY_PHRASE: ${{ inputs.mode != 'social-prepare' && secrets.LASTDB_CLOUD_DEV_RECOVERY_PHRASE || '' }}
        run: |
          set -euo pipefail
          client_bin_dir="$RUNNER_TEMP/cloud-backup-bin"
          mkdir -m 700 "$client_bin_dir"
          tar -xzf "$RUNNER_TEMP/cloud-backup-client/lastdb-x86_64-unknown-linux-gnu.tar.gz" \
            -C "$client_bin_dir" lastdb lastdbd
          case "$OPERATION" in
            signed-files) recipe=signed_files ;;
            social-share) recipe=social_share ;;
            social-prepare) recipe=social_prepare ;;
            *) exit 2 ;;
          esac
          python3 "scripts/cloud_backup/$recipe.py" \
            --bin-dir "$client_bin_dir" --version "$CLIENT_VERSION"
