name: Cloud backup recovery

# Signed Files transfer and Social sharing on an accepted main dispatch.
# Pull requests only check recipe syntax. They never receive cloud credentials.
on:
  pull_request:
    paths:
      - '.github/workflows/cloud-backup-recovery.yml'
      - '.github/workflows/cloud-backup-build.yml'
      - 'scripts/cloud_backup/**'
      - 'apps/social/**'
      - 'lastdb-app.json'
      - 'scripts/release/nightly_package.py'
      - 'lastdb_node/**'
      - 'app_identity_crypto/**'
      - 'schema_service/crates/schema_types/**'
      - 'fold_db/crates/observability/**'
      - 'fold_db/crates/model/**'
      - 'fold_db/crates/core/**'
      - '**/cloud_backup_protocol/**'
      - 'vendor/laststore/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
  workflow_dispatch:
    inputs:
      mode:
        description: "Run a DEV operation or prepare a Social registry declaration"
        type: choice
        options: [signed-files, social-share, social-prepare]
        default: signed-files
      social_install_revision:
        description: "For social-share, optionally install this exact signed DEV Social source before the operation"
        type: string

permissions:
  contents: read

concurrency:
  # Accepted-main operations serialize. A PR never receives cloud credentials.
  group: cloud-backup-recovery-${{ github.event.pull_request.number || 'accepted-main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  recipe-syntax:
    name: Cloud recovery recipe syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Require accepted main for a manual cloud operation
        if: github.event_name == 'workflow_dispatch'
        env:
          SELECTED_REF: ${{ github.ref }}
        run: |
          test "$SELECTED_REF" = refs/heads/main
      - name: Check the operational recipe syntax
        run: |
          python3 -m py_compile scripts/cloud_backup/*.py apps/social/*.py apps/social/social
          python3 -m json.tool lastdb-app.json > /dev/null
          node --check apps/social/web/app.js

  build-client:
    name: Build
    needs: recipe-syntax
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/cloud-backup-build.yml

  signed-files:
    name: Signed sharing in DEV
    needs: [recipe-syntax, build-client]
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    environment: cloud-backup-dev
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build-client.outputs.artifact }}
          path: ${{ runner.temp }}/cloud-backup-client
      - name: Exercise the selected DEV product operation
        env:
          CLIENT_VERSION: ${{ needs.build-client.outputs.version }}
          OPERATION: ${{ inputs.mode }}
          SOCIAL_INSTALL_REVISION: ${{ inputs.social_install_revision }}
          LASTDB_CLOUD_DEV_API_KEY: ${{ inputs.mode != 'social-prepare' && secrets.LASTDB_CLOUD_DEV_API_KEY || '' }}
          LASTDB_CLOUD_DEV_RECOVERY_PHRASE: ${{ inputs.mode != 'social-prepare' && secrets.LASTDB_CLOUD_DEV_RECOVERY_PHRASE || '' }}
        run: |
          set -euo pipefail
          client_bin_dir="$RUNNER_TEMP/cloud-backup-bin"
          mkdir -m 700 "$client_bin_dir"
          tar -xzf "$RUNNER_TEMP/cloud-backup-client/lastdb-x86_64-unknown-linux-gnu.tar.gz" \
            -C "$client_bin_dir" lastdb lastdbd
          case "$OPERATION" in
            signed-files) recipe=signed_files ;;
            social-share) recipe=social_share ;;
            social-prepare) recipe=social_prepare ;;
            *) exit 2 ;;
          esac
          python3 "scripts/cloud_backup/$recipe.py" \
            --bin-dir "$client_bin_dir" --version "$CLIENT_VERSION"
