name: PR 363 one-time mixed cleanup
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  actions: read
jobs:
  cleanup:
    if: github.head_ref == 'kanban/retry-cleanup-drill-20261024'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: "4"
      BASELINE: 73129f0e5eadbd5ce294fc276f7089e02844be3a
      CANDIDATE: de19714be2ac3d4d4e4f304727f34c74f8641742
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: driver
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.CANDIDATE }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.BASELINE }}
          path: baseline
          persist-credentials: false
      - name: Check temporary driver syntax
        run: python3 -m py_compile driver/tools/one-time/retry_cleanup.py
      - name: Reserve room for two independent build targets
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false
      - name: Build the exact old and new daemons
        run: |
          set -euo pipefail
          cd baseline
          CARGO_TARGET_DIR="$RUNNER_TEMP/cleanup-baseline" FOLDDB_BUILD_VERSION_OVERRIDE="bench-$BASELINE" cargo build --locked --profile dev-release -p lastdb_node --bin lastdbd
          cp "$RUNNER_TEMP/cleanup-baseline/dev-release/lastdbd" "$RUNNER_TEMP/baseline-lastdbd"
          cd ../source
          CARGO_TARGET_DIR="$RUNNER_TEMP/cleanup-candidate" FOLDDB_BUILD_VERSION_OVERRIDE="bench-$CANDIDATE" cargo build --locked --profile dev-release -p lastdb_node --bin lastdbd
          cp "$RUNNER_TEMP/cleanup-candidate/dev-release/lastdbd" "$RUNNER_TEMP/candidate-lastdbd"
      - name: Build the temporary offline metadata helper
        run: |
          set -euo pipefail
          mkdir -p source/lastdb_node/examples
          cp driver/tools/one-time/retry_cleanup.rs source/lastdb_node/examples/retry_cleanup_once.rs
          printf '\n[[example]]\nname = "retry_cleanup_once"\ntest = false\nbench = false\n' >> source/lastdb_node/Cargo.toml
          cd source
          CARGO_TARGET_DIR="$RUNNER_TEMP/cleanup-candidate" FOLDDB_BUILD_VERSION_OVERRIDE="bench-$CANDIDATE" cargo build --locked --profile dev-release -p lastdb_node --example retry_cleanup_once
      - name: Run the authorized one-time cleanup operation
        run: |
          timeout --signal=TERM --kill-after=90s 15m python3 driver/tools/one-time/retry_cleanup.py \
            --baseline "$RUNNER_TEMP/baseline-lastdbd" --baseline-revision "$BASELINE" \
            --candidate "$RUNNER_TEMP/candidate-lastdbd" --candidate-revision "$CANDIDATE" \
            --helper "$RUNNER_TEMP/cleanup-candidate/dev-release/examples/retry_cleanup_once" \
            --output "$RUNNER_TEMP/mixed-cleanup"
      - uses: actions/upload-artifact@v4
        if: always()
        id: upload
        with:
          name: pr363-mixed-cleanup-${{ github.run_id }}
          path: ${{ runner.temp }}/mixed-cleanup
          retention-days: 14
          if-no-files-found: error
      - name: Verify the uploaded evidence
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ARTIFACT_SHA256: ${{ steps.upload.outputs.artifact-digest }}
          CANDIDATE_SHA: ${{ env.CANDIDATE }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > "$RUNNER_TEMP/mixed-metadata.json"
          python3 driver/scripts/benchmarks/artifact.py --metadata "$RUNNER_TEMP/mixed-metadata.json" --output "$RUNNER_TEMP/mixed-receipt"
