name: Disk run proof

# Disk format v2, phases V1, V2, and V2b (docs/design-lastdb-disk-size-20261024.md in the
# EdgeVector workspace). Tom approved the plan on 2026-10-24: "Prove it works
# and then I want to use it." The proof writes a synthetic seed through
# laststore::disk_run, reads it back, and fails over 2x the logical bytes.
# The V2b step runs the node store (fold_db disk_pack) on a synthetic v2 home.
# The V4 step converts a synthetic v1 node home to v2 and checks each record.
on:
  pull_request:
    paths:
      - 'vendor/laststore/src/disk_run/**'
      - 'vendor/laststore/src/frame.rs'
      - 'vendor/laststore/examples/disk_run_proof/**'
      - 'vendor/laststore/examples/run_home_proof/**'
      - 'vendor/laststore/Cargo.toml'
      - 'fold_db/crates/core/src/storage/disk_pack/**'
      - 'fold_db/crates/core/examples/disk_v2_node_proof.rs'
      - 'fold_db/crates/core/examples/disk_v2_convert_proof.rs'
      - '.github/workflows/disk-run-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: disk-run-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    name: Disk run proof (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      CARGO_BUILD_JOBS: '3'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Lint and run the disk run proof
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked -p laststore --example disk_run_proof -- -D warnings
          cargo run --locked --release -p laststore --example disk_run_proof \
            | tee "$RUNNER_TEMP/disk-run-proof.txt"
          {
            echo '## Disk run proof'
            echo "Source: $(git rev-parse HEAD)"
            cat "$RUNNER_TEMP/disk-run-proof.txt"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Lint and run the run home proof
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked -p laststore --example run_home_proof -- -D warnings
          cargo run --locked --release -p laststore --example run_home_proof \
            | tee "$RUNNER_TEMP/run-home-proof.txt"
          {
            echo '## Run home proof (V2)'
            echo "Source: $(git rev-parse HEAD)"
            cat "$RUNNER_TEMP/run-home-proof.txt"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Lint and run the node store proof (V2b)
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked -p fold_db --example disk_v2_node_proof -- -D warnings
          cargo run --locked --release -p fold_db --example disk_v2_node_proof \
            | tee "$RUNNER_TEMP/node-v2-proof.txt"
          {
            echo '## Node store proof (V2b)'
            echo "Source: $(git rev-parse HEAD)"
            cat "$RUNNER_TEMP/node-v2-proof.txt"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Lint and run the conversion proof (V4)
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked -p fold_db --example disk_v2_convert_proof -- -D warnings
          cargo run --locked --release -p fold_db --example disk_v2_convert_proof \
            | tee "$RUNNER_TEMP/convert-v2-proof.txt"
          {
            echo '## Conversion proof (V4)'
            echo "Source: $(git rev-parse HEAD)"
            cat "$RUNNER_TEMP/convert-v2-proof.txt"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: disk-run-proof-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/disk-run-proof.txt
            ${{ runner.temp }}/run-home-proof.txt
            ${{ runner.temp }}/node-v2-proof.txt
            ${{ runner.temp }}/convert-v2-proof.txt
          if-no-files-found: ignore
          retention-days: 14
