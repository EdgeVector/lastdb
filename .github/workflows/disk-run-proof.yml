name: Disk run proof

# Disk format v2 on synthetic data. Tom approved the plan on 2026-10-24:
# "Prove it works and then I want to use it." The run home proof drives
# laststore::disk_run::home, and the node store proof runs fold_db disk_pack
# on a synthetic home. Neither opens a real LastDB home.
on:
  pull_request:
    paths:
      # Every laststore source file is disk format v2 code since D1.
      - 'vendor/laststore/src/**'
      - 'vendor/laststore/examples/run_home_proof/**'
      - 'vendor/laststore/Cargo.toml'
      - 'fold_db/crates/core/src/storage/disk_pack/**'
      - 'fold_db/crates/core/examples/disk_v2_node_proof.rs'
      - 'fold_db/crates/core/examples/disk_v2_node_proof/**'
      - '.github/workflows/disk-run-proof.yml'
  workflow_dispatch:
  schedule:
    # Match the nightly benchmark and node cleanup schedule (UTC).
    - cron: "27 9 * * *"

permissions:
  contents: read

concurrency:
  # A newer PR update supersedes its run; nightly/manual runs stay independent.
  group: disk-run-proof-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  proof:
    name: Disk run proof (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      CARGO_BUILD_JOBS: '3'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Lint and run the run home proof
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked -p laststore --example run_home_proof -- -D warnings
          cargo run --locked --release -p laststore --example run_home_proof \
            | tee "$RUNNER_TEMP/run-home-proof.txt"
          {
            echo '## Run home proof (V2)'
            echo "Source: $(git rev-parse HEAD)"
            cat "$RUNNER_TEMP/run-home-proof.txt"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Lint and run the node store proof (V2b)
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked -p fold_db --example disk_v2_node_proof -- -D warnings
          cargo run --locked --release -p fold_db --example disk_v2_node_proof \
            | tee "$RUNNER_TEMP/node-v2-proof.txt"
          {
            echo '## Node store proof (V2b)'
            echo "Source: $(git rev-parse HEAD)"
            cat "$RUNNER_TEMP/node-v2-proof.txt"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: disk-run-proof-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/run-home-proof.txt
            ${{ runner.temp }}/node-v2-proof.txt
          if-no-files-found: ignore
          retention-days: 14
