name: Disk cloud contract spike

# Spike only. This workflow is not a required check and it is not on main.
# It pins a synthetic format 12 home and derives a cloud plan. It does not
# upload to R2 or B2 and it does not open a real LastDB home.
on:
  pull_request:
    paths:
      - 'fold_db/crates/core/src/storage/format.rs'
      - 'fold_db/crates/core/src/storage/format/export.rs'
      - 'fold_db/crates/core/src/storage/mod.rs'
      - 'fold_db/crates/core/src/storage/cloud_contract.rs'
      - 'fold_db/crates/core/src/storage/disk_contract.rs'
      - 'fold_db/crates/core/src/storage/disk_pack/mod.rs'
      - 'fold_db/crates/core/src/storage/disk_pack/contract_pin.rs'
      - 'fold_db/crates/core/examples/disk_cloud_contract_spike.rs'
      - '.github/workflows/disk-cloud-contract-spike.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: disk-cloud-contract-spike-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  spike:
    name: Derive cloud plan
    if: github.repository == 'EdgeVector/lastdb'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_BUILD_JOBS: "3"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Lint and run the disk-to-cloud contract spike
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked -p fold_db --example disk_cloud_contract_spike -- -D warnings
          cargo run --locked -p fold_db --example disk_cloud_contract_spike \
            | tee "$RUNNER_TEMP/disk-cloud-contract-spike.txt"
          {
            echo '## Disk-to-cloud contract spike'
            echo "Source: $(git rev-parse HEAD)"
            cat "$RUNNER_TEMP/disk-cloud-contract-spike.txt"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: disk-cloud-contract-spike-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/disk-cloud-contract-spike.txt
          if-no-files-found: ignore
          retention-days: 14
