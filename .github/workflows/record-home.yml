name: Record home product proof

# Required on every PR, main push and manual CI run, including docs-only changes.
# Share/Files operations run against fresh generated homes without cloud secrets.
# Authenticated multi-device sync and restore have their own accepted-main DEV lane.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: record-home-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  records:
    name: Fresh home records
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      FOLDDB_BUILD_VERSION_OVERRIDE: bench-${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: schema-node-operations-debug
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the product in CI
        run: cargo build --locked -p lastdb_node --bin lastdb --bin lastdbd
      - name: Exercise encrypted Share invitations and local acceptance
        run: cargo test --locked -p lastdb_node --test share_invitation_ci
      - name: Exercise the actual daemon on a fresh generated home
        run: |
          set -euo pipefail
          python3 scripts/operations/record_home.py --daemon "$PWD/target/debug/lastdbd" \
            --cli "$PWD/target/debug/lastdb" \
            --revision "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/record-home" 2>&1 | tee "$RUNNER_TEMP/record-home.log"
      - uses: actions/upload-artifact@v7
        id: evidence
        if: always()
        with:
          name: record-home-${{ github.sha }}
          path: |
            ${{ runner.temp }}/record-home
            ${{ runner.temp }}/record-home.log
          retention-days: 7
          if-no-files-found: error
      - name: Publish the result
        if: always()
        env:
          RESULT: ${{ job.status }}
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact-digest }}
        run: |
          {
            echo "## Record home product proof"
            echo "Source: $GITHUB_SHA"
            echo "Result: $RESULT"
            echo "Fresh generated home only. No primary access, local build, or benchmark."
            echo "Share scope: real encrypted invitation roundtrip, recipient/publisher/tamper/expiry refusals, local acceptance and persistence, aliases, repeated acceptance and key conflicts."
            echo "Daemon scope: local setup, write modes, contributor policy refusals, database addressing, and Files import, list and save."
            echo "Cloud app publication/invitation/recovery is not exercised here; native multiwriter sync is a separate accepted-main DEV check."
            echo "Artifact: $ARTIFACT_URL"
            echo "Artifact SHA256: $ARTIFACT_DIGEST"
            echo "Expiration: 7 days after this run."
          } >> "$GITHUB_STEP_SUMMARY"

  report:
    name: Record home proof result
    needs:
      - records
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require executed Share and record operations
        env:
          RECORDS: ${{ needs.records.result }}
        run: |
          set -euo pipefail
          echo "Records and Share operations: $RECORDS"
          if [ "$RECORDS" != success ]; then
            echo "::error::The mandatory fresh-home Share and record operations did not pass"
            exit 1
          fi
          echo "Fresh-home Share and record operations passed for $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
