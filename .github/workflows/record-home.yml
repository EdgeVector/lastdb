name: Record home product proof

# ci-required calls this workflow. A product diff runs the fresh-home proof
# in the current format.
# Any other pull request or main push skips that build and still reports success.
on:
  workflow_call:
    inputs:
      base_sha:
        description: Base SHA. A pull request passes its base. A main push passes the previous commit.
        type: string
        default: ""
      head_sha:
        description: Head SHA. A pull request passes its head. A main push passes the new commit.
        type: string
        default: ""
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: record-home-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  select:
    name: Select record home proof
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.plan.outputs.run }}
      copy_v12: ${{ steps.plan.outputs.copy_v12 }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run the proof only for a product diff
        id: plan
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ inputs.base_sha || github.event.pull_request.base.sha }}
          HEAD: ${{ inputs.head_sha || github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          run=true
          copy_v12=true
          if [ "$EVENT" = "pull_request" ] || [ "$EVENT" = "push" ]; then
            if [ -z "$BASE" ] || [ -z "$HEAD" ] || [[ "$BASE" =~ ^0+$ ]] || [[ "$HEAD" =~ ^0+$ ]]; then
              echo "SHAs were not passed; run the proof"
            else
              merge_base="$(git merge-base "$BASE" "$HEAD" 2>/dev/null || true)"
              if [ -z "$merge_base" ]; then
                echo "merge-base failed; run the proof"
              else
                run=false
                copy_v12=false
                while IFS= read -r path; do
                  [ -z "$path" ] && continue
                  case "$path" in
                    fold_db/*|lastdb_node/*|lastdb_host/*|lastdb_uds/*|schema_service/crates/schema_types/*|scripts/operations/record_requests.py|scripts/benchmarks/node.py|scripts/benchmarks/record_protocol.py|scripts/benchmarks/home_format.py|scripts/operations/record_home.py|scripts/operations/record_runs.py|scripts/operations/record_drop_tracking.py|scripts/operations/record_home_copy.py|.github/workflows/record-home.yml)
                      run=true
                      ;;
                  esac
                  case "$path" in
                    fold_db/crates/core/src/storage/format.rs|fold_db/crates/model/src/record_value.rs|\
                    lastdb_host/src/handlers/query/response.rs|lastdb_host/src/handlers/mutation.rs|\
                    lastdb_node/src/exec/file_blob*.rs|lastdb_node/src/exec/schema_routes.rs|\
                    lastdb_node/src/exec/app_routes.rs|lastdb_node/src/exec/app_routes/*.rs|\
                    lastdb_node/src/exec/db_maintenance/schema_maps.rs|\
                    scripts/operations/record_home.py|scripts/operations/record_home_copy.py|\
                    scripts/operations/record_requests.py|\
                    scripts/benchmarks/node.py|scripts/benchmarks/home_format.py|.github/workflows/record-home.yml)
                      copy_v12=true
                      ;;
                  esac
                done < <(git diff --name-only "$merge_base" "$HEAD")
              fi
            fi
          fi
          if [ "$copy_v12" = true ]; then
            format="$(PYTHONPATH=scripts/benchmarks python3 -c 'from home_format import HOME_FORMAT; print(HOME_FORMAT)')"
            if [ "$format" != 13 ]; then
              copy_v12=false
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "copy_v12=$copy_v12" >> "$GITHUB_OUTPUT"
          echo "Record home proof selected: $run"
          echo "Format 12 to 13 copy selected: $copy_v12"

  records:
    name: Fresh home records
    needs: select
    if: needs.select.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      FOLDDB_BUILD_VERSION_OVERRIDE: bench-${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: schema-node-operations-debug
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the product in CI
        run: cargo build --locked -p lastdb_node --bin lastdbd
      - name: Exercise the actual daemon on a fresh generated home
        run: |
          set -euo pipefail
          python3 scripts/operations/record_home.py --daemon "$PWD/target/debug/lastdbd" \
            --revision "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/record-home" 2>&1 | tee "$RUNNER_TEMP/record-home.log"
      - name: Check out the accepted format 12 source
        if: needs.select.outputs.copy_v12 == 'true'
        uses: actions/checkout@v5
        with:
          ref: 5373c5c514e612104204baca69cbd3b82995c5f1
          path: format12-source
          persist-credentials: false
      - name: Rehearse the format 12 live-record copy
        if: needs.select.outputs.copy_v12 == 'true'
        run: |
          set -euo pipefail
          source_revision="$(git -C format12-source rev-parse HEAD)"
          cp target/debug/lastdbd "$RUNNER_TEMP/lastdbd-format13"
          FOLDDB_BUILD_VERSION_OVERRIDE="bench-$source_revision" \
            cargo build --locked --manifest-path format12-source/Cargo.toml \
            --target-dir "$PWD/target" -p lastdb_node --bin lastdbd
          mv target/debug/lastdbd "$RUNNER_TEMP/lastdbd-format12"
          mv "$RUNNER_TEMP/lastdbd-format13" target/debug/lastdbd
          python3 scripts/operations/record_home.py \
            --copy-format12-daemon "$RUNNER_TEMP/lastdbd-format12" --copy-format12-revision "$source_revision" \
            --daemon "$PWD/target/debug/lastdbd" --revision "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/record-home/format12-copy" 2>&1 \
            | tee "$RUNNER_TEMP/record-home/format12-copy.log"
          printf 'Format 12 (%s) to 13 live-record copy and range-age proof passed.\n' \
            "$source_revision" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        id: evidence
        if: always()
        with:
          name: record-home-${{ github.sha }}
          path: |
            ${{ runner.temp }}/record-home
            ${{ runner.temp }}/record-home.log
          retention-days: 7
          if-no-files-found: warn
      - name: Publish the result
        if: always()
        env:
          RESULT: ${{ job.status }}
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact-digest }}
        run: |
          {
            echo "## Record home product proof"
            echo "Source: $GITHUB_SHA"
            echo "Result: $RESULT"
            echo "Fresh generated home only. No primary access, local build, or benchmark."
            echo "Artifact: $ARTIFACT_URL"
            echo "Artifact SHA256: $ARTIFACT_DIGEST"
            echo "Expiration: 7 days after this run."
          } >> "$GITHUB_STEP_SUMMARY"

  report:
    name: Record home proof result
    needs:
      - select
      - records
    if: always() && needs.select.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require success or a deliberate skip
        env:
          RECORDS: ${{ needs.records.result }}
          SELECTED: ${{ needs.select.outputs.run }}
        run: |
          echo "records result: $RECORDS"
          echo "selected: $SELECTED"
          case "$SELECTED:$RECORDS" in
            true:success|false:skipped)
              {
                echo "## Record home proof result"
                echo "Records job: $RECORDS"
                echo "Selected: $SELECTED"
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "record home proof did not pass"
              exit 1
              ;;
          esac
