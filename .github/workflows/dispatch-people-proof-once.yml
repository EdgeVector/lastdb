name: Dispatch People proof for companion fixes once

on:
  push:
    branches: [cursor/dispatch-people-proof-aad0]

permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Cancel competing People runs
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          gh api --method POST repos/EdgeVector/people/actions/runs/45068460900/cancel || true
          echo cancelled_ea3d_pending
