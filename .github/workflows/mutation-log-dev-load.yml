name: Mutation log DEV load

# Run against the accepted ExeMem DEV service from main. Manual tiers measure
# signed appends and paged reads. The daily workflow calls the private device
# sync and signed log recovery operation with the exact accepted client.
# The native cutoff operation is manual and leaves provider snapshot bytes.
# The existing cloud-backup-dev OIDC role and CI account scope all operations.

on:
  workflow_dispatch:
    inputs:
      confirm_deployed:
        description: "Type yes after the ExeMem revision needed for this operation is deployed to DEV"
        required: true
        type: string
      level:
        description: "Signed load, private device sync, or private native cutoff with retained provider bytes"
        type: choice
        options: ["all", "5", "20", "100", "private", "private-native-cutoff"]
        default: "all"
      duration:
        description: "preliminary finishes 10 appends at 5, 20, and 100 writers. scale is the 3-minute 100-writer clock."
        type: choice
        options: ["preliminary", "scale"]
        default: "preliminary"
  workflow_call:
    inputs:
      confirm_deployed:
        required: true
        type: string
      level:
        required: true
        type: string
      duration:
        required: true
        type: string
    secrets:
      LASTDB_CLOUD_DEV_API_KEY:
        required: false
      LASTDB_CLOUD_DEV_RECOVERY_PHRASE:
        required: false
      LASTDB_CLOUD_DEV_BASELINE:
        required: false

permissions:
  contents: read

jobs:
  build-client:
    if: >-
      github.ref == 'refs/heads/main' &&
      (inputs.level == 'private' ||
       (inputs.level == 'private-native-cutoff' && github.event_name == 'workflow_dispatch'))
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/cloud-backup-build.yml

  load:
    needs: build-client
    if: >-
      always() && !cancelled() && github.ref == 'refs/heads/main' &&
      (inputs.level != 'private-native-cutoff' || github.event_name == 'workflow_dispatch') &&
      ((inputs.level != 'private' && inputs.level != 'private-native-cutoff') ||
       needs.build-client.result == 'success')
    environment: cloud-backup-dev
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        if: inputs.level == 'private' || inputs.level == 'private-native-cutoff'
        with:
          name: ${{ needs.build-client.outputs.artifact }}
          path: ${{ runner.temp }}/cloud-backup-client
      - name: Unpack the exact client for private recovery
        if: inputs.level == 'private' || inputs.level == 'private-native-cutoff'
        run: |
          set -euo pipefail
          client_bin_dir="$RUNNER_TEMP/cloud-backup-bin"
          mkdir -m 700 "$client_bin_dir"
          tar -xzf "$RUNNER_TEMP/cloud-backup-client/lastdb-x86_64-unknown-linux-gnu.tar.gz" \
            -C "$client_bin_dir" lastdb lastdbd
          printf 'CLIENT_BIN_DIR=%s\n' "$client_bin_dir" >> "$GITHUB_ENV"
      - name: Refuse a role outside the DEV account before assuming it
        env:
          LASTDB_MUTATION_LOG_DEV_ROLE_ARN: ${{ vars.LASTDB_MUTATION_LOG_DEV_ROLE_ARN }}
        working-directory: scripts/mutation_log_load
        run: |
          python3 -c 'from guard import allow_region, allow_role; import os; allow_role(os.environ["LASTDB_MUTATION_LOG_DEV_ROLE_ARN"]); allow_region("us-west-2")'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.LASTDB_MUTATION_LOG_DEV_ROLE_ARN }}
          aws-region: us-west-2
          role-session-name: mutation-log-load-${{ github.run_id }}
      - name: Run signed DEV load or private recovery
        id: load
        continue-on-error: true
        env:
          LASTDB_MUTATION_LOG_DEV_TABLE: ExememMutationLog-dev
          LASTDB_MUTATION_LOG_DEV_ROLE_ARN: ${{ vars.LASTDB_MUTATION_LOG_DEV_ROLE_ARN }}
          LASTDB_CLOUD_DEV_API_KEY: ${{ secrets.LASTDB_CLOUD_DEV_API_KEY }}
          LASTDB_CLOUD_DEV_RECOVERY_PHRASE: ${{ secrets.LASTDB_CLOUD_DEV_RECOVERY_PHRASE }}
          LASTDB_CLOUD_DEV_BASELINE: ${{ secrets.LASTDB_CLOUD_DEV_BASELINE }}
          CLIENT_VERSION: ${{ needs.build-client.outputs.version }}
          LOAD_LEVEL: ${{ inputs.level }}
          LOAD_DURATION: ${{ inputs.duration }}
          CONFIRM_DEPLOYED: ${{ inputs.confirm_deployed }}
        run: |
          python3 -m pip install --quiet cryptography==41.0.7
          set +e
          scale=
          if [ "$LOAD_DURATION" = "scale" ]; then
            scale=--scale
          fi
          python3 scripts/mutation_log_load/run.py \
            --phase load \
            --level "$LOAD_LEVEL" \
            $scale \
            --confirm-deployed "$CONFIRM_DEPLOYED" \
            --ledger "$RUNNER_TEMP/mutation-log-load-ledger.json" \
            --summary "$RUNNER_TEMP/mutation-log-load-summary.json"
          code=$?
          echo "$code" > "$RUNNER_TEMP/mutation-log-load-exit"
          exit "$code"
      - name: Delete this run's DynamoDB metadata
        id: cleanup
        if: always()
        continue-on-error: true
        env:
          LASTDB_MUTATION_LOG_DEV_TABLE: ExememMutationLog-dev
          LASTDB_MUTATION_LOG_DEV_ROLE_ARN: ${{ vars.LASTDB_MUTATION_LOG_DEV_ROLE_ARN }}
          CONFIRM_DEPLOYED: ${{ inputs.confirm_deployed }}
          LOAD_LEVEL: ${{ inputs.level }}
        run: |
          python3 -m pip install --quiet cryptography==41.0.7
          set +e
          python3 scripts/mutation_log_load/run.py \
            --phase cleanup \
            --level "$LOAD_LEVEL" \
            --confirm-deployed "$CONFIRM_DEPLOYED" \
            --ledger "$RUNNER_TEMP/mutation-log-load-ledger.json" \
            --summary "$RUNNER_TEMP/mutation-log-load-summary.json"
          code=$?
          echo "$code" > "$RUNNER_TEMP/mutation-log-cleanup-exit"
          exit "$code"
      - name: Keep the load status in front of a cleanup failure
        if: always()
        run: |
          python3 - <<'PY'
          import os
          import sys
          sys.path.insert(0, "scripts/mutation_log_load")
          from stats import combine_exit

          def code(path):
              try:
                  return int(open(path, encoding="utf-8").read().strip())
              except (OSError, ValueError):
                  return 1

          root = os.environ["RUNNER_TEMP"]
          # 0 complete, 1 correctness, 2 cap, 3 scaling.
          sys.exit(combine_exit(
              code(os.path.join(root, "mutation-log-load-exit")),
              code(os.path.join(root, "mutation-log-cleanup-exit"))))
          PY
