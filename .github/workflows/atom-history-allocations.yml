name: Atom history allocation call paths

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atom-history-allocations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: '2'
      BASELINE_SHA: 71fb949a89d1ba77909ca9d57cfcfaf7d7418d45
      CANDIDATE_SHA: 18bc31a40ea5253563aececc1a30fd030da0949b
      RUSTFLAGS: '-Cforce-frame-pointers=yes -Cdebuginfo=1'
    steps:
      - uses: actions/checkout@v5
        with:
          path: driver
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: 71fb949a89d1ba77909ca9d57cfcfaf7d7418d45
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: 18bc31a40ea5253563aececc1a30fd030da0949b
          path: candidate
          persist-credentials: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
          key: allocation-downloads-${{ runner.os }}-${{ hashFiles('baseline/Cargo.lock', 'candidate/Cargo.lock') }}
      - name: Compile the CI-only allocation recorder
        run: |
          mkdir "$RUNNER_TEMP/allocation-build"
          cc -std=c11 -O2 -g -fno-omit-frame-pointer -Wall -Wextra -Werror \
            -c driver/scripts/operations/allocation_profile.c -o "$RUNNER_TEMP/allocation-recorder.o"
          rustc --version --verbose > "$RUNNER_TEMP/allocation-build/compiler.txt"
          cc --version > "$RUNNER_TEMP/allocation-build/native-compiler.txt"
          sha256sum driver/scripts/operations/allocation_profile.c > "$RUNNER_TEMP/allocation-build/recorder.sha256"
          echo "$RUSTFLAGS" > "$RUNNER_TEMP/allocation-build/flags.txt"
      - name: Check space for both fresh builds
        id: space
        env:
          BENCH_OUTPUT: ${{ runner.temp }}/allocation-build
        run: python3 driver/scripts/benchmarks/disk.py --profile standard --phase build
      - uses: jlumbroso/free-disk-space@v1.3.1
        if: steps.space.outputs.cleanup-required == 'true'
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false
      - name: Require the build space budget
        env:
          BENCH_OUTPUT: ${{ runner.temp }}/allocation-build
        run: python3 driver/scripts/benchmarks/disk.py --profile standard --phase build --require
      - name: Build both historical sources with identical allocation instrumentation
        run: |
          set -euo pipefail
          for label in baseline candidate; do
            if [ "$label" = baseline ]; then revision="$BASELINE_SHA"; else revision="$CANDIDATE_SHA"; fi
            [ "$(git -C "$label" rev-parse HEAD)" = "$revision" ]
            (
              cd "$label"
              CARGO_TARGET_DIR="$RUNNER_TEMP/target-$label" FOLDDB_BUILD_VERSION_OVERRIDE="bench-$revision-allocation-profile" \
                cargo rustc --locked --profile dev-release -p lastdb_node --bin lastdbd -- \
                  -Clink-arg="$RUNNER_TEMP/allocation-recorder.o" \
                  -Clink-arg=-Wl,--wrap=mi_malloc_aligned,--wrap=mi_zalloc_aligned,--wrap=mi_realloc_aligned \
                  -Clink-arg=-ldl > "$RUNNER_TEMP/allocation-build/$label.log" 2>&1
            )
            mkdir -p "$RUNNER_TEMP/programs/$revision"
            cp "$RUNNER_TEMP/target-$label/dev-release/lastdbd" "$RUNNER_TEMP/programs/$revision/lastdbd"
            sha256sum "$RUNNER_TEMP/programs/$revision/lastdbd" >> "$RUNNER_TEMP/allocation-build/programs.sha256"
          done
      - name: Exercise generated homes with huge pages disabled in both programs
        run: |
          python3 driver/scripts/operations/atom_history_memory.py --programs "$RUNNER_TEMP/programs" \
            --baseline "$BASELINE_SHA" --candidate "$CANDIDATE_SHA" --output "$RUNNER_TEMP/allocation-traffic" \
            --disable-thp --allocation-profile
      - name: Resolve actual allocation call paths
        run: |
          python3 driver/scripts/operations/allocation_profile.py --programs "$RUNNER_TEMP/programs" \
            --baseline "$BASELINE_SHA" --candidate "$CANDIDATE_SHA" --output "$RUNNER_TEMP/allocation-traffic" \
            >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        id: evidence
        if: always()
        with:
          name: atom-history-allocations-${{ github.sha }}
          path: |
            ${{ runner.temp }}/allocation-build
            ${{ runner.temp }}/allocation-traffic
          if-no-files-found: error
          retention-days: 7
      - name: Record diagnostic provenance
        if: always()
        env:
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact-digest }}
          RESULT: ${{ job.status }}
        run: |
          {
            echo "Driver and recorder source: $GITHUB_SHA"
            echo "Historical sources: $BASELINE_SHA and $CANDIDATE_SHA"
            echo "Result: $RESULT"
            echo "Artifact: $ARTIFACT_URL"
            echo "Artifact SHA256: $ARTIFACT_DIGEST"
            echo "Expiration: 7 days after this run."
            echo "Allocation traffic only. Instrumented timing and RSS are not benchmark results."
            echo "Fresh generated CI homes only. No primary access."
          } >> "$GITHUB_STEP_SUMMARY"
