name: LastDB historical benchmark comparison

# Manual comparisons have no benchmark-complete check and cannot satisfy a PR gate.
on:
  workflow_dispatch:
    inputs:
      baseline_revision:
        description: Full baseline SHA (empty selects the candidate parent)
        type: string
        default: ""
      candidate_revision:
        description: Full candidate SHA (empty selects this workflow revision)
        type: string
        default: ""
      profile:
        description: Benchmark workload
        type: choice
        options: [standard, nightly, batch-insert]
        default: standard
      resource_only:
        description: Measure resource growth only with the selected profile
        type: boolean
        default: false
      disk_excess:
        description: Also attribute v2 disk excess after updates, idle and reopen on two corpus sizes
        type: boolean
        default: false
      ttl_active:
        description: Also measure generated writes with TTL policies, sweep and full compaction
        type: boolean
        default: false
      search_queue:
        description: Also measure optional Search (candidate must support --enable-search)
        type: boolean
        default: false
      investigation:
        description: Capture native phases in a separate generated-data pass
        type: boolean
        default: false
      writer16:
        description: Also compare 16 writers on six fresh 100,000-record homes
        type: boolean
        default: false
      baseline_workers:
        description: Baseline socket workers (0 uses the product default)
        type: choice
        options: ["0", "4", "8", "16", "32"]
        default: "0"
      candidate_workers:
        description: Candidate socket workers (0 uses the product default)
        type: choice
        options: ["0", "4", "8", "16", "32"]
        default: "0"

permissions:
  contents: read
  actions: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      baseline: ${{ steps.plan.outputs.baseline }}
      candidate: ${{ steps.plan.outputs.candidate }}
      driver: ${{ steps.plan.outputs.driver }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select historical product revisions with this workflow's driver
        id: plan
        env:
          BASE_SHA: ${{ inputs.baseline_revision }}
          HEAD_SHA: ${{ inputs.candidate_revision || github.sha }}
        run: python3 scripts/benchmarks/plan.py --always --output "$RUNNER_TEMP/benchmark-plan.json"

  comparison:
    needs: plan
    uses: ./.github/workflows/bench-run.yml
    with:
      baseline: ${{ needs.plan.outputs.baseline }}
      candidate: ${{ needs.plan.outputs.candidate }}
      driver: ${{ needs.plan.outputs.driver }}
      profile: ${{ inputs.profile }}
      resource_only: ${{ inputs.resource_only }}
      disk_excess: ${{ inputs.disk_excess }}
      search_queue: ${{ inputs.search_queue }}
      ttl_active: ${{ inputs.ttl_active }}
      investigation: ${{ inputs.investigation }}
      writer16: ${{ inputs.writer16 }}
      baseline_workers: ${{ inputs.baseline_workers }}
      candidate_workers: ${{ inputs.candidate_workers }}
