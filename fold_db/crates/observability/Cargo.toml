[package]
autotests = false
name = "observability"
version = "0.1.0"
edition.workspace = true
publish = false
description = "Shared telemetry substrate for LastDB (JSON formatting, crash hooks, and optional Sentry)."

[features]
default = []
sentry = ["dep:sentry", "dep:sentry-tracing"]

[dependencies]
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "json", "fmt"] }
tracing-appender = "0.2"
tracing-log = "0.2"
sentry = { workspace = true, optional = true, features = ["backtrace", "contexts", "release-health", "reqwest", "rustls"] }
sentry-tracing = { version = "0.47", optional = true }
thiserror = { workspace = true }
once_cell = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true

[lib]
test = false
doctest = false
bench = false
