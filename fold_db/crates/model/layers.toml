# Layer order of the lastdb_model crate, bottom first.

[[layer]]
name = "primitives"
doc = "Leaf helpers with no domain meaning: canonical byte framing, hex, key-prefix rules, and resource bounds."
modules = [
  "canonical",
]

[[layer]]
name = "model"
doc = "The key codecs and value limits, schema types, keys, mutations, and the logical layout rules, with the pure functions over them."
modules = [
  "field_key_codec",
  "portable_mutation",
  "record_value",
  "schema",
]

[[layer]]
name = "surface"
doc = "The crate root module list."
modules = [
  "crate",
]
