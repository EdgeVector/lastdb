[package]
autotests = false
name = "fold_db"
version = "0.3.0"
edition.workspace = true
publish = false

[dependencies]
# Cryptography
env_flag = { workspace = true }
base64.workspace = true
ed25519-dalek = { version = "2.0", features = ["rand_core", "serde"] }
aes-gcm = "0.10"
openssl = "0.10.76"
hkdf = "0.12"
hmac = { workspace = true }
sha2 = { workspace = true }
zeroize = { workspace = true }
# gzip for consent-gated delivery JWE plaintext (compress-before-encrypt)
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Inline id lists in the warm set slot and source tables.
smallvec = "1"
# Id-only indexes for the warm set source and slot tables.
hashbrown = { version = "0.17", default-features = false }

# Storage
laststore = { path = "../../../vendor/laststore" }
cloud_backup_protocol = { path = "../../../cloud_backup_protocol" }
# The one upload planner. The snapshot capture keeps its objects in its store.
cloud_backup_plan = { path = "../../../cloud_backup_plan" }
lastdb_storage_policy = { path = "../../../lastdb_storage_policy" }

# Core utilities
uuid = { workspace = true, features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rand = { workspace = true }
tempfile = { workspace = true }
tracing = { workspace = true }

# Async runtime
# `rt` is required by `tokio::task::spawn_blocking` (CPU-bound work off the reactor).
tokio = { workspace = true, features = ["sync", "time", "fs", "io-util", "rt"] }
tokio-util = { version = "0.7", features = ["io"] }
futures = { workspace = true }
async-trait = { workspace = true }

# Error handling
thiserror = { workspace = true }

# No HTTP client: the cloud backup transport is the `cloud_backup_client`
# crate, and the core does no network I/O.

# Shared telemetry crate without `otel`: query filters only redact ids with
# `observability::redact_id!`. W3C propagation is a cloud_backup_client need.
observability = { workspace = true }
# Pure wire schema types (shared with schema_service; no storage).
schema_types = { workspace = true }
# Pure LastDB models: records, field keys, schemas, keys, mutations (no behavior).
lastdb_model = { workspace = true }

ed25519-compact = "2.2.0"
aes-gcm-siv = "0.11"

# Unix-socket peer-credential read. Unix-only and unconditional: reading a
# socket's kernel peer credential is a generic primitive consumed by the dev
# node's UDS control socket. Non-Unix targets pull in no `libc` peer-cred FFI.
[target.'cfg(unix)'.dependencies]
libc = { version = "0.2" }

[target.'cfg(target_os = "macos")'.dependencies]
mach2 = "0.4"

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }

[lib]
bench = false
doctest = false
test = false
name = "fold_db"
path = "src/lib.rs"

[lints]
workspace = true
