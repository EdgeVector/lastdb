# Layer order of the fold_db core crate (package fold_db), bottom first.

[[layer]]
name = "primitives"
doc = "Leaf helpers with no domain meaning: clock, env parsing, crypto, and signing primitives."
modules = [
  "crypto",
  "platform",
]

[[layer]]
name = "model"
doc = "The core side of the data model: content_limit, schema::types, access context, manifest retention, and error kinds."
modules = [
  "access",
  "error",
  "limits",
  "schema::types",
  "storage::error",
]

[[layer]]
name = "runtime"
doc = "Process-local runtime state with no store: the warm set (resident)."
modules = [
  "resident",
]

[[layer]]
name = "storage"
doc = "The store: storage traits and config, the disk pack, current-key rules and key families, the field key store, the encrypting stores, and the content key proof."
modules = [
  "storage",
]

[[layer]]
name = "operations"
doc = "Typed record stores over the storage layer: the record store, schema store, catalog, ledgers, change feed, alternate keys, and search outbox."
modules = [
  "db_operations",
]

[[layer]]
name = "schema_core"
doc = "The schema registry service: schema load, state, staged cache, and read snapshots over the operations and storage layers."
modules = [
  "schema",
]

[[layer]]
name = "engine"
doc = "The database engine: FoldDB, the mutation manager, query, purge, drains, and the factory that builds a node."
modules = [
  "fold_db_core",
]

[[layer]]
name = "surface"
doc = "The crate root re-exports."
modules = [
  "crate",
]
