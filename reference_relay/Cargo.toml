[package]
autotests = false
name = "reference_relay"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "In-repo grant-gating reference relay (publisher-signed birth/grant index) for CI signed-history scenarios."

[lints]
workspace = true

[[bin]]
bench = false
test = false
name = "reference_relay"
path = "src/main.rs"

[[bin]]
bench = false
test = false
name = "entry_audit"
path = "src/bin/entry_audit.rs"

[dependencies]
app_identity_crypto = { workspace = true }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
base64 = { workspace = true }
clap = { workspace = true }
futures = { workspace = true }
hmac = { workspace = true }
mutation_log = { path = "../mutation_log" }
relay_protocol = { path = "../relay_protocol" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "net", "rt", "sync", "time"] }
