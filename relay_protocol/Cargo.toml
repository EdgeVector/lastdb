[package]
name = "relay_protocol"
version = "0.1.0"
edition.workspace = true
publish = false
autotests = false
description = "The LastDB relay protocol: the one definition of every relay route, header, request, answer and error. No I/O."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { version = "1.0", optional = true }

[features]
# The JSON Schema derives and the OpenAPI document, for the generator only. The programs that
# speak the protocol leave it off.
schema = ["dep:schemars"]

[lints]
workspace = true

[lib]
test = false
doctest = false
bench = false

# Writes docs/designs/relay-protocol.openapi.json from the types. CI runs it and refuses a
# committed file that differs.
[[bin]]
name = "relay-protocol-openapi"
path = "src/bin/relay_protocol_openapi.rs"
required-features = ["schema"]
test = false
doctest = false
bench = false
