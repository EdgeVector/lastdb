[package]
autotests = false
name = "laststore"
version = "0.1.0"
publish = false
edition.workspace = true
description = "Last Store — the LastDB disk engine (disk format v2: sorted, encrypted run files)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/EdgeVector/laststore"
readme = "README.md"
keywords = ["database", "embedded", "lsm", "last-db"]
categories = ["database-implementations", "filesystem"]
exclude = ["target/", ".git/"]

[dependencies]
crc32fast = "1.5"
serde.workspace = true
aes-gcm = "0.11"
hkdf = "0.13"
sha2 = { workspace = true }
rustix = { version = "1", features = ["fs", "process"] }
uuid = { workspace = true, features = ["v4"] }
zstd = "0.14"
zeroize.workspace = true

# The ordered write of a commit (`F_BARRIERFSYNC`) has no safe wrapper.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

# Hardware SHA-256 on aarch64. The x86 backend of `sha2` uses SHA-NI without this feature.
[target.'cfg(target_arch = "aarch64")'.dependencies]
sha2 = { workspace = true, features = ["asm"] }

[lib]
test = false
doctest = false
bench = false
