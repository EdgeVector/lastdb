[package]
autotests = false
name = "laststore"
version = "0.1.0"
# Its path dependency lastdb_storage_policy is unpublished, so this crate cannot
# be published either. cargo-deny allows wildcard path deps only in private crates.
publish = false
edition.workspace = true
description = "Last Store — the LastDB disk engine (disk format v2: sorted, encrypted run files)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/EdgeVector/laststore"
readme = "README.md"
keywords = ["database", "embedded", "lsm", "last-db"]
categories = ["database-implementations", "filesystem"]
exclude = ["target/", ".git/"]

[dependencies]
lastdb_model = { workspace = true }
crc32fast = "1.5"
serde.workspace = true
serde_json = "1"
aes-gcm = "0.11"
hkdf = "0.13"
openssl = "0.10.76"
sha2 = "0.10"
rustix = { version = "1", features = ["fs", "process"] }
uuid = { version = "1", features = ["v4"] }
zstd = "0.14"
zeroize.workspace = true

# Hardware SHA-256 on aarch64. The x86 backend of `sha2` uses SHA-NI without this feature.
[target.'cfg(target_arch = "aarch64")'.dependencies]
sha2 = { version = "0.10", features = ["asm"] }

[lib]
test = false
doctest = false
bench = false
