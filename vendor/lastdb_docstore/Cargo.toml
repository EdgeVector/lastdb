[package]
autotests = false
name = "lastdb_docstore"
version = "0.1.0"
edition.workspace = true
description = "Reusable LastDB document store: segment files, WAL, codecs, and CAS blobs."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
hex = "0.4"
laststore = { workspace = true }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
# `laststore::Error::ChunkQuarantined` carries a `uuid::Uuid` in its public API,
# so every crate that matches on that error needs the type. Same major as
# laststore's, so cargo unifies them into one crate.
uuid = "1"
zeroize = { version = "1", features = ["zeroize_derive"] }
zstd = "0.13"


[lib]
test = false
doctest = false
bench = false
