thiserror = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
ed25519-dalek = { version = "2.2", features = ["std", "fast", "zeroize"] }
json-canon = { workspace = true }

[lints]
workspace = true

[lib]
test = false
doctest = false
bench = false
