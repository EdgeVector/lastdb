[package]
autotests = false
name = "schema_service_client"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Typed HTTP client for the schema service /v1/* API."
autoexamples = false

[[bin]]
bench = false
test = false
name = "schema_pow_live_probe"
path = "examples/schema_pow_live_probe.rs"

[[bin]]
bench = false
test = false
name = "same_app_veto_live_probe"
path = "examples/same_app_veto_live_probe.rs"

[dependencies]
schema_service_core = { path = "../core", default-features = false }
schema_types = { workspace = true }
# Phase 2 / B4 follow-up: wraps egress request builders with
# `observability::propagation::inject_w3c(builder)` so the
# `traceparent` header from the current tracing span flows downstream
# to schema_service. Pulls in tracing/opentelemetry transitively, but
# only via the `propagation` module — no SDK init required at link time.
observability = { workspace = true, features = ["otel"] }

app_identity_crypto = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[lints]
workspace = true

[lib]
test = false
doctest = false
bench = false
