[package]
autotests = false
name = "schema_service_core"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Schema service registry brain — schema dedup, canonical fields, views, transforms. Embedder injected by callers (no fastembed/ONNX dep)."

[features]
# Offline generators only. The Lambda crate must not
# enable this: include_str! of the Schema.org JSON-LD and classification
# overlay is several MiB in the bootstrap zip.
schema-org-seed-data = []

[dependencies]
schema_core_resolver = { workspace = true }
schema_types = { workspace = true }
# App-identity (app_identity v3.1, Lane B2b): DevCert (ES256) + signed
# envelope (Ed25519) + JCS verification for `POST /v1/apps` and the
# `owner_app_id` schema-claim gate on `POST /v1/schemas`.
app_identity_crypto = { workspace = true }
# Ed25519 verification for compat-row write endpoint (verifier-signed only).
ed25519-dalek = { version = "2.2", features = ["std"] }
base64 = { workspace = true }
blake3 = { workspace = true }
hmac = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
semver = { workspace = true }
tracing = { workspace = true }

sha2 = { workspace = true }
async-trait = { workspace = true }
# `time` — backoff sleeps + reconciler interval; `sync` — the in-process
# cross-env mirror queue (mpsc). `rt`/`macros` come from the binaries that
# spawn the worker and reconciler loops.
# `rt` — ResolverRuntime::spawn_refresh_task + kill-switch clear.
tokio = { workspace = true, features = ["time", "sync", "rt"] }

# RFC 3339 stamps. Wall time comes from the injected `Clock`.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Phase C shadow-mode near-miss audit log: `registration_id` is a UUID
# v4 minted at the call site so a retried registration won't double-log.
uuid = { workspace = true, features = ["v4"] }

thiserror = { workspace = true }

[lints]
workspace = true

[lib]
test = false
doctest = false
bench = false

[[test]]
name = "canonical_properties"
path = "tests/canonical_properties.rs"
