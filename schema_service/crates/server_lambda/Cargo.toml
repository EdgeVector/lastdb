[package]
autotests = false
name = "schema_service_server_lambda"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "AWS Lambda handler for the advisory Schema Service (`GET /v1/health`, `GET /v1/fields/vocabulary`, `POST /v1/advice/schema`)."

[[bin]]
bench = false
test = false
# cargo-lambda ALWAYS names the binary inside the zip `bootstrap` (the
# AL2023 provided runtime entrypoint). The `name` below controls only
# the cargo build artifact path — `target/lambda/server_lambda/bootstrap.zip`.
name = "server_lambda"
path = "src/main.rs"

[features]
default = []
# Retained as an empty feature flag so schema-infra's `--features fastembed`
# build invocation remains compatible across the advisory cutover.
fastembed = []

[dependencies]
schema_service_core = { workspace = true }
lambda_http = "0.13"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
observability = { workspace = true }

[lints]
workspace = true
