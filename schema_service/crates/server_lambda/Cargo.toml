[package]
name = "schema_service_server_lambda"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "AWS Lambda wrapper around schema_service_server_shared. Deployed to schema.folddb.com via schema-infra."

[[bin]]
# cargo-lambda ALWAYS names the binary inside the zip `bootstrap` (the
# AL2023 provided runtime entrypoint). The `name` below controls only
# the cargo build artifact path — `target/lambda/server_lambda/bootstrap.zip`.
name = "server_lambda"
path = "src/main.rs"

[features]
default = []
fastembed = ["schema_service_server_shared/fastembed-layer"]

[dependencies]
# default-features=false: no laststore. Do not enable schema-org-seed-data —
# that feature include_str!s ~3.85 MiB of Schema.org dump into the zip.
schema_service_core = { path = "../core", default-features = false }
schema_service_server_shared = { path = "../server_shared" }
schema_service_s3 = { path = "../schema_service_s3" }
schema_types = { workspace = true }

# X-API-Key validation for `GET /v1/snapshot` (auth-gated by design —
# the route is the read side of the dev-hydration flow): SHA-256 hash +
# DynamoDB `GetItem` on the deployment's key table, see `src/api_key.rs`.
sha2 = { workspace = true }

# AWS Lambda runtime
lambda_http = "0.13"
# Diet cut #5: only what this binary uses (`#[tokio::main]`, `#[tokio::test]`,
# `tokio::sync::OnceCell`). `full` pulled process/signal/net/fs and friends
# the Lambda never needs.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }

# `lambda_http` re-exports `http::Request`/`Response` but not the `http`
# crate itself. `cors_builder` names `http::response::Builder` as a
# return type (non-test code), so depend on `http` directly.
http = { workspace = true }

# AWS SDK (S3 for schema persistence; DynamoDB for `X-API-Key`
# validation on `GET /v1/snapshot`).
# Diet cut #5: drop aws-config default features that pull SSO / external
# credential-process clients — Lambda uses the execution role + env only.
# Not `workspace = true`: Cargo refuses to turn off workspace-dep defaults
# from a member unless the workspace entry itself has default-features=false.
aws-config = { version = "1", default-features = false, features = [
    "behavior-version-latest",
    "rt-tokio",
    "default-https-client",
] }
aws-sdk-s3 = { workspace = true }
aws-sdk-dynamodb = { workspace = true }

serde_json = { workspace = true }

tracing = { workspace = true }

# Shared observability stack: JSON FMT to stdout (Lambda → CloudWatch).
# Workspace dep is default-features=false; leave `otel` off so the Lambda
# graph drops OTel/reqwest (diet cut #4). `init_lambda` still works as
# JSON+optional-Sentry without the otel feature. Sentry stays compile-time
# optional via observability's `sentry` feature (not enabled here).
observability = { workspace = true }

# Diet cut #5: removed vendored OpenSSL. The Lambda AWS stack rides
# hyper-rustls; nothing in this crate referenced openssl symbols, and the
# vendored build was pure compile-time cost for AL2023 packaging.

[dev-dependencies]
schema_service_core = { path = "../core", features = ["test-utils", "local-store"] }
tempfile = { workspace = true }
temp-env = "0.3"
# tests use #[tokio::test]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }

[lints]
workspace = true
