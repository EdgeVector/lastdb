[package]
autotests = false
name = "schema_service_server_lambda"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "AWS Lambda handler for the advisory Schema Service (`GET /v1/health`, `GET /v1/fields/vocabulary`, `POST /v1/advice/schema`, `POST /v1/schemas`, `GET /v1/schemas/{definition_id}`)."

[[bin]]
bench = false
test = false
# cargo-lambda ALWAYS names the binary inside the zip `bootstrap` (the
# AL2023 provided runtime entrypoint). The `name` below controls only
# the cargo build artifact path — `target/lambda/server_lambda/bootstrap.zip`.
name = "server_lambda"
path = "src/main.rs"

[dependencies]
app_identity_crypto = { workspace = true }
aws-credential-types = "1.3"
aws-sigv4 = "1.6"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
schema_service_core = { workspace = true }
schema_types = { workspace = true }
lambda_http = "1.3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }
http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
observability = { workspace = true }

[lints]
workspace = true
