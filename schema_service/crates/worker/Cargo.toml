[package]
autotests = false
name = "schema_service_worker"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Operator CLIs for schema_service. Historically hosted the async transform compile worker; that Lambda was retired when transform submission went binary-only (2026-06-21) — there is no untrusted-source compile to offload. The crate now hosts one-shot operator tools (the `purpose_statement` backfill)."

[[bin]]
bench = false
test = false
# Phase D one-shot operator CLI: backfills `purpose_statement` on
# every canonical schema persisted before Phase A. Invoked manually
# (Sled-local for dev; S3 for prod) — never deployed as a Lambda.
# See `schema_service/README.md` for invocation.
name = "schema_service_backfill_purpose"
path = "src/bin/schema_service_backfill_purpose.rs"

[dependencies]
schema_service_core = { path = "../core", features = ["local-store"] }
schema_service_server_shared = { path = "../server_shared", features = ["fastembed"] }
schema_service_s3 = { path = "../schema_service_s3" }
observability = { workspace = true, features = ["otel"] }

# AWS SDK: S3 (schema blob storage) + DynamoDB (embeddings table) for the
# S3-backed backfill path.
aws-config = { workspace = true }
aws-sdk-s3 = { workspace = true }
aws-sdk-dynamodb = { workspace = true }

# `env` (workspace clap only enables `derive`) lets the backfill CLI
# read SCHEMA_STORE_BUCKET / SCHEMA_EMBEDDINGS_TABLE off the
# environment without extra glue. `env` is additive so this doesn't
# perturb other clap consumers.
clap = { workspace = true, features = ["env"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }

tracing = { workspace = true }

[lints]
workspace = true
