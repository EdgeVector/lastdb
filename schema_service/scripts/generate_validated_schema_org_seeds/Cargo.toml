[package]
name = "generate_validated_schema_org_seeds"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "One-shot script: ingest every Schema.org class serially through the full schema service pipeline (real fastembed embedder, real canonical-field semantic matching, real classification overlay) and save the resulting validated schemas + canonical fields as committed JSON snapshots. The runtime loads those JSONs at cold start instead of re-running the pipeline."

[[bin]]
name = "generate-validated-schema-org-seeds"
path = "src/main.rs"

[dependencies]
schema_service_core = { path = "../../crates/core", features = ["local-store", "schema-org-seed-data"] }
schema_service_server_shared = { path = "../../crates/server_shared", features = ["fastembed"] }
schema_types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tempfile = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }

[lints]
workspace = true
