# Layer order of the lastdb_node library crate, bottom first.
#
# scripts/ci/layer-check.py reads this file. Each source file goes to the
# layer that lists the longest prefix of its module path. A file may use its
# own layer and the layers below it. A reference to a higher layer fails CI.
# Cycles inside one layer are allowed.

exclude = ["main.rs", "bin"]

[[layer]]
name = "foundation"
doc = "Pure node types, endpoints, paths, identities, seals, accepted-write ledgers, and saved-query definitions."
modules = [
  "accepted_writes",
  "identity",
  "profile",
  "saved_query",
  "seal",
  "service_home",
  "share_spec",
]

[[layer]]
name = "transport"
doc = "Protocol versions, Unix-domain socket framing and routing, keyed local reads, cloud backup HTTP transport, and saved-query UDS execution."
modules = [
  "cloud_backup_client",
  "lastdb_uds",
  "node_read",
  "saved_query_run",
  "version",
]

[[layer]]
name = "cloud"
doc = "Cloud account configuration, registration, saved cloud and developer credentials, and backup access."
modules = [
  "cloud",
]

[[layer]]
name = "host"
doc = "The booted node host and owned-database lifecycle."
modules = [
  "host",
]

[[layer]]
name = "share_primitives"
doc = "Offline home descriptors, share write gates, signed mutation-log envelopes, and sealed share invitations."
modules = [
  "log_envelope",
  "offline_home",
  "share_invitation",
  "share_write_gate",
]

[[layer]]
name = "share_state"
doc = "Local share caches, registered shares, and named-database member grants."
modules = [
  "named_grant",
  "registered_share",
  "share_cache",
]

[[layer]]
name = "sync_replay"
doc = "Deterministic mutation-log replay and signed cloud log synchronization."
modules = [
  "database_replay",
  "log_sync",
]

[[layer]]
name = "jobs"
doc = "Background and on-demand work over a booted host: TTL sweep and saved-query reconciliation."
modules = [
  "jobs",
]

[[layer]]
name = "surface"
doc = "Owner-socket route handlers (exec) and crate-root exports."
modules = [
  "crate",
  "exec",
]
