# Layer order of the lastdb_node library crate, bottom first.
#
# scripts/ci/layer-check.py reads this file. Each source file goes to the
# layer that lists the longest prefix of its module path. A file may use its
# own layer and the layers below it. A reference to a higher layer fails CI.
# Cycles inside one layer are allowed.
#
# State sits below the host and work over the host sits above it: the host
# holds the sampler state, request telemetry and backup runtime (ops, leaf),
# and the jobs that take `&Host` (sampler, TTL sweep, footprint relief) live
# in `jobs`, above the node features they report on.

# The daemon binary (main.rs with its private lastdbd module) and the bin/
# tools are separate crates. They reach this library through `lastdb_node::`
# paths, so the library layer order does not cover them.
exclude = ["main.rs", "lastdbd", "bin"]

[[layer]]
name = "leaf"
doc = "Parts that use only other leaf parts: storage homes, queues, the backup runtime and its phase, seals, logs, shutdown receipts, and versions."
modules = [
  "accepted_writes",
  "backup_runtime",
  "share_spec",
  "byte_cloud_log",
  "cloud_backup_client",
  "identity",
  "lastdb_uds",
  "log_rotation",
  "node_read",
  "profile",
  "seal",
  "saved_query",
  "saved_query_run",
  "service_home",
  "shutdown_receipt",
  "version",
]

[[layer]]
name = "cloud"
doc = "Cloud account configuration, registration, the saved cloud credentials loader, and backup access."
modules = [
  "cloud",
]

[[layer]]
name = "host"
doc = "The booted node host."
modules = [
  "host",
]

[[layer]]
name = "features"
doc = "Node features over the host: byte cloud backup and restore, offline homes, and the app registry index."
modules = [
  "app_registry_index",
  "byte_cloud_backup",
  "byte_cloud_restore",
  "log_envelope",
  "named_grant",
  "log_sync",
  "named_snapshot_restore",
  "offline_home",
  "registered_share",
  "share_cache",
  "share_contribution",
  "share_invitation",
  "share_publication",
]

[[layer]]
name = "jobs"
doc = "Background and on-demand work over a booted host: the TTL sweep and saved-query reconciliation."
modules = [
  "jobs",
]

[[layer]]
name = "surface"
doc = "Owner-socket routes (exec), app publication, and the crate root re-exports."
modules = [
  "app_publish",
  "crate",
  "exec",
]
