# Layer order of the lastdb_node library crate, bottom first.
#
# EdgeVector/.github/layer-check reads this file. Each source file goes to the
# layer that lists the longest prefix of its module path. A file may use its
# own layer and the layers below it. A reference to a higher layer fails CI.
# Cycles inside one layer are allowed.

exclude = ["main.rs", "bin"]

[[layer]]
name = "foundation"
doc = "Pure node types, endpoints, paths, private files, and identities."
modules = [
  "device_identity",
  "offline_home",
  "personal_identity",
  "profile",
]

[[layer]]
name = "transport"
doc = "Protocol versions, Unix-domain socket framing and routing, keyed local reads, and cloud backup HTTP transport."
modules = [
  "cloud_backup_client",
  "lastdb_uds",
  "version",
]

[[layer]]
name = "cloud"
doc = "Cloud account configuration, registration, saved cloud and developer credentials, and backup access."
modules = [
  "cloud",
]

[[layer]]
name = "host"
doc = "The booted node host and owned-database lifecycle."
modules = [
  "host",
]

[[layer]]
name = "share_primitives"
doc = "Recipient contact identity for open-link registrations."
modules = [
  "share_invitation",
]

[[layer]]
name = "share_state"
doc = "Local open-link mint, received signed-log databases, and enrollment classification."
modules = [
  "named_grant",
  "registered_share",
  "share_cache",
  "share_link",
]

[[layer]]
name = "sync_replay"
doc = "Signed cloud log synchronization and history materialize."
modules = [
  "log_sync",
]

[[layer]]
name = "surface"
doc = "Owner-socket route handlers (exec)."
modules = [
  "exec",
]

[[layer]]
name = "jobs"
doc = "Background and on-demand work over a booted host (TTL sweep) and crate-root exports."
modules = [
  "crate",
  "jobs",
]
