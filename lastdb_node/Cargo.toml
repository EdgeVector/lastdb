[package]
autotests = false
name = "lastdb_node"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "LastDB Mini semantic daemon (`lastdbd`) — the core database host (schema declare/query/mutate + app-identity + cloud sync) served over the owner Unix socket, with NO dependency on fold_db_node: no ingestion, no discovery, no desktop UI. This is the binary the Homebrew `edgevector/lastdb/lastdb` formula ships."

[lints]
workspace = true

[[bin]]
bench = false
test = false
name = "lastdbd"
path = "src/main.rs"

[[bin]]
bench = false
test = false
name = "lastdb-proxy"
path = "src/bin/lastdb_proxy.rs"

[[bin]]
bench = false
test = false
name = "lastdb"
path = "src/bin/lastdb.rs"

[[bin]]
bench = false
test = false
name = "lastdb_storage_recovery_rollback_proof"
path = "src/bin/lastdb_storage_recovery_rollback_proof.rs"

[features]
# Sentry crash/unclean-exit telemetry is compiled in by default (DSN-gated at
# runtime: no OBS_SENTRY_DSN ⇒ no client ⇒ every send is a structural no-op),
# so the shipped daemon can report crashes when a DSN is provisioned while dev
# / ephemeral nodes stay silent.
default = ["sentry-telemetry", "purging-allocator"]
sentry-telemetry = ["dep:sentry", "observability/sentry"]
# The shipped daemon uses mimalloc so LRU eviction returns freed pages to the
# kernel. Disable default features, then re-enable the product features without
# this one, to build the system-allocator comparison binary.
purging-allocator = ["dep:mimalloc", "dep:libmimalloc-sys"]

[dependencies]
lastdb_storage_policy = { path = "../lastdb_storage_policy" }
cloud_backup_protocol = { path = "../cloud_backup_protocol" }
zeroize = { workspace = true }
fold_db = { workspace = true }
env_flag = { workspace = true }
laststore = { workspace = true }
rustix = { version = "1", features = ["fs"] }
observability = { workspace = true, features = ["otel"] }
lastdb_uds = { workspace = true }
lastdb_identity = { workspace = true }
lastdb_host = { workspace = true }
folddb_profile = { workspace = true }
schema_types = { workspace = true }
schema_service_client = { workspace = true }
schema_service_core = { workspace = true }
app_identity_crypto = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["process", "io-util"] }
futures = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
async-trait = { workspace = true }
libc = "0.2"
signal-hook-registry = "1"
# Optional Sentry client, bound directly (not via the observability tracing
# stack) so the daemon keeps its stderr logging + launchd rotation. Feature set
# mirrors the observability crate's so the client can actually transmit.
sentry = { workspace = true, optional = true, features = ["backtrace", "contexts", "release-health", "reqwest", "rustls"] }
# `connect` / cloud-sync deps (pinned like fold_db_node's — reqwest/chrono are
# deliberately not workspace deps, feature sets diverge per member).
reqwest = { version = "0.12", features = ["json"] }
chrono = "0.4"
bip39 = "2"
hex = "0.4.3"
# Deliver seal path (mirrors fold_db_node auth_envelope + connection crypto).
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
base64 = "0.22"
tempfile = { workspace = true }
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
mimalloc = { version = "=0.1.52", optional = true, features = ["extended"] }
libmimalloc-sys = { version = "=0.1.49", optional = true, features = ["extended"] }

[target.'cfg(target_os = "macos")'.dependencies]
mach2 = "0.4"

[[bin]]
bench = false
test = false
name = "csync_e2e_write"
path = "src/bin/csync_e2e_write.rs"

[lib]
test = false
doctest = false
bench = false
