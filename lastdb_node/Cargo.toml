[package]
autotests = false
name = "lastdb_node"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "LastDB Mini semantic daemon (`lastdbd`) — the core database host (schema declare/query/mutate + app-identity + cloud sync) served over the owner Unix socket, with NO dependency on fold_db_node: no ingestion, no discovery, no desktop UI. This is the binary the Homebrew `edgevector/lastdb/lastdb` formula ships."

[lints]
workspace = true

[[bin]]
bench = false
test = false
name = "lastdbd"
path = "src/main.rs"

[[bin]]
bench = false
test = false
name = "lastdb"
path = "src/bin/lastdb.rs"

[features]
# Sentry crash/unclean-exit telemetry is compiled in by default (DSN-gated at
# runtime: no OBS_SENTRY_DSN ⇒ no client ⇒ every send is a structural no-op),
# so the shipped daemon can report crashes when a DSN is provisioned while dev
# / ephemeral nodes stay silent.
default = ["sentry-telemetry"]
sentry-telemetry = ["observability/sentry"]

[dependencies]
cloud_backup_protocol = { path = "../cloud_backup_protocol" }
zeroize = { workspace = true }
fold_db = { workspace = true }
laststore = { workspace = true }
rustix = { version = "1", features = ["fs", "process"] }
observability = { workspace = true, features = ["otel"] }
schema_types = { workspace = true }
semver = { workspace = true }
app_identity_crypto = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["process", "io-util", "sync", "time", "rt"] }
tokio-util = { version = "0.7", features = ["io"] }
futures = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
async-trait = { workspace = true }
libc = "0.2"
dirs = "6"
ring = "0.17"
signal-hook-registry = "1"
# `connect` / cloud-sync deps (pinned like fold_db_node's — reqwest/chrono are
# deliberately not workspace deps, feature sets diverge per member).
reqwest = { version = "0.12", features = ["json", "stream"] }
chrono = "0.4"
bip39 = "2"
hex = "0.4.3"
# Seal path (mirrors fold_db_node auth_envelope + connection crypto).
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
base64 = "0.22"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }

[lib]
test = false
doctest = false
bench = false

# Scoped sharing CI coverage only; all unrelated test targets stay retired.
[[test]]
name = "share_invitation_ci"
path = "operations/share_invitation_ci.rs"
harness = false
