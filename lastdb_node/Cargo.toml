[package]
autotests = false
name = "lastdb_node"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "LastDB Mini semantic daemon (`lastdbd`) — the core database host (schema declare/query/mutate + app-identity + cloud sync) served over the owner Unix socket, with NO dependency on fold_db_node: no ingestion, no discovery, no desktop UI. This is the binary the Homebrew `edgevector/lastdb/lastdb` formula ships."

[lints]
workspace = true

[[bin]]
bench = false
test = false
name = "lastdbd"
path = "src/main.rs"

[[bin]]
bench = false
test = false
name = "lastdb"
path = "src/bin/lastdb.rs"

[[bin]]
bench = false
test = false
name = "log_sync_relay_timeout_probe"
path = "src/bin/log_sync_relay_timeout_probe.rs"

[features]
# Sentry fault reporting is compiled in by default and always on. User-device
# builds embed the public lastdb-mini DSN and report with environment=user.
# There is no runtime switch to disable reporting.
default = ["sentry-telemetry"]
sentry-telemetry = ["observability/sentry"]

[dependencies]
cloud_backup_protocol = { path = "../cloud_backup_protocol" }
database_policy = { path = "../database_policy" }
mutation_log = { path = "../mutation_log" }
relay_protocol = { path = "../relay_protocol" }
relay_transfer = { path = "../relay_transfer" }
signed_history_materialize = { path = "../signed_history_materialize" }
zeroize = { workspace = true }
fold_db = { workspace = true }
rustix = { version = "1", features = ["fs", "process"] }
observability = { workspace = true }
schema_types = { workspace = true }
semver = { workspace = true }
app_identity_crypto = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "process", "io-util", "sync", "time", "rt"] }
futures = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
libc = "0.2"
# `connect` / cloud-sync deps (pinned like fold_db_node's — reqwest/chrono are
# deliberately not workspace deps, feature sets diverge per member).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "charset", "http2", "json", "stream"] }
chrono = "0.4"
bip39 = "2"
# Recipient contact / cache-key derivation (mirrors fold_db_node crypto).
hkdf = "0.12"
sha2 = { workspace = true }
x25519-dalek = { version = "2", features = ["static_secrets"] }
base64 = { workspace = true }
rand = "0.8"
uuid = { workspace = true, features = ["v4"] }

[lib]
test = false
doctest = false
bench = false
