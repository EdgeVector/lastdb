<svg viewBox="0 0 780 700" xmlns="http://www.w3.org/2000/svg"
     style="width:100%;height:auto;max-width:780px;display:block;margin:0 auto;background:#fff"
     font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#666" stroke-width="1"/>
    </pattern>
    <marker id="arr" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#000"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="780" height="700" fill="#fff"/>
  <text x="20" y="24" font-size="11" fill="#000">TARGET — ONE QUESTION FOR EACH LINE</text>

  <!-- process + transport -->
  <rect x="230" y="40" width="320" height="50" fill="none" stroke="#000" stroke-width="2"/>
  <text x="242" y="60" font-size="11" fill="#000">LASTDB_NODE — PROCESS</text>
  <text x="242" y="78" font-size="10" fill="#666">env once · clock · ids · runtime</text>
  <rect x="580" y="40" width="180" height="50" fill="none" stroke="#000" stroke-width="2"/>
  <text x="592" y="60" font-size="11" fill="#000">BACKUP_TRANSPORT</text>
  <text x="592" y="78" font-size="10" fill="#666">reqwest · leaf crate</text>
  <line x1="550" y1="65" x2="580" y2="65" stroke="#000" stroke-width="1" marker-end="url(#arr)"/>
  <rect x="548" y="63" width="4" height="4" fill="#000"/>
  <line x1="390" y1="90" x2="390" y2="120" stroke="#000" stroke-width="1" marker-end="url(#arr)"/>
  <rect x="388" y="88" width="4" height="4" fill="#000"/>

  <!-- fold_db: LastDB, meaning -->
  <rect x="20" y="120" width="740" height="260" fill="none" stroke="#000" stroke-width="2"/>
  <text x="36" y="142" font-size="11" fill="#000">FOLD_DB — LASTDB · WHAT A RECORD MEANS</text>
  <text x="556" y="142" font-size="10" fill="#666">one owner per concept</text>

  <!-- owners -->
  <rect x="40" y="158" width="128" height="92" fill="none" stroke="#000" stroke-width="2"/>
  <text x="50" y="176" font-size="11" fill="#000">SCHEMA</text>
  <text x="50" y="192" font-size="9" fill="#666">store · keys</text>
  <rect x="50" y="210" width="108" height="30" fill="none" stroke="#000" stroke-width="1"/>
  <text x="58" y="229" font-size="9" fill="#000">MODEL · PURE</text>

  <rect x="182" y="158" width="128" height="92" fill="none" stroke="#000" stroke-width="1"/>
  <text x="192" y="176" font-size="11" fill="#000">FIELD</text>
  <text x="272" y="176" font-size="9" fill="#666">#844</text>
  <text x="192" y="192" font-size="9" fill="#666">values · filters</text>
  <rect x="192" y="210" width="108" height="30" fill="none" stroke="#000" stroke-width="1"/>
  <text x="200" y="229" font-size="9" fill="#000">MODEL ONLY</text>

  <rect x="324" y="158" width="128" height="92" fill="none" stroke="#000" stroke-width="2"/>
  <text x="334" y="176" font-size="11" fill="#000">FIELD_KEY</text>
  <text x="414" y="176" font-size="9" fill="#666">#842</text>
  <text x="334" y="192" font-size="9" fill="#666">key bundles · locks · drain</text>
  <rect x="334" y="210" width="108" height="30" fill="none" stroke="#000" stroke-width="1"/>
  <text x="342" y="229" font-size="9" fill="#000">MODEL · PURE</text>

  <rect x="466" y="158" width="128" height="92" fill="none" stroke="#000" stroke-width="2"/>
  <text x="476" y="176" font-size="11" fill="#000">RECORD</text>
  <text x="476" y="192" font-size="9" fill="#666">bodies · counters</text>
  <rect x="476" y="210" width="108" height="30" fill="none" stroke="#000" stroke-width="1"/>
  <text x="484" y="229" font-size="9" fill="#000">MODEL · PURE</text>

  <rect x="608" y="158" width="128" height="92" fill="none" stroke="#000" stroke-width="2"/>
  <text x="618" y="176" font-size="11" fill="#000">WARM SET</text>
  <text x="698" y="176" font-size="9" fill="#666">#843</text>
  <text x="618" y="192" font-size="9" fill="#666">byte limit · clean</text>
  <rect x="618" y="210" width="108" height="30" fill="none" stroke="#000" stroke-width="1"/>
  <text x="626" y="229" font-size="9" fill="#000">MODEL · PURE</text>

  <!-- level order -->
  <line x1="168" y1="200" x2="182" y2="200" stroke="#000" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="310" y1="200" x2="324" y2="200" stroke="#000" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="452" y1="200" x2="466" y2="200" stroke="#000" stroke-width="1" marker-end="url(#arr)"/>

  <!-- verbs as module groups -->
  <rect x="40" y="262" width="554" height="30" fill="none" stroke="#000" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="52" y="281" font-size="10" fill="#000">WRITE PATH · READ PATH · MAINTENANCE — module groups</text>

  <!-- commit plan document -->
  <polygon points="290,308 486,308 500,322 500,362 290,362" fill="none" stroke="#000" stroke-width="1"/>
  <polyline points="486,308 486,322 500,322" fill="none" stroke="#000" stroke-width="1"/>
  <text x="308" y="328" font-size="11" fill="#000">COMMIT PLAN</text>
  <text x="308" y="346" font-size="9" fill="#666">entries from each owner, one batch</text>
  <line x1="390" y1="292" x2="390" y2="308" stroke="#000" stroke-width="1" marker-end="url(#arr)"/>
  <rect x="388" y="290" width="4" height="4" fill="#000"/>

  <!-- the LastDB / LastStore line -->
  <line x1="20" y1="405" x2="760" y2="405" stroke="#000" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="24" y="398" font-size="10" fill="#000">LASTDB / LASTSTORE LINE</text>
  <text x="420" y="398" font-size="10" fill="#666">meaning above · keys and bytes below</text>

  <line x1="390" y1="362" x2="390" y2="430" stroke="#000" stroke-width="1" marker-end="url(#arr)"/>
  <rect x="388" y="360" width="4" height="4" fill="#000"/>

  <!-- store -->
  <rect x="20" y="430" width="740" height="90" fill="none" stroke="#000" stroke-width="2"/>
  <text x="36" y="452" font-size="11" fill="#000">LASTDB_STORE — KEYS AND BYTES</text>
  <text x="36" y="472" font-size="10" fill="#666">commit · queue · entries · files · cleanup · CAS delete</text>
  <text x="36" y="490" font-size="10" fill="#666">encryption at rest · byte backup · space policy</text>
  <text x="36" y="508" font-size="10" fill="#666">knows no schema, field_key, record, or warm set</text>

  <!-- publication hook: store calls a trait that the warm set implements -->
  <line x1="672" y1="430" x2="672" y2="250" stroke="#000" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <rect x="670" y="428" width="4" height="4" fill="#000"/>
  <text x="604" y="452" font-size="9" fill="#000">dyn MemoryPublication</text>
  <text x="604" y="466" font-size="9" fill="#666">hook · #843</text>

  <!-- laststore + disk -->
  <rect x="270" y="548" width="240" height="44" fill="none" stroke="#000" stroke-width="2"/>
  <text x="282" y="566" font-size="11" fill="#000">LASTSTORE CRATE</text>
  <text x="282" y="582" font-size="9" fill="#666">homes · pages · file handles</text>
  <line x1="390" y1="520" x2="390" y2="548" stroke="#000" stroke-width="1" marker-end="url(#arr)"/>
  <rect x="388" y="518" width="4" height="4" fill="#000"/>
  <line x1="390" y1="592" x2="390" y2="616" stroke="#000" stroke-width="1" marker-end="url(#arr)"/>
  <rect x="388" y="590" width="4" height="4" fill="#000"/>
  <path d="M 340 624 A 50 9 0 0 1 440 624 L 440 662 A 50 9 0 0 1 340 662 Z"
        fill="url(#hatch)" stroke="#000" stroke-width="1"/>
  <ellipse cx="390" cy="624" rx="50" ry="9" fill="#fff" stroke="#000" stroke-width="1"/>
  <text x="452" y="648" font-size="10" fill="#000">DISK</text>

  <!-- small consumers + primitives leaf -->
  <rect x="20" y="548" width="190" height="44" fill="none" stroke="#000" stroke-width="2"/>
  <text x="32" y="566" font-size="11" fill="#000">LASTDB_UDS · IDENTITY</text>
  <text x="32" y="582" font-size="9" fill="#666">socket · identity.key</text>
  <line x1="115" y1="592" x2="115" y2="628" stroke="#000" stroke-width="1" marker-end="url(#arr)"/>
  <rect x="113" y="590" width="4" height="4" fill="#000"/>
  <rect x="20" y="628" width="190" height="44" fill="none" stroke="#000" stroke-width="1"/>
  <text x="32" y="646" font-size="11" fill="#000">LASTDB_PRIMITIVES</text>
  <text x="32" y="662" font-size="9" fill="#666">hex · keys · access types</text>

  <!-- legend -->
  <text x="580" y="562" font-size="10" fill="#000">LEGEND</text>
  <rect x="580" y="572" width="26" height="12" fill="none" stroke="#000" stroke-width="2"/>
  <text x="614" y="582" font-size="9" fill="#000">OWNS STATE OR I/O</text>
  <rect x="580" y="592" width="26" height="12" fill="none" stroke="#000" stroke-width="1"/>
  <text x="614" y="602" font-size="9" fill="#000">PURE</text>
  <line x1="580" y1="618" x2="606" y2="618" stroke="#000" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="614" y="622" font-size="9" fill="#000">HOOK OR GROUP</text>
  <line x1="580" y1="638" x2="606" y2="638" stroke="#000" stroke-width="1" marker-end="url(#arr)"/>
  <text x="614" y="642" font-size="9" fill="#000">DEPENDS ON · CALLS</text>
  <text x="580" y="662" font-size="9" fill="#666">#nnn = trial PR</text>
</svg>
