<svg viewBox="0 0 780 454" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;max-width:780px;display:block;margin:0 auto" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#666" stroke-width="1"/>
    </pattern>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" fill="#000"/>
    </marker>
  </defs>

  <text x="20" y="22" fill="#000" font-size="13">ONE PURGE BATCH UNDER THE WRITE GATE</text>
  <text x="20" y="38" fill="#666" font-size="10">K keys, F fields. All reads see the accepted batches. All writes join one pending batch.</text>

  <!-- client -->
  <rect x="20" y="170" width="110" height="64" fill="none" stroke="#000" stroke-width="1"/>
  <text x="75" y="196" text-anchor="middle" fill="#000">TTL SWEEP</text>
  <text x="75" y="212" text-anchor="middle" fill="#000">OR CLIENT</text>
  <text x="75" y="226" text-anchor="middle" fill="#666" font-size="10">K keys</text>
  <polyline points="130,202 170,202" fill="none" stroke="#000" stroke-width="1" marker-end="url(#arr)"/>
  <rect x="128" y="200" width="4" height="4" fill="#000"/>

  <!-- gate -->
  <rect x="170" y="52" width="534" height="376" fill="none" stroke="#000" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="182" y="70" fill="#000">WRITE GATE</text>
  <text x="262" y="70" fill="#666" font-size="10">one holder at a time. The flush wait is outside.</text>

  <!-- stores (read side) -->
  <path d="M 196 88 A 32 6 0 0 1 260 88 L 260 108 A 32 6 0 0 1 196 108 Z" fill="url(#hatch)" stroke="#000" stroke-width="1"/>
  <ellipse cx="228" cy="88" rx="32" ry="6" fill="#fff" stroke="#000" stroke-width="1"/>
  <text x="266" y="102" fill="#666" font-size="10">tips</text>
  <path d="M 316 88 A 32 6 0 0 1 380 88 L 380 108 A 32 6 0 0 1 316 108 Z" fill="url(#hatch)" stroke="#000" stroke-width="1"/>
  <ellipse cx="348" cy="88" rx="32" ry="6" fill="#fff" stroke="#000" stroke-width="1"/>
  <text x="386" y="102" fill="#666" font-size="10">records</text>

  <!-- read steps -->
  <rect x="190" y="140" width="76" height="48" fill="none" stroke="#000" stroke-width="1"/>
  <text x="228" y="160" text-anchor="middle" fill="#000">READ 1</text>
  <text x="228" y="175" text-anchor="middle" fill="#666" font-size="10">K×F tips</text>
  <rect x="310" y="140" width="76" height="48" fill="none" stroke="#000" stroke-width="1"/>
  <text x="348" y="160" text-anchor="middle" fill="#000">READ 2</text>
  <text x="348" y="175" text-anchor="middle" fill="#666" font-size="10">D counters</text>
  <polyline points="228,114 228,140" fill="none" stroke="#000" stroke-width="1" marker-end="url(#arr)"/>
  <polyline points="348,114 348,140" fill="none" stroke="#000" stroke-width="1" marker-end="url(#arr)"/>
  <polyline points="266,164 310,164" fill="none" stroke="#000" stroke-width="1" marker-end="url(#arr)"/>

  <!-- planner decision -->
  <polygon points="470,138 540,164 470,190 400,164" fill="none" stroke="#000" stroke-width="1"/>
  <text x="470" y="160" text-anchor="middle" fill="#000">PLANNER</text>
  <text x="470" y="174" text-anchor="middle" fill="#666" font-size="10">refs = 0 ?</text>
  <polyline points="386,164 400,164" fill="none" stroke="#000" stroke-width="1" marker-end="url(#arr)"/>

  <!-- batch container -->
  <rect x="190" y="256" width="500" height="132" fill="none" stroke="#000" stroke-width="2"/>
  <text x="202" y="274" fill="#000">ONE ATOMIC BATCH</text>
  <text x="330" y="274" fill="#666" font-size="10">at most 3·K·F + F + K + 1 records. K=16, F=6: at most 311.</text>

  <!-- records: small squares -->
  <rect x="206" y="294" width="30" height="30" fill="url(#hatch)" stroke="#000" stroke-width="1"/>
  <text x="221" y="342" text-anchor="middle" fill="#000" font-size="10">TIP</text>
  <text x="221" y="354" text-anchor="middle" fill="#666" font-size="10">delete</text>

  <rect x="290" y="294" width="30" height="30" fill="url(#hatch)" stroke="#000" stroke-width="1"/>
  <text x="305" y="342" text-anchor="middle" fill="#000" font-size="10">COUNTER</text>
  <text x="305" y="354" text-anchor="middle" fill="#666" font-size="10">refs - n</text>

  <rect x="384" y="294" width="30" height="30" fill="none" stroke="#000" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="399" y="342" text-anchor="middle" fill="#000" font-size="10">COUNTER</text>
  <text x="399" y="354" text-anchor="middle" fill="#666" font-size="10">delete</text>
  <text x="399" y="366" text-anchor="middle" fill="#666" font-size="10">if zero</text>

  <rect x="478" y="294" width="30" height="30" fill="none" stroke="#000" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="493" y="342" text-anchor="middle" fill="#000" font-size="10">BODY</text>
  <text x="493" y="354" text-anchor="middle" fill="#666" font-size="10">delete</text>
  <text x="493" y="366" text-anchor="middle" fill="#666" font-size="10">if zero</text>

  <rect x="560" y="294" width="30" height="30" fill="url(#hatch)" stroke="#000" stroke-width="1"/>
  <text x="575" y="342" text-anchor="middle" fill="#000" font-size="10">HEADER</text>
  <text x="575" y="354" text-anchor="middle" fill="#666" font-size="10">slots - K</text>

  <rect x="636" y="294" width="30" height="30" fill="url(#hatch)" stroke="#000" stroke-width="1"/>
  <text x="651" y="342" text-anchor="middle" fill="#000" font-size="10">LEDGER</text>
  <text x="651" y="354" text-anchor="middle" fill="#666" font-size="10">one</text>

  <!-- planner to batch: two branches -->
  <polyline points="440,184 440,236 305,236 305,256" fill="none" stroke="#000" stroke-width="1" marker-end="url(#arr)"/>
  <rect x="438" y="182" width="4" height="4" fill="#000"/>
  <text x="372" y="230" text-anchor="middle" fill="#666" font-size="10">no: write counter</text>
  <polyline points="500,184 500,256" fill="none" stroke="#000" stroke-width="1" marker-end="url(#arr)"/>
  <rect x="498" y="182" width="4" height="4" fill="#000"/>
  <text x="508" y="214" fill="#666" font-size="10">yes: delete</text>
  <text x="508" y="226" fill="#666" font-size="10">counter + body</text>

  <!-- journal -->
  <path d="M 714 120 A 30 6 0 0 1 774 120 L 774 160 A 30 6 0 0 1 714 160 Z" fill="url(#hatch)" stroke="#000" stroke-width="1"/>
  <ellipse cx="744" cy="120" rx="30" ry="6" fill="#fff" stroke="#000" stroke-width="1"/>
  <text x="744" y="178" text-anchor="middle" fill="#000">JOURNAL</text>
  <text x="744" y="192" text-anchor="middle" fill="#666" font-size="10">one batch</text>
  <polyline points="690,322 744,322 744,200" fill="none" stroke="#000" stroke-width="1" marker-end="url(#arr)"/>
  <rect x="688" y="320" width="4" height="4" fill="#000"/>

  <!-- dimension: reads -->
  <line x1="190" y1="198" x2="386" y2="198" stroke="#666" stroke-width="1"/>
  <line x1="190" y1="193" x2="190" y2="203" stroke="#666" stroke-width="1"/>
  <line x1="386" y1="193" x2="386" y2="203" stroke="#666" stroke-width="1"/>
  <text x="288" y="214" text-anchor="middle" fill="#666" font-size="10">about 200 examined keys of 40,000</text>

  <!-- legend -->
  <text x="20" y="446" fill="#666" font-size="10">hatch = record that exists. dashed = record written only when the count is zero. cylinder = store.</text>
</svg>
